name: Achados B5.10 validation

on:
  push:
    branches:
      - validation/achados-b510-node24
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: achados-b510-validation
  cancel-in-progress: false

env:
  BASE_SHA: 514f93c3a5aa92bf2c97417bfdd677337752a0e6

jobs:
  node24-focal:
    name: GitHub-hosted Linux / Node 24 / Achados B5.10
    if: (github.event_name == 'push' && github.ref == 'refs/heads/validation/achados-b510-node24') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/achados-b510-node24')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove isolated CI-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/validation/achados-b510-node24
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${PGPASSWORD:-}"
          test "$(grep -c '^  deploy:' .github/workflows/achados-b510-validation.yml)" -eq 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify functional scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check
          expected='modules/manual-v2/ofertas-v2-achados.js modules/manual-v2/ofertas-v2-listas.js tests/manual-v2-achados-universal-provenance.test.js'
          actual="$(git diff --name-only "$BASE_SHA" HEAD -- . ':(exclude).github/workflows/achados-b510-validation.yml' | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          test "$actual" = "$expected"
          node --check modules/manual-v2/ofertas-v2-achados.js
          node --check modules/manual-v2/ofertas-v2-listas.js
          node --check tests/manual-v2-achados-universal-provenance.test.js

      - name: Achados and Manual V2 focal tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/manual-v2-achados-universal-provenance.test.js
          node tests/manual-v2-achados-actions.test.js
          node tests/ofertas-v2-achados-listas.test.js
          node tests/ofertas-v2-achados-dedupe-memoria.test.js
          node tests/manual-v2-dispatcher.test.js
          node tests/manual-v2-idempotency.test.js
          node tests/template-amazon-b51.test.js
          node tests/template-marketplaces-b54.test.js
          node tests/contrato-comercial-final-universal.test.js

      - name: Protected module regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/mensageiro-programacoes.test.cjs
          node tests/mensageiro-gerente-grupo.test.cjs
          node tests/mensageiro-multiperfil-isolamento.test.cjs
          node tests/optimus-auto-clean-v1-shadow.test.js
          node tests/auto-clean-gc-relay-phase1.test.js
          node tests/engine-processor-candidate-pool.test.js
          node tests/engine-importer-candidate-pool.test.js
          node tests/engine-distributor-candidate-pool.test.js
          node tests/engine-validator-candidate-pool.test.js
