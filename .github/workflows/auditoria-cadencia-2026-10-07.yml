name: Auditoria factual de cadencia e Turbo 2026-10-07

on:
  push:
    branches:
      - audit/read-only-envios-2026-10-07
  workflow_dispatch:

jobs:
  cadence-audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Production target preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo runner_name=$RUNNER_NAME
          echo hostname=$(hostname)
          echo cutoff_utc=2026-10-07T23:52:05Z
          printf 'production_head='; git -C /opt/optimus/backend rev-parse HEAD
      - name: Read-only cadence and Turbo aggregation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --max-old-space-size=4096 <<'NODE'
          const fs=require('fs'),path=require('path');
          const START=Date.parse('2026-10-07T03:00:00Z'), CUTOFF=Date.parse('2026-10-07T23:52:05Z');
          const workspaces=['user_pss60lus','user_g3qkc18m','user_b2oogwwl','user_zbbk3fdr'], root='/opt/optimus/data/clientes';
          const ms=v=>{if(v==null||v==='')return NaN;if(typeof v==='number')return v;const n=Date.parse(v);return Number.isFinite(n)?n:Number(v);};
          const inPeriod=v=>{const n=ms(v);return Number.isFinite(n)&&n>=START&&n<=CUTOFF;};
          const str=v=>v==null?'':String(v).trim();
          const idOf=o=>str(o?.offerId||o?.ofertaId||o?.idOferta||o?.trackingId||o?.id||'');
          const nonApp=d=>{const s=str(d?.estado||d?.state||d?.status||d?.statusOperacional||d?.motivo).toLowerCase();return d?.aplicavel===false||['nao_compativel','incompativel','nao_aplicavel','bloqueado_repeticao_2h'].some(x=>s.includes(x));};
          const cadenceKeys=/intervalo|cadenc|turbo|proximoenvio|ultimoenvio|esperams|restantems|liberad|janela|horar|limite|credito|claim|reserv|fair|prioridade|provider|executor|dedupe|compat|enviado|dataenvio|confirmado|sentat|timestamp/i;
          const causeRe=/fair|prior|provider|executor|ocupad|capacidad|claim|reserv|credit|limite|janela|horar|dedupe|repet|retenc|authority|imagem|sem_imagem|bloque|nao_compativ|erro|falh/i;
          const events=[], fields=new Map(), turboFacts=[]; const seenObjs=new WeakSet();
          function numField(pairs,re){for(const x of pairs){if(re.test(x.key)){const n=Number(x.value);if(Number.isFinite(n))return n;}}return NaN;}
          function timeField(pairs,re){for(const x of pairs){if(re.test(x.key)){const n=ms(x.value);if(Number.isFinite(n))return n;}}return NaN;}
          function flatten(o,depth=0,prefix='',out=[]){if(o==null||depth>3)return out;if(Array.isArray(o)){for(let i=0;i<Math.min(o.length,20);i++)flatten(o[i],depth+1,prefix+'['+i+']',out);return out;}if(typeof o!=='object')return out;for(const [k,v] of Object.entries(o)){const p=prefix?prefix+'.'+k:k;if(cadenceKeys.test(k)){let val=Array.isArray(v)?'array:'+v.length:(v&&typeof v==='object'?'object':v);out.push({key:k,path:p,value:val});}if(v&&typeof v==='object')flatten(v,depth+1,p,out);}return out;}
          function classifyCause(pairs){const s=pairs.map(x=>str(x.key)+'='+str(x.value)).join(' ').toLowerCase();const out=[...new Set(pairs.filter(x=>causeRe.test(str(x.key)+' '+str(x.value))).map(x=>str(x.value)).filter(Boolean))];return {text:s,signals:out.slice(0,8)};}
          function processDest(w,source,offer,d,ancestors){if(!d||typeof d!=='object'||nonApp(d))return;const send=str(d.enviadoEm||d.dataEnvio||d.confirmadoEm||d.sentAt||d.sent_at||d.enviadoAt||d.timestampEnvio||d.data||'');if(!inPeriod(send))return;const pairs=flatten({...ancestors.reduce((a,x)=>Object.assign(a,x),{}),...d});const tipo=str(d.tipo||d.canal||d.kind||'unknown').toLowerCase();const destId=str(d.destinoId||d.destinationId||d.canalId||d.id||tipo);const expectedMs=numField(pairs,/^(intervaloMs|intervaloEfetivoMs|intervaloAplicadoMs|turboIntervaloMs)$/i);const mins=numField(pairs,/^(intervaloEfetivoMin|intervaloAplicadoMin|intervaloNormalMin|intervaloMin|turboCupomMin)$/i);const exp=Number.isFinite(expectedMs)?expectedMs:(Number.isFinite(mins)?mins*60000:NaN);const turbo=pairs.some(x=>/^turboAplicado$/i.test(x.key)&&x.value===true)||pairs.some(x=>/^turboAplicado$/i.test(x.key)&&str(x.value).toLowerCase()==='true');const last=timeField(pairs,/^(ultimoEnvioEm|ultimoEnvioAt|lastSentAt|dataUltimoEnvio)$/i);const next=timeField(pairs,/^proximoEnvioPermitidoEm$/i);const real=Number.isFinite(last)?ms(send)-last:NaN;const slot=Number.isFinite(next)?next:(Number.isFinite(last)&&Number.isFinite(exp)?last+exp:NaN);const early=Number.isFinite(slot)&&ms(send)<slot;const delay=Number.isFinite(slot)&&ms(send)>=slot?ms(send)-slot:NaN;const c=classifyCause(pairs);const ready=pairs.some(x=>(/^liberado$/i.test(x.key)&&x.value===true)||(/^destinosLiberados$/i.test(x.key)&&Number(x.value)>0)||(/^aplicavel$/i.test(x.key)&&x.value===true));const key=w+'|'+destId+'|'+send+'|'+idOf(offer);if(events.some(e=>e.key===key))return;const ev={key,workspace:w,source,offerId:idOf(offer),destId,canal:tipo,sendAt:send,expectedMs:Number.isFinite(exp)?exp:null,intervaloMin:Number.isFinite(mins)?mins:null,lastAt:Number.isFinite(last)?new Date(last).toISOString():'',nextAt:Number.isFinite(next)?new Date(next).toISOString():'',realMs:Number.isFinite(real)?real:null,delayMs:Number.isFinite(delay)?delay:null,early,turbo,ready,causeSignals:c.signals,fields:pairs.filter(x=>cadenceKeys.test(x.key)).slice(0,20)};if(early)ev.classification='CEDO';else if(!Number.isFinite(slot))ev.classification='INDETERMINADO';else if(delay===0)ev.classification='NO_SLOT';else if(delay>0&&c.signals.length)ev.classification='ATRASADO_COM_CAUSA';else if(delay>0&&ready)ev.classification='ATRASADO_SEM_CAUSA';else ev.classification='INDETERMINADO';events.push(ev);if(turbo)turboFacts.push(ev);}
          function walk(w,source,v,ancestors=[],depth=0){if(v==null||depth>12)return;if(Array.isArray(v)){for(const x of v.slice(0,100))walk(w,source,x,ancestors,depth+1);return;}if(typeof v!=='object'||seenObjs.has(v))return;seenObjs.add(v);const offer=v;const local={};for(const [k,x] of Object.entries(v)){if(cadenceKeys.test(k))local[k]=x;}const nextAnc=[...ancestors,local];if(Array.isArray(v.destinosEstado))for(const d of v.destinosEstado)processDest(w,source,offer,d,nextAnc);if(Array.isArray(v.destinosEnviados))for(const d of v.destinosEnviados)processDest(w,source,offer,d,nextAnc);if(Array.isArray(v.enviosConfirmados))for(const d of v.enviosConfirmados)processDest(w,source,offer,d,nextAnc);if(Array.isArray(v.logsEnvio))for(const d of v.logsEnvio)processDest(w,source,offer,d,nextAnc);if(v.providerMessageId||v.sendMessageSucesso===true||v.sucesso===true||v.enviadoEm||v.dataEnvio||v.confirmadoEm)processDest(w,source,offer,v,nextAnc);for(const [k,x] of Object.entries(v)){if(cadenceKeys.test(k)){const c=fields.get(k)||{count:0,samples:[]};c.count++;if(c.samples.length<3)c.samples.push(typeof x==='object'?'object':x);fields.set(k,c);}if(x&&typeof x==='object')walk(w,source,x,nextAnc,depth+1);}}
          for(const w of workspaces){for(const n of ['fila.json','fila-historico.json']){const f=path.join(root,w,n);if(!fs.existsSync(f))continue;let v;try{v=JSON.parse(fs.readFileSync(f,'utf8'));}catch(e){continue;}walk(w,n,v,[],0);v=null;}}
          const dedup=events;const nums=a=>a.filter(Number.isFinite).sort((x,y)=>x-y);const pct=(a,p)=>{const q=nums(a);if(!q.length)return null;return q[Math.min(q.length-1,Math.floor((q.length-1)*p))];};
          const intervals={};for(const e of dedup){const k=e.expectedMs==null?'unknown':String(e.expectedMs);const b=intervals[k]||(intervals[k]={intervalMs:e.expectedMs,envios:0,cedo:0,no_slot:0,comCausa:0,semCausa:0,indeterminados:0});b.envios++;if(e.classification==='CEDO')b.cedo++;if(e.classification==='NO_SLOT')b.no_slot++;if(e.classification==='ATRASADO_COM_CAUSA')b.comCausa++;if(e.classification==='ATRASADO_SEM_CAUSA')b.semCausa++;if(e.classification==='INDETERMINADO')b.indeterminados++;}
          const byDest={};for(const e of dedup){const k=e.workspace+'|'+e.destId+'|'+e.canal;const b=byDest[k]||(byDest[k]={workspace:e.workspace,destId:e.destId,canal:e.canal,intervals:new Set(),envios:0,delays:[],cedo:0,semCausa:0,turbo:false});b.envios++;if(e.expectedMs!=null)b.intervals.add(e.expectedMs);if(e.delayMs!=null)b.delays.push(e.delayMs);if(e.early)b.cedo++;if(e.classification==='ATRASADO_SEM_CAUSA')b.semCausa++;if(e.turbo)b.turbo=true;}
          const destRows=Object.values(byDest).map(b=>({workspace:b.workspace,destId:b.destId,canal:b.canal,intervalsMs:[...b.intervals].sort((a,c)=>a-c),envios:b.envios,p50AtrasoMs:pct(b.delays,.5),p95AtrasoMs:pct(b.delays,.95),cedo:b.cedo,atrasadoSemCausa:b.semCausa,turbo:b.turbo}));
          const count=k=>dedup.filter(e=>e.classification===k).length;const gateViol=turboFacts.filter(e=>e.causeSignals.some(x=>/limite|credito|nao_compativ|janela|dedupe|bloque/i.test(x))).length;const turbo90=turboFacts.filter(e=>e.expectedMs===90000).length;const turboOther=turboFacts.filter(e=>e.expectedMs!==90000).length;
          console.log('CADENCE_SUMMARY',JSON.stringify({periodStart:'2026-10-07T00:00:00-03:00',cutoff:'2026-10-07T20:52:05-03:00',confirmedDestinationSends:dedup.length,cedo:count('CEDO'),noSlot:count('NO_SLOT'),atrasadoComCausa:count('ATRASADO_COM_CAUSA'),atrasadoSemCausa:count('ATRASADO_SEM_CAUSA'),indeterminado:count('INDETERMINADO'),turboOccurrences:turboFacts.length,turbo90ms:turbo90,turboOther:turboOther,turboGateSignals:gateViol,intervals}));
          console.log('DESTINATION_SUMMARY',JSON.stringify(destRows));
          console.log('TURBO_SAMPLES',JSON.stringify(turboFacts.slice(0,30)));
          console.log('CADENCE_SAMPLES',JSON.stringify(dedup.filter(e=>e.early||e.classification==='ATRASADO_SEM_CAUSA'||e.classification==='INDETERMINADO').slice(0,40)));
          console.log('FIELD_PRESENCE',JSON.stringify([...fields.entries()].filter(([k])=>cadenceKeys.test(k)).sort((a,b)=>b[1].count-a[1].count).slice(0,100)));
          NODE
