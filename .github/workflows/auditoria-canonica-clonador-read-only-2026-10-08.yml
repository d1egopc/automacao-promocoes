              ROW_NUMBER() OVER (PARTITION BY COALESCE(NULLIF(TRIM(j.cliente_id),''),'workspace_desconhecido') ORDER BY COALESCE(e.capturado_em,j.criado_em),j.criado_em,j.id) AS workspace_rank_pre_importer
              FROM engine_jobs_cliente j LEFT JOIN engine_eventos_brutos e ON e.id=j.evento_id
