name: Auditoria terminal de vazao read-only 2026-10-08

on:
  push:
    branches:
      - audit/clonador-duravel-2026-10-08

permissions:
  contents: read

concurrency:
  group: auditoria-canonica-clonador-read-only-2026-10-08
  cancel-in-progress: false

jobs:
  terminal-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/clonador-duravel-2026-10-08'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Terminal selector and capacity audit (SELECT only)
        shell: bash
        run: |
          set -Eeuo pipefail
          BACKEND=/opt/optimus/backend
