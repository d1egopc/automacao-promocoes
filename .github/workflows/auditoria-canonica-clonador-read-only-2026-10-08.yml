          printf 'TERMINAL_POSTFLIGHT sha=%s backend=%s postgres=%s status=%s\n' "$after_sha" "$after_backend" "$after_pg" "${after_status:-CLEAN}"
          [[ "$after_sha" == "$before_sha" && "$after_status" == "$before_status" && "$after_backend" == "$before_backend" && "$after_pg" == "$before_pg" ]] || { echo 'TERMINAL_POSTFLIGHT_CHANGED'; exit 3; }
          echo 'TERMINAL_POSTFLIGHT_STABLE'
          exit "$audit_rc"
  canonical-audit:
    if: ${{ false }}
