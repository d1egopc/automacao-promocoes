              const rows = Array.isArray(response) ? response : (response && response.resultado && Array.isArray(response.resultado.rows) ? response.resultado.rows : (response && Array.isArray(response.rows) ? response.rows : (response && Array.isArray(response.result) ? response.result : [])));
