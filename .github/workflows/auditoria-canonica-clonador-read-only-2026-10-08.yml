          function parseJson(v) { if (v && typeof v === 'object') return v; if (typeof v === 'string') { try { return JSON.parse(v); } catch (_) {} } return {}; }
          function id(v) { if (v === null || v === undefined) return null; const s = String(v).trim(); return /^\d+$/.test(s) ? s : null; }
          function time(v) { if (v === null || v === undefined || v === '') return null; const d = new Date(v); return Number.isFinite(d.getTime()) ? d.toISOString() : String(v); }
          function arr(v) { return Array.isArray(v) ? v : []; }
          function first(o, names) { for (const n of names) if (o && o[n] !== undefined && o[n] !== null && o[n] !== '') return o[n]; return null; }
          function norm(v) { return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
          function isMl(v) { return /mercado.?livre|mercadolivre|meli/.test(norm(v)); }
          async function q(label, sql, params = []) {
