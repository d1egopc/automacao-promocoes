            const origin = x => String(x.origem_fluxo_explicita_pre_importer || x.origemFluxo || '').toLowerCase();
            const date = x => new Date(x).getTime();
            async function select(label, sql, params = []) {
              if (!/^\s*(SELECT|WITH)\b/i.test(sql) || /\b(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|DROP|CREATE|MERGE|CALL)\b/i.test(sql)) throw new Error('non_select_sql:' + label);
