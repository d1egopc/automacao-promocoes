            const targets = pending.filter(x => origin(x)==='clonador_grupos' && date(x.origem_comercial_pre_importer) < date(now)-30*60000);
            const expired = await select('all_expired_pending', `SELECT j.id,j.cliente_id,j.criado_em,j.prioridade,
