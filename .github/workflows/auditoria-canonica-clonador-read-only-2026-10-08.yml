    timeout-minutes: 25
    steps:
      - name: Preflight and canonical V2 audit (SELECT only)
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly EXPECTED_SHA='568c4fe1f848a9ad695929dd0d5706defa822ad7'
          readonly BACKEND='/opt/optimus/backend'
