              const r = spawnSync('docker', ['logs', '--since', '2026-10-08T18:00:00Z', process.env.AUDIT_BACKEND_ID || ''], { encoding:'utf8', maxBuffer:64*1024*1024, timeout:90000 });
              const lines = ((r.stdout || '') + '\n' + (r.stderr || '')).split(/\r?\n/).filter(line => ids.some(id => line.includes(id)));
              return lines.slice(0, 240).map(line => line.slice(0, 700));
            }
            function codeAudit() {
              const files = ['index.js','modules/fila/fila-dual-read.js','modules/fila/processar-envio-automatico-destino.js','modules/demand-scheduler/demand-scheduler.service.js'];
              const needles = /avaliarOfertaParaSelecaoFilaViva|selecionarFilaReadOnly|primeiraAvaliacaoDestinosEm|processarFila|processarEnvioAutomaticoDestino|sem_destino_liberado_agora|proximoElegivelEm|cooldown/i;
              const result = {};
              for (const rel of files) {
                const p = path.join(BACKEND, rel);
