              cases:records.length,
              classifications:Object.fromEntries('ABCDEFG'.split('').map(k=>[k,records.filter(x=>x.classification===k).length])),
              cooldown98775:records.find(x=>x.key==='98775-geral')?.reevalAfterCooldown?.length ? 'SIM' : (records.find(x=>x.key==='98775-geral')?.cooldownEndedAt ? 'NÃO' : 'INDETERMINADO'),
              gapOpCloneStock:gapRecords.some(x=>x.readyAt && x.slotHistorical !== 'INDETERMINADO' && (!x.expiresAt || ms(x.slotHistorical) < ms(x.expiresAt))) ? 'SIM' : 'INDETERMINADO',
              schedulerDefectProven:false,
              postCooldownDefectProven:false,
              delayBeforeProvider:records.some(x=>!x.envioConfirmado && x.decisions.some(d=>d.type==='destino_selecionado')) ? 'SIM' : 'INDETERMINADO',
              clonadorOriginProven:records.some(x=>x.originReal==='clonador_grupos'),
              evidenceLimits:{ recordsWithoutReadyAt:records.filter(x=>!x.readyAt).map(x=>x.key), recordsWithoutHistoricalSlot:records.filter(x=>x.slotHistorical==='INDETERMINADO').map(x=>x.key), focusedFiles:focusedFiles().length, focusedLogLines:focusedLogs().length },
              codeConclusion:{ dynamicReevaluationOnLaterRounds:true, primeiraAvaliacaoDestinosEmOnlyFirstEvaluationLane:true, source:'selecionarFilaReadOnly reavalia ofertaExpiradaParaEnvio + avaliarOfertaParaSelecaoFilaViva on every invocation; first-evaluation lane is gated separately' }
            };
            console.log('CLOCK_AUDIT_SUMMARY ' + JSON.stringify(summary));
            console.log('CLOCK_AUDIT_CASES ' + JSON.stringify(records));
            console.log('CLOCK_AUDIT_OP_CLONE_GAP ' + JSON.stringify(gapRecords));
            console.log('CLOCK_AUDIT_FOCUSED_FILES ' + JSON.stringify(focusedFiles()));
            console.log('CLOCK_AUDIT_FOCUSED_LOGS ' + JSON.stringify(focusedLogs()));
            console.log('CLOCK_AUDIT_CODE ' + JSON.stringify(code));
          }
          main().catch(e => { console.log('CLOCK_AUDIT_FATAL ' + JSON.stringify({ reason:txt(e && e.message || 'audit_error').slice(0,240) })); process.exitCode = 1; }).finally(async () => { try { const p = getEngineShadowPool(); if (p) await p.end(); } catch {} });
          NODE
          then audit_rc=0; else audit_rc=$?; fi
          backend_sha_after="$(git -C "$BACKEND" rev-parse HEAD)"
          backend_id_after="$(docker compose -f "$COMPOSE" ps --status running -q backend | head -n 1)"
          postgres_id_after="$(docker compose -f "$COMPOSE" ps --status running -q postgres | head -n 1)"
          printf 'POST_AUDIT_BACKEND_SHA=%s\nPOST_AUDIT_BACKEND_ID=%s\nPOST_AUDIT_POSTGRES_ID=%s\n' "$backend_sha_after" "$backend_id_after" "$postgres_id_after"
          [[ "$backend_sha_after" == "$EXPECTED_SHA" && "$backend_id_after" == "$backend_id" && "$postgres_id_after" == "$postgres_id" ]] || { echo 'POST_AUDIT_STABILITY=CHANGED'; exit 3; }
          echo 'POST_AUDIT_STABILITY=UNCHANGED; backend SHA and running containers preserved.'
          if [[ "$audit_rc" -ne 0 ]]; then printf 'AUDIT_EXIT_STATUS=%s\n' "$audit_rc"; exit "$audit_rc"; fi
