          echo 'PREFLIGHT=PASS; production SHA, paths, and running containers confirmed.'
          export AUDIT_BACKEND_ID="$backend_id" AUDIT_POSTGRES_ID="$postgres_id"

          if docker compose -f "$COMPOSE" exec -T backend node - <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const { queryEngineShadow, getEngineShadowPool } = require('/app/modules/engine/database');

          const BACKEND = '/opt/optimus/backend';
          const DATA = '/opt/optimus/data';
          const WORKSPACES = ['user_pss60lus', 'user_zbbk3fdr'];
          const TARGETS = [
            { key: '98596-geral', offerId: '98596', workspace: 'user_pss60lus', destinationId: '5717ad91-3d64-4165-9aad-5100f20502fc', label: 'Geral' },
            { key: '98596-op-clone', offerId: '98596', workspace: 'user_pss60lus', destinationId: 'e2bdb503-1710-47e8-870c-0ce34936910b', label: 'OP Clone', knownReadyAt: '2026-10-08T18:15:47.654Z', knownSendAt: '2026-10-08T18:16:05.050Z' },
            { key: '98775-geral', offerId: '98775', workspace: 'user_pss60lus', destinationId: '5717ad91-3d64-4165-9aad-5100f20502fc', label: 'Geral', filaItemId: 'engine_98775_1791487389316' },
            { key: '98775-op-clone', offerId: '98775', workspace: 'user_pss60lus', destinationId: 'e2bdb503-1710-47e8-870c-0ce34936910b', label: 'OP Clone', filaItemId: 'engine_98775_1791487389316' },
            { key: '98639-op-clone', offerId: '98639', workspace: 'user_pss60lus', destinationId: 'e2bdb503-1710-47e8-870c-0ce34936910b', label: 'OP Clone', filaItemId: 'engine_98639_1791484247439' },
            { key: '98607-amazon', offerId: '98607', workspace: 'user_zbbk3fdr', destinationId: '9200c72e-1994-47f8-bfa4-a141e69946db', label: 'Amazon', filaItemId: 'engine_98607_1791483444571' },
            { key: '98641-amazon', offerId: '98641', workspace: 'user_zbbk3fdr', destinationId: '9200c72e-1994-47f8-bfa4-a141e69946db', label: 'Amazon', filaItemId: 'engine_98641_1791484321943' },
            { key: '99059-op-clone', offerId: '99059', workspace: 'user_pss60lus', destinationId: 'e2bdb503-1710-47e8-870c-0ce34936910b', label: 'OP Clone', knownSendAt: '2026-10-08T21:09:41.507Z' }
