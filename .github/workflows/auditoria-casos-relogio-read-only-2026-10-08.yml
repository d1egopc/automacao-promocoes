                const lines = fs.readFileSync(p, 'utf8').split(/\r?\n/);
                const hits = [];
                lines.forEach((line, i) => { if (needles.test(line)) { for (let j=Math.max(0,i-2); j<=Math.min(lines.length-1,i+2); j++) hits.push({ line:j+1, text:lines[j] }); } });
                result[rel] = { hits:[...new Map(hits.map(x=>[x.line,x])).values()].slice(0, 160) };
