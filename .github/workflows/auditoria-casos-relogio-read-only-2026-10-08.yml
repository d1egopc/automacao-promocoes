          const txt = v => v == null ? '' : String(v).trim();
          const arr = v => Array.isArray(v) ? v : [];
          const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
          const iso = v => { if (v == null || v === '') return null; const d = new Date(v); return Number.isFinite(d.getTime()) ? d.toISOString() : null; };
          const ms = v => { const s = iso(v); return s ? Date.parse(s) : null; };
          const safeJson = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch { return {}; } } return obj(v); };
          const clean = v => v == null ? null : (typeof v === 'object' ? v : txt(v));

          async function q(label, sql, params = []) {
            if (!/^\s*SELECT\b/i.test(sql)) throw new Error('non_select_blocked:' + label);
            const r = await queryEngineShadow(sql, params, { timeoutSqlMs: 15000 });
            if (!r || !r.ok) throw new Error('select_failed:' + label);
            return r.resultado && r.resultado.rows || [];
          }
          const valueAt = (root, names) => {
            let found = null;
            const wanted = new Set(names.map(x => String(x).toLowerCase().replace(/[^a-z0-9]/g, '')));
            function walk(v, depth = 0) {
              if (found != null || depth > 10 || v == null) return;
              if (Array.isArray(v)) return v.forEach(x => walk(x, depth + 1));
              if (typeof v !== 'object') return;
              for (const [k, x] of Object.entries(v)) {
                const nk = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (wanted.has(nk) && x != null && txt(x) !== '') { found = x; return; }
                walk(x, depth + 1);
                if (found != null) return;
              }
            }
            walk(root);
            return found;
          };
          const flattenMeta = row => ({ root: safeJson(row.metadata), job: safeJson(row.jobMetadata), event: safeJson(row.eventMetadata), offer: safeJson(row.offerMetadata) });
          const metaObject = row => ({ ...flattenMeta(row) });
          function destinationIn(v, id) {
            if (v == null) return false;
            if (Array.isArray(v)) return v.some(x => destinationIn(x, id));
            if (typeof v === 'object') return Object.values(v).some(x => destinationIn(x, id));
            const s = txt(v).toLowerCase();
            return s === id.toLowerCase() || s.endsWith(':' + id.toLowerCase()) || s.includes(id.toLowerCase());
          }
          function hasCloneProof(row) {
            const m = metaObject(row);
            const all = [m.root, m.job, m.event, m.offer];
            return all.some(x => valueAt(x, ['clonadorGrupos', 'clonadorGruposBridge', 'bufferId', 'buffer_id'])) ||
              ['clonador_grupos', 'clonador-grupos', 'clonador'].includes(txt(row.origin).toLowerCase()) ||
