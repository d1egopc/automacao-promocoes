            const cols = new Map(); for (const r of schema) { if (!cols.has(r.table_name)) cols.set(r.table_name, new Set()); cols.get(r.table_name).add(r.column_name); }
            const missingTables = wantedTables.filter(x => !cols.has(x));
            if (missingTables.length) { console.log('CASE_AUDIT_SCHEMA ' + JSON.stringify({ ok: false, missingTables })); return; }
            const ocols = cols.get('engine_ofertas'), jcols = cols.get('engine_jobs_cliente'), ecols = cols.get('engine_eventos_brutos'), ccols = cols.get('engine_eventos_comerciais'), pcols = cols.get('fila_checkpoints_entrega');
            const jobs = await q('jobs', `SELECT id::text AS id,evento_id::text AS event_id,oferta_id::text AS offer_id,cliente_id AS workspace,${field(jcols,'status')} AS status,${field(jcols,'motivo_final')} AS motivo_final,${field(jcols,'origem_fluxo')} AS origin,${field(jcols,'criado_em','timestamptz')} AS created_at,${field(jcols,'atualizado_em','timestamptz')} AS updated_at,${field(jcols,'metadata','jsonb')} AS metadata FROM engine_jobs_cliente WHERE oferta_id=ANY($1::bigint[]) ORDER BY criado_em,id`, [OFFER_IDS]);
            const offers = await q('offers', `SELECT id::text AS id,evento_id::text AS event_id,${field(ocols,'marketplace')} AS marketplace,${field(ocols,'origem')} AS origin,${field(ocols,'status')} AS status,${field(ocols,'motivo_status')} AS reason,${field(ocols,'criada_em','timestamptz')} AS created_at,${field(ocols,'atualizada_em','timestamptz')} AS updated_at,${field(ocols,'metadata','jsonb')} AS metadata FROM engine_ofertas WHERE id=ANY($1::bigint[]) OR id=ANY($2::bigint[]) ORDER BY criada_em,id`, [[...new Set([...OFFER_IDS, ...GAP_IDS])]]);
            const eventIds = [...new Set(jobs.map(x => txt(x.event_id)).filter(x => /^\d+$/.test(x)))];
            const rawEvents = eventIds.length ? await q('raw_events', `SELECT id::text AS id,${fieldA(ecols,'e','capturado_em','timestamptz')} AS captured_at,${fieldA(ecols,'e','criado_em','timestamptz')} AS created_at,${fieldA(ecols,'e','origem')} AS origin,${fieldA(ecols,'e','fonte')} AS source,${fieldA(ecols,'e','origem_tipo')} AS origin_type,${fieldA(ecols,'e','metadata','jsonb')} AS metadata FROM engine_eventos_brutos e WHERE e.id=ANY($1::bigint[]) ORDER BY COALESCE(e.capturado_em,e.criado_em),e.id`, [eventIds]) : [];
            const caseEvents = await q('commercial_events', `SELECT id::text AS id,tipo_evento AS type,COALESCE(cliente_id,workspace_id) AS workspace,oferta_id::text AS offer_id,job_id::text AS job_id,fila_item_id AS queue_item_id,destino_id AS destination_id,canal AS channel,marketplace,ocorrido_em AS occurred_at,origem_pipeline AS origin_pipeline,metadata FROM engine_eventos_comerciais WHERE (oferta_id=ANY($1::bigint[]) OR fila_item_id=ANY($2::text[]) OR oferta_id=ANY($3::bigint[])) ORDER BY ocorrido_em,id`, [OFFER_IDS, QUEUE_IDS, GAP_IDS]);
            const destinationPatterns = DEST_IDS.map(x => '%' + x + '%');
            const priorEvents = await q('prior_sends', `SELECT id::text AS id,tipo_evento AS type,COALESCE(cliente_id,workspace_id) AS workspace,oferta_id::text AS offer_id,job_id::text AS job_id,fila_item_id AS queue_item_id,destino_id AS destination_id,canal AS channel,marketplace,ocorrido_em AS occurred_at,origem_pipeline AS origin_pipeline,metadata FROM engine_eventos_comerciais WHERE COALESCE(cliente_id,workspace_id)=ANY($1::text[]) AND tipo_evento IN ('executor_enviado','destino_selecionado','destino_rejeitado','destino_candidato','executor_erro_final') AND (destino_id=ANY($2::text[]) OR metadata::text ILIKE ANY($3::text[])) ORDER BY ocorrido_em,id LIMIT 10000`, [WORKSPACES, DEST_IDS, destinationPatterns]);
            const queuePatterns = [...new Set([...QUEUE_IDS, ...jobs.map(x => txt(valueAt(safeJson(x.metadata), ['filaItemId','fila_item_id'])).filter(Boolean))])];
            const checkpoints = await q('checkpoints', `SELECT cliente_id AS workspace,fila_item_id AS queue_item_id,destino_chave AS destination_key,alvo_chave AS target_key,estado,attempt_id::text AS attempt_id,provider_message_id,motivo_codigo,classificacao,status_http,criado_em AS created_at,atualizado_em AS updated_at,confirmado_em AS confirmed_at FROM fila_checkpoints_entrega WHERE cliente_id=ANY($1::text[]) AND (fila_item_id=ANY($2::text[]) OR destino_chave ILIKE ANY($3::text[])) ORDER BY COALESCE(confirmado_em,atualizado_em,criado_em),fila_item_id`, [WORKSPACES, queuePatterns, destinationPatterns]);

            const jobsByOffer = new Map(); for (const j of jobs) { const k = txt(j.offer_id); if (!jobsByOffer.has(k)) jobsByOffer.set(k, []); jobsByOffer.get(k).push(j); }
            const offersById = new Map(offers.map(x => [txt(x.id), x]));
            const rowsFor = target => {
              const js = (jobsByOffer.get(target.offerId) || []).filter(x => !x.workspace || txt(x.workspace) === target.workspace);
              const jids = new Set(js.map(x => txt(x.id)));
              const qids = new Set([target.filaItemId, ...js.map(x => txt(valueAt(safeJson(x.metadata), ['filaItemId','fila_item_id'])))].filter(Boolean));
              const es = [...caseEvents, ...priorEvents].filter(e => (txt(e.offer_id) === target.offerId || jids.has(txt(e.job_id)) || qids.has(txt(e.queue_item_id))) && (txt(e.workspace) === target.workspace || !txt(e.workspace)));
              const ps = checkpoints.filter(c => txt(c.workspace) === target.workspace && (qids.has(txt(c.queue_item_id)) || destinationIn(c.destination_key, target.destinationId)));
              const raw = rawEvents.filter(e => js.some(j => txt(j.event_id) === txt(e.id)));
              const offer = offersById.get(target.offerId) || null;
              const metaRoots = [offer, ...js, ...raw].map(x => x ? metaObject(x) : {}).flatMap(x => [x.root, x.job, x.event, x.offer]);
              const readyRaw = target.knownReadyAt || valueAt(metaRoots, ['readyAt','ready_at','filaClienteAdicionadaAt','fila_cliente_adicionada_at','prontoEm','pronto_em']);
              const expRaw = valueAt(metaRoots, ['expiraEm','expira_em','expiresAt','expires_at','terminalizadoEm','terminalizado_em','finalizadoEm','finalizado_em']);
              const readyAt = iso(readyRaw), expiresAt = iso(expRaw);
              const matching = e => destinationIn(e.destination_id, target.destinationId) || destinationIn(e.metadata, target.destinationId) || !txt(e.destination_id);
              const decisions = es.filter(matching).filter(e => ['destino_candidato','destino_selecionado','destino_rejeitado','executor_enviado','executor_erro_final'].includes(txt(e.type))).map(e => {
                const m = safeJson(e.metadata); return { type:e.type, occurredAt:iso(e.occurred_at), destinationId:txt(e.destination_id)||null, channel:txt(e.channel)||null, marketplace:txt(e.marketplace)||null, metadata:{ motivo:clean(valueAt(m,['motivo'])), motivoCodigo:clean(valueAt(m,['motivoCodigo','motivo_codigo'])), dentroJanela:clean(valueAt(m,['dentroJanela','dentro_janela'])), cooldownAtivo:clean(valueAt(m,['cooldownAtivo','cooldown_ativo'])), maxDiaAtingido:clean(valueAt(m,['maxDiaAtingido','max_dia_atingido'])), sessaoStatus:clean(valueAt(m,['sessaoStatus','sessao_status'])), destinoAtivo:clean(valueAt(m,['destinoAtivo','destino_ativo'])), intervaloConfiguradoMin:clean(valueAt(m,['intervaloConfiguradoMin','intervalo_configurado_min'])), intervaloEfetivoMin:clean(valueAt(m,['intervaloEfetivoMin','intervalo_efetivo_min'])), turboAplicado:clean(valueAt(m,['turboAplicado','turbo_aplicado'])), ultimoEnvioEm:clean(valueAt(m,['ultimoEnvioEm','ultimo_envio_em'])), proximoPermitidoEm:clean(valueAt(m,['proximoPermitidoEm','proximo_permitido_em'])), selecionadoEm:clean(valueAt(m,['selecionadoEm','selecionado_em'])), enviadoEm:clean(valueAt(m,['enviadoEm','enviado_em'])) }};
              });
              const cps = ps.filter(c => destinationIn(c.destination_key, target.destinationId) || qids.has(txt(c.queue_item_id))).map(c => ({ destinationKey:txt(c.destination_key), targetKey:txt(c.target_key), state:txt(c.estado), attemptId:txt(c.attempt_id), providerMessageId:txt(c.provider_message_id)||null, motivoCodigo:txt(c.motivo_codigo)||null, classificacao:txt(c.classificacao)||null, statusHttp:c.status_http, createdAt:iso(c.created_at), updatedAt:iso(c.updated_at), confirmedAt:iso(c.confirmed_at) }));
              const confirmed = cps.filter(c => c.state === 'enviado' && c.confirmedAt).sort((a,b) => ms(a.confirmedAt)-ms(b.confirmedAt));
              const sends = decisions.filter(e => e.type === 'executor_enviado' && e.occurredAt);
              const previous = [...confirmed.map(c => ({ at:c.confirmedAt, source:'checkpoint', metadata:{} })), ...sends.map(e => ({ at:e.occurredAt, source:'executor_enviado', metadata:e.metadata }))].filter(x => !readyAt || ms(x.at) < ms(readyAt)).sort((a,b) => ms(b.at)-ms(a.at));
              const prev = previous[0] || null;
              const prevNext = prev ? iso(valueAt(prev.metadata, ['proximoPermitidoEm','proximo_permitido_em'])) : null;
              const prevInterval = prev ? Number(valueAt(prev.metadata, ['intervaloEfetivoMin','intervalo_efetivo_min','intervaloConfiguradoMin','intervalo_configurado_min'])) : NaN;
              const slotHistorical = prevNext || (prev && Number.isFinite(prevInterval) ? new Date(ms(prev.at) + prevInterval * 60000).toISOString() : null);
              const latestSend = [...confirmed.map(c=>c.confirmedAt), ...sends.map(x=>x.occurredAt)].sort().pop() || null;
              const realOrigin = originOf({ ...offer, origin: offer?.origin, metadata: offer?.metadata, jobMetadata: js[0]?.metadata, eventMetadata: raw[0]?.metadata });
              const cooldownRejects = decisions.filter(x => x.type === 'destino_rejeitado' && (x.metadata.cooldownAtivo === true || /cooldown/i.test(txt(x.metadata.motivo) + ' ' + txt(x.metadata.motivoCodigo))));
              const cooldownEnd = cooldownRejects.map(x => iso(x.metadata.proximoPermitidoEm)).filter(Boolean).sort().pop() || slotHistorical;
              const reevalAfterCooldown = cooldownEnd ? decisions.filter(x => ms(x.occurredAt) > ms(cooldownEnd) && ['destino_candidato','destino_selecionado','destino_rejeitado','executor_enviado'].includes(x.type)) : [];
              const terminal = expiresAt && readyAt && ms(expiresAt) <= ms(readyAt) ? { at:expiresAt, status:txt(offer?.status || js[0]?.status), reason:txt(offer?.reason || js[0]?.motivo_final) } : null;
              let classification = 'G';
              if (latestSend && (!slotHistorical || ms(latestSend) >= ms(slotHistorical))) classification = 'A';
              if (!latestSend && terminal) classification = 'E';
              if (!latestSend && cooldownRejects.length && reevalAfterCooldown.length) classification = 'B';
              if (!latestSend && cooldownRejects.length && cooldownEnd && !reevalAfterCooldown.length && readyAt && (!expiresAt || ms(cooldownEnd) < ms(expiresAt))) classification = 'C';
              if (!latestSend && readyAt && slotHistorical && (!expiresAt || ms(slotHistorical) < ms(expiresAt)) && !cooldownRejects.length) classification = 'D';
              if (decisions.some(x => x.type === 'executor_erro_final') && decisions.some(x => x.type === 'destino_selecionado')) classification = 'F';
              return { ...target, originReal:realOrigin, readyAt, expiresAt, terminalizedAt: valueAt(metaRoots,['terminalizadoEm','terminalizado_em']) ? iso(valueAt(metaRoots,['terminalizadoEm','terminalizado_em'])) : null, offer:offer ? { status:txt(offer.status), reason:txt(offer.reason), createdAt:iso(offer.created_at), updatedAt:iso(offer.updated_at) } : null, jobs:js.map(x=>({id:txt(x.id),eventId:txt(x.event_id),status:txt(x.status),createdAt:iso(x.created_at),updatedAt:iso(x.updated_at)})), rawEvents:raw.map(x=>({id:txt(x.id),capturedAt:iso(x.captured_at),createdAt:iso(x.created_at),origin:txt(x.origin),source:txt(x.source),originType:txt(x.origin_type)})), decisions, checkpoints:cps, lastConfirmedBeforeReady:prev, slotHistorical:slotHistorical || 'INDETERMINADO', cooldownEndedAt:cooldownEnd || null, reevalAfterCooldown, envioConfirmado:latestSend, classification };
            };
            const records = TARGETS.map(rowsFor);
            const gapRecords = GAP_IDS.map(offerId => rowsFor({ key:'gap-'+offerId, offerId, workspace:'user_pss60lus', destinationId:GAP_DEST, label:'OP Clone' }));

            function focusedFiles() {
              const patterns = [...new Set([...OFFER_IDS, ...GAP_IDS, ...QUEUE_IDS])];
              const out = [];
              for (const workspace of WORKSPACES) {
                const root = path.join(DATA, 'clientes', workspace);
                if (!fs.existsSync(root)) continue;
                const r = spawnSync('rg', ['-l', '--hidden', '--glob', 'fila-viva*.json', '--glob', 'fila-projecao*.json', '--glob', 'fila-terminal-index*.json', '--glob', 'fila-historico-incremental/**', '--glob', 'fila-historico-leve-incremental/**', patterns.join('|'), root], { encoding:'utf8', maxBuffer:8*1024*1024, timeout:30000 });
                for (const file of (r.stdout || '').split(/\r?\n/).map(txt).filter(Boolean)) out.push(file);
              }
