name: Auditoria factual de envios 2026-10-07
on:
  push:
    branches:
      - audit/read-only-envios-2026-10-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Read-only factual send audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Production target preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "hostname=$(hostname)"
          echo "runner_os=${RUNNER_OS:-unknown}"
          for p in /opt/optimus/backend /opt/optimus/infra /data /opt/optimus/data; do
            if [ -d "${p}" ]; then echo "path_ok=${p}"; else echo "path_missing=${p}"; fi
          done
          production_head="$(git -C /opt/optimus/backend rev-parse HEAD 2>/dev/null || true)"
          echo "production_head=${production_head}"
          if [ "${production_head}" = "7014f271e900826ff3f2898e89d1f4b4bdf3f78c" ]; then echo "production_target_verified=true"; else echo "production_target_verified=false"; fi
      - name: Read-only workspace file map
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '/opt/optimus/data/clientes';
          const sensitive = /(auth|key|token|session|credential|secret|cookie|private|oauth)/i;
          const focus = /(fila|histor|envio|send|delivery|destin|executor|provider|outbox|sent|message|mensag|terminal|claim|reserva|confirm|dispatch|queue)/i;
          const dirs = fs.readdirSync(root,{withFileTypes:true}).filter(e=>e.isDirectory()).map(e=>e.name).sort();
          console.log('WORKSPACE_COUNT', dirs.length);
          for (const workspace of dirs) {
            const dir = path.join(root, workspace);
            let names=[];
            try { names = fs.readdirSync(dir,{withFileTypes:true}).filter(e=>e.isFile() && !sensitive.test(e.name) && focus.test(e.name)).map(e=>{let s=0;try{s=fs.statSync(path.join(dir,e.name)).size}catch{};return {name:e.name,size:s};}).sort((a,b)=>a.name.localeCompare(b.name)); } catch {}
            console.log('WORKSPACE', JSON.stringify({workspace, files:names}));
          }
          NODE
