name: Auditoria de perda comercial 2026-10-07
on:
  push:
    branches:
      - audit/read-only-envios-2026-10-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Read-only commercial loss audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Production target preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "hostname=$(hostname)"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "today_local=$(TZ=America/Sao_Paulo date -Iseconds)"
          echo "cutoff_utc=2026-10-07T23:52:05Z"
          for p in /opt/optimus/backend /opt/optimus/infra /data /opt/optimus/data; do if [ -d "${p}" ]; then echo "path_ok=${p}"; else echo "path_missing=${p}"; fi; done
          production_head="$(git -C /opt/optimus/backend rev-parse HEAD 2>/dev/null || true)"
          echo "production_head=${production_head}"
          if [ "${production_head}" = "7014f271e900826ff3f2898e89d1f4b4bdf3f78c" ]; then echo "production_target_verified=true"; else echo "production_target_verified=false"; fi
      - name: Read-only commercial loss aggregation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --max-old-space-size=4096 <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='/opt/optimus/data/clientes';
          const workspaces=['user_pss60lus','user_g3qkc18m','user_b2oogwwl','user_zbbk3fdr'];
          const start=Date.parse('2026-10-07T03:00:00Z');
          const cutoff=Date.parse('2026-10-07T23:52:05Z');
          const recs=new Map();
          const nonApplicable=/nao[_ ]?compativel|incompativel|nao[_ ]?aplicavel|bloqueado[_ ]?repeticao[_ ]?2h/i;
          const sendState=/enviad|sucess|success|sent|confirm|delivered|ok/i;
          const failState=/falh|erro|pend|aguard|cancel|bloq|sem[_ ]?imagem|nao[_ ]?enviado/i;
          const keyFields=/(captur|criad|entrada|expir|avali|slot|oportun|selecion|liberad|proximo|interval|cadenc|limite|janela|autor|claim|reserv|credit|destino|status|motivo|erro|process|envio|enviad|data|timestamp|marketplace|origem|categoria|ttl)/i;
          function ms(v){if(v===null||v===undefined||v==='')return NaN; if(typeof v==='number')return Number.isFinite(v)?v:NaN; const n=Date.parse(String(v)); return Number.isFinite(n)?n:NaN;}
          function inPeriod(v){const t=ms(v);return Number.isFinite(t)&&t>=start&&t<=cutoff;}
          function firstTime(o,keys){for(const k of keys){if(o&&o[k]&&Number.isFinite(ms(o[k])))return o[k];}return '';}
          function idOf(o,w){return String(o.engineOfertaUuid||o.engineOfertaId||o.id||o.ofertaId||o.filaId||'')||w+'|unknown';}
          function recFor(w,o){const id=idOf(o,w),k=w+'|'+id;let r=recs.get(k);if(!r){r={workspace:w,offerId:id,captures:[],expires:[],firstEval:[],applicable:new Map(),sendEvidence:[],slotSignals:new Set(),slotFields:new Set(),causeSignals:new Set(),marketplaces:new Set(),statuses:new Set(),sources:new Set(),fieldPresence:new Set()};recs.set(k,r);}return r;}
          function ch(v){return String(v??'').trim();}
          function addDest(r,d){if(!d||typeof d!=='object')return; const state=ch(d.estado||d.status||d.resultado||d.motivo); const id=ch(d.destinoId||d.id||d.chave||d.alvoId||d.nome); if(state)r.statuses.add(state); if(d.aplicavel===false||nonApplicable.test(state))return; if(id)r.applicable.set(id,{state,enviadoEm:d.enviadoEm||d.dataEnvio||'',tipo:d.tipo||d.canal||''});}
          function inspect(o,r,depth=0,prefix=''){if(!o||typeof o!=='object'||depth>4)return; for(const [k,v] of Object.entries(o)){const p=prefix?prefix+'.'+k:k; if(keyFields.test(k))r.fieldPresence.add(k); const kl=k.toLowerCase(); if(/(marketplace|origem|categoria)/i.test(k)&&typeof v!=='object'&&ch(v))r.marketplaces.add(ch(v)); if(/primeiraavaliacao|firstevaluation/i.test(kl)&&ch(v))r.firstEval.push(v); if(/(slotreal|oportunidade(real)?|liberadoagora|slotantesdodeadline)/i.test(kl)&&((v===true)||String(v).toLowerCase()==='true')){r.slotSignals.add('explicit_slot_flag');r.slotFields.add(p);} if(/(selecionadoem|selectedat|slotocupadoem)/i.test(kl)&&inPeriod(v)){r.slotSignals.add('selection_timestamp');r.slotFields.add(p);} if(/(proximoslot|destinosdisponiveis|slotsdisponiveis)/i.test(kl)&&Number(v)>0){r.slotSignals.add('slot_quantity');r.slotFields.add(p);} if(/(motivo|erro|status|estado|resultado|bloqueio)/i.test(kl)&&typeof v!=='object'&&ch(v)){const s=ch(v); if(/limite|interval|cadenc|horario|janela|claim|reserv|credit|authority|capacidade|slot|selecion|repeti|retenc|provider|executor|imagem|expir/i.test(s))r.causeSignals.add(s);} if(v&&typeof v==='object')inspect(v,r,depth+1,p);}}
          function process(w,source,v){const arr=Array.isArray(v)?v:[v];for(const wrapper of arr){const o=wrapper&&wrapper.item&&typeof wrapper.item==='object'?wrapper.item:wrapper;if(!o||typeof o!=='object')continue;const r=recFor(w,o);r.sources.add(source);const cap=firstTime(o,['capturadoEm','capturadaEm','dataCaptura','radarCapturadoEm','criadoEmRadar','dataEntradaFila','criadoEm','dataCriacao']);if(cap)r.captures.push(cap);const exp=firstTime(o,['expiraEm','expiradoEm','finalizadoEm','terminalOcorridoEm']);if(exp)r.expires.push(exp);for(const k of ['primeiraAvaliacaoDestinosEm','primeiraAvaliacaoEm','firstEvaluationAt'])if(o[k])r.firstEval.push(o[k]);if(o.marketplace)r.marketplaces.add(ch(o.marketplace));if(o.origem)r.marketplaces.add(ch(o.origem));if(o.status)r.statuses.add(ch(o.status));if(o.statusOperacional)r.statuses.add(ch(o.statusOperacional));if(o.statusPublico)r.statuses.add(ch(o.statusPublico));if(Array.isArray(o.destinosEstado))for(const d of o.destinosEstado){addDest(r,d);if(d.enviadoEm||d.dataEnvio)r.sendEvidence.push({kind:'destination_state',ts:d.enviadoEm||d.dataEnvio,destinoId:d.destinoId||d.id});}if(Array.isArray(o.destinosEnviados))for(const d of o.destinosEnviados)r.sendEvidence.push({kind:'durable_destination',ts:d.dataEnvio||d.enviadoEm,destinoId:d.destinoId||d.id});if(Array.isArray(o.logsEnvio))for(const d of o.logsEnvio){if(d.providerMessageId||d.sendMessageSucesso===true||d.sucesso===true)r.sendEvidence.push({kind:'executor_provider',ts:d.data||d.sendMessageSucesso,destinoId:d.destinoId||d.id});}inspect(o,r);}}
          for(const w of workspaces){for(const name of ['fila.json','fila-historico.json']){const f=path.join(root,w,name);if(!fs.existsSync(f)){console.log('MISSING',w,name);continue;}let v;try{v=JSON.parse(fs.readFileSync(f,'utf8'));}catch(e){console.log('PARSE_ERROR',w,name,String(e.message));continue;}process(w,name,v);v=null;}}
          const all=[...recs.values()];const captured=all.filter(r=>r.captures.some(inPeriod));const applicable=captured.filter(r=>r.applicable.size>0);const sent=captured.filter(r=>r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))));const zero=captured.filter(r=>!r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))));
          const proven=applicable.filter(r=>r.slotSignals.size>0);const indeterminate=applicable.filter(r=>r.slotSignals.size===0);const lost=proven.filter(r=>!r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))));
          const e1=lost.filter(r=>r.firstEval.length===0&&r.slotSignals.has('explicit_slot_flag')===true);const e2=lost.filter(r=>r.firstEval.length>0);const byWs={};for(const r of captured){const b=byWs[r.workspace]||(byWs[r.workspace]={captured:0,applicable:0,slotProven:0,sent:0,lost:0,indeterminate:0});b.captured++;if(r.applicable.size)b.applicable++;if(r.slotSignals.size)b.slotProven++;if(r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))))b.sent++;if(r.slotSignals.size&&!r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))))b.lost++;if(r.applicable.size&&!r.slotSignals.size)b.indeterminate++;}
          const byM={};for(const r of proven){const m=[...r.marketplaces].find(Boolean)||'indeterminado';const b=byM[m]||(byM[m]={slotProven:0,sent:0,lost:0});b.slotProven++;if(r.sendEvidence.some(e=>Number.isFinite(ms(e.ts))))b.sent++;else b.lost++;}
          const examples=lost.slice(0,20).map(r=>({workspace:r.workspace,offerId:r.offerId,capturedAt:r.captures.find(inPeriod)||r.captures[0]||'',expiresAt:r.expires[0]||'',firstEvaluation:r.firstEval[0]||null,applicableDestinations:r.applicable.size,slotSignals:[...r.slotSignals],slotFields:[...r.slotFields].slice(0,8),lastStatus:[...r.statuses].slice(-3),causes:[...r.causeSignals].slice(0,6),marketplaces:[...r.marketplaces]}));
          console.log('LOSS_SUMMARY',JSON.stringify({periodStart:'2026-10-07T00:00:00-03:00',cutoff:'2026-10-07T20:52:05-03:00',capturedEnqueued:captured.length,withApplicableDestination:applicable.length,slotRealProven:proven.length,knownSentFromSourceScan:sent.length,knownSentHomologated:276,slotRealZeroSend:lost.length,indeterminate:indeterminate.length,zeroSendCaptured:zero.length,beforeFirstEvaluation:e1.length,afterFirstEvaluation:e2.length,byWorkspace:byWs,byMarketplace:byM,fieldPresenceTop:[...new Set(captured.flatMap(r=>[...r.fieldPresence]))].sort()}));
          console.log('LOSS_EXAMPLES',JSON.stringify(examples));
          NODE
