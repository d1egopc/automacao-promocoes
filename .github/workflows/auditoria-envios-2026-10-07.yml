name: Auditoria factual de envios 2026-10-07
on:
  push:
    branches:
      - audit/read-only-envios-2026-10-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Read-only factual send audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Production target preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "hostname=$(hostname)"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "today_local=$(TZ=America/Sao_Paulo date -Iseconds)"
          for p in /opt/optimus/backend /opt/optimus/infra /data /opt/optimus/data; do if [ -d "${p}" ]; then echo "path_ok=${p}"; else echo "path_missing=${p}"; fi; done
          production_head="$(git -C /opt/optimus/backend rev-parse HEAD 2>/dev/null || true)"
          echo "production_head=${production_head}"
          if [ "${production_head}" = "7014f271e900826ff3f2898e89d1f4b4bdf3f78c" ]; then echo "production_target_verified=true"; else echo "production_target_verified=false"; fi
      - name: Read-only factual schema inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in user_b2oogwwl/fila-historico.json user_b2oogwwl/fila-viva.json user_b2oogwwl/fila.json user_b2oogwwl/controle-envio-destinos.json user_g3qkc18m/fila-historico.json user_g3qkc18m/fila-viva.json user_g3qkc18m/fila.json user_g3qkc18m/controle-envio-destinos.json user_pss60lus/fila-historico.json user_pss60lus/fila-viva.json user_pss60lus/fila.json user_pss60lus/controle-envio-destinos.json user_zbbk3fdr/fila-historico.json user_zbbk3fdr/fila-viva.json user_zbbk3fdr/fila.json user_zbbk3fdr/controle-envio-destinos.json; do
            if [ ! -f "/opt/optimus/data/clientes/${spec}" ]; then echo "MISSING ${spec}"; continue; fi
            node --max-old-space-size=4096 - "${spec}" <<'NODE'
          const fs=require('fs'), path=require('path');
          const rel=process.argv[2], file=path.join('/opt/optimus/data/clientes',rel);
          let v; try { v=JSON.parse(fs.readFileSync(file,'utf8')); } catch(e) { console.log('PARSE_ERROR',rel,String(e.message)); process.exit(0); }
          const interesting=/(dest|envio|send|status|state|time|date|claim|reserv|confirm|provider|channel|canal|workspace|offer|oferta|message|mensag|executor|event|id|erro|falha|aplic)/i;
          function brief(x,d=0){
            if(x===null) return 'null';
            if(Array.isArray(x)) return {type:'array',length:x.length,items:x.slice(0,3).map(y=>brief(y,d+1))};
            if(typeof x==='object'){const ks=Object.keys(x); const o={type:'object',keys:ks.slice(0,120).sort()}; if(d<2) for(const k of ks) if(interesting.test(k)) o[k]=brief(x[k],d+1); return o;}
            return typeof x;
          }
          console.log('SCHEMA',JSON.stringify({file:rel,size:fs.statSync(file).size,summary:brief(v)}));
          NODE
          done
