name: Inventario read-only de fontes de cadencia 2026-10-07

on:
  push:
    branches:
      - audit/read-only-envios-2026-10-07
  workflow_dispatch:

jobs:
  source-inventory:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Read-only source inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          echo runner_name=$RUNNER_NAME
          echo hostname=$(hostname)
          echo production_head=$(git -C /opt/optimus/backend rev-parse HEAD)
          for root in /opt/optimus/data/clientes /opt/optimus/backend /opt/optimus/infra; do
            echo ROOT=$root
            if [ -d "$root" ]; then
              find "$root" -maxdepth 2 -type f -printf 'FILE %p size=%s mtime=%TY-%Tm-%TdT%TH:%TM\n' 2>/dev/null || true
            else
              echo MISSING=$root
            fi
          done
          echo DATA_DIRS
          find /opt/optimus/data -maxdepth 3 -type d -print 2>/dev/null || true
