name: Deploy Backend VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full authorized source commit SHA
        required: true
        type: string
      base_sha:
        description: Full source SHA represented by the running image
        required: true
        type: string
      base_image:
        description: Full sha256 image ID currently running and retained for rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend-vps
  cancel-in-progress: false

jobs:
  ci:
    name: CI only on push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_files: ${{ steps.guardian.outputs.runtime_files }}
    steps:
      - name: Validate manual inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Derive and validate runtime overlay
        id: guardian
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: node scripts/guardian-v1.cjs prepare --base "$BASE_SHA" --source "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - run: node --check index.js
      - run: npm run audit:encoding
      - name: Validate manual deploy script syntax
        if: github.event_name == 'push'
        run: bash -n scripts/deploy-backend-vps-manual.sh
      - name: Critical tests
        run: |
          node --test tests/telemetria-permanent-contract.test.cjs tests/telemetria-operacional.test.cjs tests/telemetria-prepared-input.test.cjs
          node tests/guardian-v1.test.cjs
          node tests/deploy-backend-v2-overlay-validation.test.cjs
          node tests/deploy-backend-compose-image-validation.test.cjs
          node tests/deploy-backend-manual-diagnostics.test.cjs
          node tests/clean-install-bootstrap.test.js
          node tests/financeiro-bootstrap-schema.test.js
          node tests/platform-variables-v1.test.js
          node tests/google-platform-config.test.js
          node tests/mercadopago-platform-variables.test.js
          node tests/financeiro-mercadopago-pix-v1.test.js
          node tests/financeiro-checkout-pix-publico-v1.test.js
          node tests/link-optimus-repository.test.js
          node tests/link-optimus-admin-config.test.js

  deploy:
    name: Manual deploy by approved SHA
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    needs: ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Build clean image and switch backend only
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          BASE_IMAGE: ${{ inputs.base_image }}
          RUNTIME_FILES: ${{ needs.ci.outputs.runtime_files }}
        run: bash scripts/deploy-backend-vps-manual.sh
