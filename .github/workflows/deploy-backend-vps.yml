name: Deploy Backend VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend-vps
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check index.js

      - name: Encoding audit
        run: npm run audit:encoding

      - name: Critical tests
        run: |
          node tests/clean-install-bootstrap.test.js
          node tests/financeiro-bootstrap-schema.test.js
          node tests/platform-variables-v1.test.js
          node tests/google-platform-config.test.js
          node tests/mercadopago-platform-variables.test.js
          node tests/financeiro-mercadopago-pix-v1.test.js
          node tests/financeiro-checkout-pix-publico-v1.test.js
          node tests/link-optimus-repository.test.js
          node tests/link-optimus-admin-config.test.js
          node tests/social-oportunidades.test.js
          node tests/social-automatico-agendamentos.test.js
          node tests/social-publicador-oficial.test.js
          node tests/social-instagram-gatilho.test.js
          node tests/universal-flow-social-opportunities.test.js
          node tests/universal-flow-post-classification-freshness.test.js
          node tests/contrato-comercial-final-universal.test.js
          node tests/social-rascunhos-agenda.test.js

      - name: AliExpress APP PC focal gate (validation branch only)
        if: github.ref == 'refs/heads/validation/aliexpress-app-pc-node24'
        run: |
          git diff --check 1809876c3acd788a82a00c1458a1593dc6266226 HEAD
          node --check marketplaces/aliexpress/importar.js
          node --check modules/engine/importer/adapters/aliexpress.adapter.js
          node --check modules/engine/inbox.service.js
          node --check modules/ofc-v2/espelho-comercial.js
          node tests/aliexpress-app-pc-fallback-oficial.test.js
          node tests/aliexpress-pc-redirect-role-persistencia.test.js
          node tests/dynamic-link-resolvers.test.js
          node tests/aliexpress-app-moedas-contrato.test.js
          node tests/aliexpress-afiliacao-workspace.test.js
          node tests/aliexpress-preco-variantes-radar.test.js
          node tests/aliexpress-moedas-productdetail-engine.test.js
          node tests/aliexpress-shortlink-candidate.test.js
          node tests/aliexpress-manual-importador.test.js
          node tests/aliexpress-imagem-gate.test.js
          node tests/manual-v2-import-aliexpress.test.js
          node tests/amazon-shortlink-afiliacao.test.js
          node tests/shopee-resgate-ocorrencias.test.js
          node tests/magalu-engine-importer.test.js
          node tests/mercadolivre-identidade-canonica.test.js
          node tests/destinos-compatibilidade-kabum-awin.test.js

  deploy:
    name: Deploy VPS
    runs-on: [self-hosted, Linux, X64]
    needs: ci
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Production target preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_dir=/opt/optimus/backend
          infra_dir=/opt/optimus/infra
          compose_file=${infra_dir}/compose.yml

          if [[ ! -d "${backend_dir}" || ! -d "${infra_dir}" || ! -f "${compose_file}" ]]; then
            echo "alvo de producao nao reconhecido"
            exit 1
          fi

          services="$(docker compose -f "${compose_file}" config --services)"
          if ! grep -Fxq "backend" <<<"${services}"; then
            echo "alvo de producao nao reconhecido"
            exit 1
          fi

          echo "alvo de producao reconhecido: Hostinger VPS / backend"

      - name: Deploy backend
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt/optimus/backend
          git pull --ff-only origin main
          cd /opt/optimus/infra
          docker compose -f compose.yml build backend
          docker compose -f compose.yml up -d backend
          docker compose -f compose.yml ps backend

      - name: Health check
        shell: bash
        run: |
          set -Eeuo pipefail
          for tentativa in {1..10}; do
            if curl -fsS https://go.optimuspromo.com.br/; then
              exit 0
            fi
            echo "Health check ainda indisponivel. Tentativa ${tentativa}/10."
            sleep 3
          done
          exit 1

      - name: Backend logs on failure
        if: failure()
        shell: bash
        run: |
          cd /opt/optimus/infra
          docker compose -f compose.yml logs --tail=200 backend
