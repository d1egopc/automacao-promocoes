name: Guardian V1 CI only

on:
  push:
    branches:
      - validation/guardian-v1-*
      - validation/mensageiro-v4-20261025
      - validation/mensageiro-v4-canary-runtime-20261025
      - validation/mensageiro-v4-ingress-probe-20261026
      - validation/v4-admin-observation-20261026
      - validation/baileys-buffer-servcel-20261026
      - validation/baileys-buffer-packaging-20261026
      - validation/radar-magalu-ingress-observer-20261026
      - validation/telemetria-operacional-20261027
      - validation/telemetria-v11-panel-first-20261027
      - feature/landing-page-v1-*
      - validation/landing-v13-media-buttons-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact Baileys packaging profile - isolated only
        if: github.ref == 'refs/heads/validation/baileys-buffer-packaging-20261026'
        run: |
          node scripts/guardian-v1.cjs prepare --base f50e8a294f839249e5427619e500e37332423363 --source "$GITHUB_SHA"
          node -e "require('./modules/whatsapp/baileys-buffer-hotfix.service.js').applyPatch()"
          node --test tests/guardian-baileys-buffer-packaging.test.cjs
      - name: Baileys buffer recovery and essential contracts
        if: github.ref == 'refs/heads/validation/baileys-buffer-servcel-20261026' || github.ref == 'refs/heads/validation/baileys-buffer-packaging-20261026'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test tests/baileys-initial-buffer-recovery.test.cjs
          node tests/baileys-retry-hotfix.test.js
          node --test tests/mensageiro-v4.test.cjs tests/mensageiro-v4-canary.test.cjs tests/mensageiro-v4-ingress-probe.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/mensageiro-v3-operational-hotfix.test.cjs
          node tests/mensageiro-v3-m322-real-handlers.test.cjs
          node tests/mensageiro-v3-schedule-timezone.test.cjs
          node tests/mensageiro-v3-lock-identity.test.cjs
          node tests/universal-flow-queue-executor.test.js
          node tests/radar-cobertura-v1.test.js
          node tests/teleradar-handoff.test.js
          node tests/clonador-grupos-foundation.test.js
          node tests/fila-viva-runtime-wiring.test.js
          node tests/mensageiro-gerente-grupo.test.cjs
          node tests/mensageiro-bot-comandos.test.cjs
          node tests/mensageiro-programacoes.test.cjs
      - name: Clean full-image fixture only - no deploy
        if: github.ref == 'refs/heads/validation/baileys-buffer-servcel-20261026'
        run: |
          docker build --tag "optimus-buffer-fixture:$GITHUB_SHA" .
          docker run --rm --network none --entrypoint node "optimus-buffer-fixture:$GITHUB_SHA" --check /app/index.js
          docker run --rm --network none --entrypoint node "optimus-buffer-fixture:$GITHUB_SHA" --test /app/tests/baileys-initial-buffer-recovery.test.cjs
      - name: Official derived-image build fixture - no production mounts or network
        if: github.ref == 'refs/heads/validation/baileys-buffer-packaging-20261026'
        shell: bash
        run: |
          set -euo pipefail
          base=f50e8a294f839249e5427619e500e37332423363
          mkdir "$RUNNER_TEMP/baileys-base"
          git archive "$base" | tar -x -C "$RUNNER_TEMP/baileys-base"
          base_tag="local/optimus-deploy-base:ci-$GITHUB_RUN_ID"
          docker build --tag "$base_tag" "$RUNNER_TEMP/baileys-base"
          node scripts/guardian-v1.cjs build-dockerfile --base "$base" --source "$GITHUB_SHA" --base-tag "$base_tag" > "$RUNNER_TEMP/buffer.Dockerfile"
          node scripts/guardian-v1.cjs prepare --base "$base" --source "$GITHUB_SHA" --format dependencies-before > "$RUNNER_TEMP/before.tsv"
          node scripts/guardian-v1.cjs prepare --base "$base" --source "$GITHUB_SHA" --format dependencies-after > "$RUNNER_TEMP/after.tsv"
          while IFS=$'\t' read -r file hash; do
            test "$(docker run --rm --network none --entrypoint sha256sum "$base_tag" "/app/node_modules/@whiskeysockets/baileys/$file" | cut -d' ' -f1)" = "$hash"
          done < "$RUNNER_TEMP/before.tsv"
          for build in 1 2; do
            image="optimus-buffer-fixture:$GITHUB_SHA-$build"
            docker build --no-cache --network none --pull=false -f "$RUNNER_TEMP/buffer.Dockerfile" --tag "$image" .
            while IFS=$'\t' read -r file hash; do
              test "$(docker run --rm --network none --entrypoint sha256sum "$image" "/app/node_modules/@whiskeysockets/baileys/$file" | cut -d' ' -f1)" = "$hash"
            done < "$RUNNER_TEMP/after.tsv"
            docker run --rm --network none --entrypoint node "$image" --check /app/index.js
            docker run --rm --network none --volume "$GITHUB_WORKSPACE/tests/baileys-initial-buffer-recovery.test.cjs:/app/tests/baileys-initial-buffer-recovery.test.cjs:ro" --entrypoint node "$image" --test /app/tests/baileys-initial-buffer-recovery.test.cjs
          done
      - name: Landing Page isolated integration
        if: startsWith(github.ref, 'refs/heads/feature/landing-page-v1-') || github.ref == 'refs/heads/validation/landing-v13-media-buttons-20261025'
        env:
          LANDING_AUTH_CONTRACT_FILE: ${{ runner.temp }}/landing-auth-contract.json
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --check modules/landing-page/addresses.js
          node --check modules/landing-page/vercel-domains.js
          node --test tests/landing-page-v1.test.cjs tests/landing-page-auth-plans-integration.test.cjs tests/landing-page-v12.test.cjs tests/landing-page-v13.test.cjs
          node tests/planos-identidade-estavel-v1.test.js
          node tests/saas-fundacao-v1.test.js
      - name: Mensageiro V4 isolated contracts
        if: github.ref == 'refs/heads/validation/mensageiro-v4-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-canary-runtime-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-ingress-probe-20261026' || github.ref == 'refs/heads/validation/v4-admin-observation-20261026'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${OPTIMUS_MENSAGEIRO_V4_WORKSPACES:-}"
          test -z "${OPTIMUS_MENSAGEIRO_V4_TARGETS:-}"
          git merge-base --is-ancestor af56a3af675fd7f2c005a04d90e22fe72cbc95e6 HEAD
          node --test tests/mensageiro-v4.test.cjs tests/mensageiro-v4-canary.test.cjs tests/mensageiro-v4-ingress-probe.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/mensageiro-v3-operational-hotfix.test.cjs
          node tests/mensageiro-v3-m322-real-handlers.test.cjs
          node tests/mensageiro-v3-schedule-timezone.test.cjs
          node tests/mensageiro-v3-lock-identity.test.cjs
      - name: Radar ingress observer scoped validation
        if: github.ref == 'refs/heads/validation/radar-magalu-ingress-observer-20261026'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --check index.js
          node --check modules/radar/ingress-observation-v1.js
          node --test tests/radar-ingress-observation-v1.test.cjs tests/radar-whatsapp-capture-gate.test.js
      - name: Guardião V1 self-tests
        run: node tests/guardian-v1.test.cjs
      - name: Telemetry isolated authorization and read contracts
        if: github.ref == 'refs/heads/validation/telemetria-operacional-20261027' || github.ref == 'refs/heads/validation/telemetria-v11-panel-first-20261027'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test tests/telemetria-operacional.test.cjs
          node --test tests/telemetria-prepared-input.test.cjs
          node tests/telemetria-v1-backend.test.js
          node tests/observabilidade-v22-admin-backend.test.cjs
          node tests/observabilidade-v25-mensageiro-backend.test.cjs
          node --test tests/radar-ingress-observation-v1.test.cjs
          node --expose-gc tests/telemetria-performance.test.cjs
          git diff --exit-code 227c860e43d1d31904bd5a1332fa29b629a5b3de HEAD -- modules/radar modules/teleradar modules/clonador-grupos modules/engine modules/executor modules/fila modules/mensageiro modules/mensageiro-v4
      - name: Validate affected contracts
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          case "$GITHUB_REF" in
            refs/heads/validation/telemetria-operacional-20261027) base=227c860e43d1d31904bd5a1332fa29b629a5b3de ;;
            refs/heads/validation/telemetria-v11-panel-first-20261027) base=ba966b2022a5489e2c794d79513714cb55accf97 ;;
            refs/heads/validation/mensageiro-v4-20261025) base=af56a3af675fd7f2c005a04d90e22fe72cbc95e6 ;;
            refs/heads/validation/mensageiro-v4-canary-runtime-20261025) base=760c4c11b1b2d726cb212b6aa4ac4a8ab35a478f ;;
            refs/heads/validation/mensageiro-v4-ingress-probe-20261026) base=e55890ca4cf789cbdbdaf523f289ba6a2c891755 ;;
            refs/heads/validation/v4-admin-observation-20261026) base=1bb4176a4aac0efb501bf5ef1d4fd9e2eb8f5205 ;;
            refs/heads/validation/baileys-buffer-servcel-20261026) base=f50e8a294f839249e5427619e500e37332423363 ;;
            refs/heads/validation/baileys-buffer-packaging-20261026) base=f50e8a294f839249e5427619e500e37332423363 ;;
            refs/heads/feature/landing-page-v1-*) base=5a31e60524d9caac45883ca07511dcc208852f53 ;;
            refs/heads/validation/landing-v13-media-buttons-20261025) base=eda20ff6b69449c69a00ac7777beb3b868e1da80 ;;
          esac
          source="$(git rev-parse HEAD)"
          node scripts/guardian-v1.cjs validate --base "$base" --source "$source" --report "$RUNNER_TEMP/guardian-v1-report.json"
      - name: Deploy mechanism regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-backend-vps-manual.sh
          node tests/deploy-backend-v2-overlay-validation.test.cjs
          node tests/deploy-backend-compose-image-validation.test.cjs
          node tests/deploy-backend-manual-diagnostics.test.cjs

  telemetry-postgres:
    if: github.ref == 'refs/heads/validation/telemetria-operacional-20261027' || github.ref == 'refs/heads/validation/telemetria-v11-panel-first-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimus_telemetry_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55442:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d optimus_telemetry_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only SQL and multiworkspace fixture
        env:
          TELEMETRY_FIXTURE_PG_URL: postgresql://postgres@127.0.0.1:55442/optimus_telemetry_fixture
        run: |
          test -z "${DATABASE_URL:-}"
          node --test tests/telemetria-operacional.postgres.test.cjs

  v4-financial:
    if: github.ref == 'refs/heads/validation/mensageiro-v4-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-canary-runtime-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-ingress-probe-20261026' || github.ref == 'refs/heads/validation/v4-admin-observation-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimus_messenger_v4_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimus_messenger_v4_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Official credits and exact canary scope - disposable PostgreSQL 17
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${OPTIMUS_MENSAGEIRO_V4_TARGETS:-}"
          export V4_FIXTURE_SERVER_HOST="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$V4_FIXTURE_SERVER_HOST"
          node --test tests/mensageiro-v4-credit-scope.postgres.test.cjs
