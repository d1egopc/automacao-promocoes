name: Hostinger VPS Read-Only Preflight Temporary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-vps-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only production baseline on srv1947615
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify exact runner and production topology
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "srv1947615"
          test -r /opt/optimus/infra/compose.yml
          test -d /opt/optimus/data
          test -S /var/run/docker.sock
          docker version --format 'docker_server={{.Server.Version}}' >/dev/null
          printf 'RUNNER=PASS name=%s host=%s topology=PASS docker_read=PASS\n' "$RUNNER_NAME" "$(hostname)"

      - name: Inspect active runtime without mutations
        shell: bash
        run: |
          set -euo pipefail
          backend=optimus-backend
          compose=/opt/optimus/infra/compose.yml
          release=/opt/optimus/infra/backend-release.yml

          active_image="$(docker inspect -f '{{.Image}}' "$backend")"
          [[ "$active_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect -f '{{.Id}}' "$active_image")" = "$active_image"

          backend_status="$(docker inspect -f '{{.State.Status}}' "$backend")"
          backend_oom="$(docker inspect -f '{{.State.OOMKilled}}' "$backend")"
          backend_restarts="$(docker inspect -f '{{.RestartCount}}' "$backend")"
          backend_started="$(docker inspect -f '{{.State.StartedAt}}' "$backend")"
          backend_image_ref="$(docker inspect -f '{{.Config.Image}}' "$backend")"
          test "$backend_status" = running
          test "$backend_oom" = false

          base_revision_label="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$backend")"
          source_active=NAO_COMPROVADO
          if [[ "$backend_image_ref" =~ local/optimus-backend:([0-9a-f]{40})- ]]; then
            source_active="${BASH_REMATCH[1]}"
          else
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^local/optimus-backend:([0-9a-f]{40})- ]]; then
                source_active="${BASH_REMATCH[1]}"
                break
              fi
            done < <(docker image inspect -f '{{range .RepoTags}}{{println .}}{{end}}' "$active_image")
          fi
          if [[ ! "$source_active" =~ ^[0-9a-f]{40}$ ]] && [[ "$base_revision_label" =~ ^[0-9a-f]{40}$ ]]; then
            source_active="$base_revision_label"
          fi
          [[ "$source_active" =~ ^[0-9a-f]{40}$ ]]

          compose_args=(-f "$compose")
          release_state=absent
          release_hash=none
          if test -r "$release"; then
            compose_args+=(-f "$release")
            release_state=present
            release_hash="$(sha256sum "$release" | cut -d' ' -f1)"
          fi
          compose_hash="$(sha256sum "$compose" | cut -d' ' -f1)"

          postgres_id="$(docker compose "${compose_args[@]}" ps -q postgres)"
          test -n "$postgres_id"
          postgres_status="$(docker inspect -f '{{.State.Status}}' "$postgres_id")"
          postgres_health="$(docker inspect -f '{{.State.Health.Status}}' "$postgres_id")"
          test "$postgres_status" = running
          test "$postgres_health" = healthy

          data_mount="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}|{{.Source}}|{{.Destination}}|{{.RW}}{{end}}{{end}}' "$backend")"
          test "$data_mount" = 'bind|/opt/optimus/data|/data|true'
          data_free_kb="$(df -Pk /opt/optimus/data | awk 'NR==2 {print $4}')"
          [[ "$data_free_kb" =~ ^[0-9]+$ ]]

          internal_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/)"
          public_http="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://go.optimuspromo.com.br/)"
          test "$internal_http" = 200
          test "$public_http" = 200

          connected_events="$(docker logs --since "$backend_started" "$backend" 2>&1 | awk '/\[WHATSAPP\] WHATSAPP CONECTADO/{count++} END{print count+0}')"
          qr_events="$(docker logs --since "$backend_started" "$backend" 2>&1 | awk '/QR RECEBIDO|needs.?qr|precisa.?qr/{count++} END{print count+0}')"
          [[ "$connected_events" =~ ^[0-9]+$ ]]
          [[ "$qr_events" =~ ^[0-9]+$ ]]

          recovery_count=0
          recovery_tag=NAO_ENCONTRADA
          while IFS= read -r tag; do
            if [[ "$tag" == local/optimus-backend-recovery:* ]]; then
              recovery_count=$((recovery_count + 1))
              recovery_tag="$tag"
            fi
          done < <(docker image inspect -f '{{range .RepoTags}}{{println .}}{{end}}' "$active_image")
          rollback_status=READY_TO_TAG_BY_OFFICIAL_DEPLOY
          if test "$recovery_count" -gt 0; then
            test "$(docker image inspect -f '{{.Id}}' "$recovery_tag")" = "$active_image"
            rollback_status=PASS_EXISTING_TAG
          fi

          printf 'SOURCE_ATIVO=%s\n' "$source_active"
          printf 'IMAGEM_ATIVA=%s ref=%s base_revision_label=%s status=%s restarts=%s oom=%s started=%s\n' "$active_image" "$backend_image_ref" "$base_revision_label" "$backend_status" "$backend_restarts" "$backend_oom" "$backend_started"
          printf 'POSTGRES=healthy status=%s\n' "$postgres_status"
          printf 'MOUNTS_DATA=PASS mount=%s free_kb=%s compose_sha256=%s release=%s release_sha256=%s\n' "$data_mount" "$data_free_kb" "$compose_hash" "$release_state" "$release_hash"
          printf 'SESSOES=OBSERVACAO_SANITIZADA connected_events_since_start=%s qr_events_since_start=%s\n' "$connected_events" "$qr_events"
          printf 'HTTP=PASS internal=%s public=%s\n' "$internal_http" "$public_http"
          printf 'ROLLBACK_TAG=%s count=%s tag=%s image=%s immutable_image_present=PASS\n' "$rollback_status" "$recovery_count" "$recovery_tag" "$active_image"
          printf 'PREFLIGHT=PASS\n'

      - name: Inspect PostgreSQL, Intelligence flags and natural pipeline evidence
        shell: bash
        run: |
          set -euo pipefail
          backend=optimus-backend
          compose=/opt/optimus/infra/compose.yml
          release=/opt/optimus/infra/backend-release.yml
          compose_args=(-f "$compose")
          test ! -r "$release" || compose_args+=(-f "$release")
          postgres_id="$(docker compose "${compose_args[@]}" ps -q postgres)"
          test -n "$postgres_id"

          pg_query() {
            docker exec "$postgres_id" sh -c \
              'user="${POSTGRES_USER:-postgres}"; db="${POSTGRES_DB:-$user}"; exec psql -X -qAt -v ON_ERROR_STOP=1 -U "$user" -d "$db" -f -' \
              <<<"$1"
          }

          printf 'POSTGRES_DEEP_QUERY=STARTED\n'
          pg_version="$(pg_query "SELECT current_setting('server_version');")"
          pg_major="$(pg_query "SELECT current_setting('server_version_num')::int / 10000;")"
          printf 'POSTGRES_VERSION_OBSERVED=%s major=%s\n' "$pg_version" "$pg_major"
          pg_capacity="$(pg_query "SELECT current_setting('max_connections') || '|' || count(*) || '|' || count(*) FILTER (WHERE state='active') || '|' || count(*) FILTER (WHERE state='idle') || '|' || count(*) FILTER (WHERE wait_event_type='Lock') FROM pg_stat_activity WHERE datname=current_database();")"
          pg_ungranted_locks="$(pg_query "SELECT count(*) FROM pg_locks WHERE NOT granted;")"
          pg_oldest_xact_seconds="$(pg_query "SELECT COALESCE(floor(max(extract(epoch FROM (clock_timestamp()-xact_start))))::bigint,0) FROM pg_stat_activity WHERE datname=current_database() AND xact_start IS NOT NULL AND pid<>pg_backend_pid();")"
          memory_table="$(pg_query "SELECT COALESCE(to_regclass('public.intelligence_product_memory')::text,'absent');")"

          flag_value() {
            local name="$1" line value
            line="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$backend" | awk -F= -v key="$name" '$1==key {print; exit}')"
            if test -z "$line"; then
              printf 'ABSENT'
              return
            fi
            value="${line#*=}"
            case "$value" in
              off|OFF|0|1|shadow|SHADOW|active|ACTIVE) printf '%s' "$value" ;;
              *) printf 'PRESENT_UNRECOGNIZED' ;;
            esac
          }
          foundation_mode="$(flag_value OPTIMUS_INTELLIGENCE_V1_MODE)"
          foundation_disabled="$(flag_value OPTIMUS_INTELLIGENCE_V1_DISABLED)"
          memory_mode="$(flag_value OPTIMUS_INTELLIGENCE_V1_MEMORY_MODE)"
          memory_disabled="$(flag_value OPTIMUS_INTELLIGENCE_V1_MEMORY_DISABLED)"
          routing_mode="$(flag_value OPTIMUS_INTELLIGENCE_V1_ROUTING_MODE)"
          routing_disabled="$(flag_value OPTIMUS_INTELLIGENCE_V1_ROUTING_DISABLED)"

          table_exists() {
            test "$(pg_query "SELECT to_regclass('public.$1') IS NOT NULL;")" = t
          }
          captures='unavailable'
          jobs='unavailable'
          offers='unavailable'
          queue='unavailable'
          if table_exists engine_eventos_brutos; then
            captures="$(pg_query "SELECT count(*) FILTER (WHERE capturado_em>=now()-interval '60 minutes') || '|' || count(*) FILTER (WHERE capturado_em>=now()-interval '24 hours') || '|' || COALESCE(to_char(max(capturado_em) AT TIME ZONE 'UTC','YYYY-MM-DD_HH24:MI:SS_UTC'),'none') FROM engine_eventos_brutos;")"
          fi
          if table_exists engine_jobs_cliente; then
            jobs="$(pg_query "SELECT count(*) FILTER (WHERE criado_em>=now()-interval '60 minutes') || '|' || count(*) FILTER (WHERE criado_em>=now()-interval '24 hours') || '|' || COALESCE(to_char(max(atualizado_em) AT TIME ZONE 'UTC','YYYY-MM-DD_HH24:MI:SS_UTC'),'none') FROM engine_jobs_cliente;")"
          fi
          if table_exists engine_ofertas; then
            offers="$(pg_query "SELECT count(*) FILTER (WHERE criada_em>=now()-interval '60 minutes') || '|' || count(*) FILTER (WHERE criada_em>=now()-interval '24 hours') || '|' || COALESCE(to_char(max(atualizada_em) AT TIME ZONE 'UTC','YYYY-MM-DD_HH24:MI:SS_UTC'),'none') FROM engine_ofertas;")"
          fi
          if table_exists engine_universal_queue_destinations; then
            queue="$(pg_query "SELECT count(*) FILTER (WHERE updated_at>=now()-interval '60 minutes') || '|' || count(*) FILTER (WHERE updated_at>=now()-interval '24 hours') || '|' || count(*) FILTER (WHERE confirmed_at>=now()-interval '24 hours') || '|' || count(*) FILTER (WHERE status='send_started') || '|' || count(*) FILTER (WHERE status='ambiguous') || '|' || COALESCE(to_char(max(updated_at) AT TIME ZONE 'UTC','YYYY-MM-DD_HH24:MI:SS_UTC'),'none') FROM engine_universal_queue_destinations;")"
          fi

          printf 'POSTGRES_DEEP=PASS version=%s capacity=max|total|active|idle|lock_waiters:%s ungranted_locks=%s oldest_xact_seconds=%s\n' "$pg_version" "$pg_capacity" "$pg_ungranted_locks" "$pg_oldest_xact_seconds"
          printf 'INTELLIGENCE_TABLE=%s\n' "$memory_table"
          printf 'INTELLIGENCE_FLAGS=foundation_mode:%s foundation_disabled:%s memory_mode:%s memory_disabled:%s routing_mode:%s routing_disabled:%s\n' "$foundation_mode" "$foundation_disabled" "$memory_mode" "$memory_disabled" "$routing_mode" "$routing_disabled"
          printf 'PIPELINE_NATURAL=captures_60m|24h|latest:%s jobs_60m|24h|latest:%s offers_60m|24h|latest:%s queue_updated_60m|24h|confirmed24h|send_started_now|ambiguous_now|latest:%s\n' "$captures" "$jobs" "$offers" "$queue"
          printf 'DEEP_PREFLIGHT=PASS\n'
