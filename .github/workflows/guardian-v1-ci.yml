name: Guardian V1 CI only

on:
  push:
    branches:
      - validation/guardian-v1-*
      - validation/ml-title-identity-reconciled-20261108
      - validation/magalu-identity-subreason-20261108
      - validation/magalu-anchor-identity-20261109
      - validation/universal-anchor-title-category-20261109
      - validation/intelligence-metadata-reconciled-20261108
      - validation/mensageiro-v4-20261025
      - validation/mensageiro-v4-canary-runtime-20261025
      - validation/mensageiro-v4-ingress-probe-20261026
      - validation/v4-admin-observation-20261026
      - validation/baileys-buffer-servcel-20261026
      - validation/baileys-buffer-packaging-20261026
      - validation/radar-magalu-ingress-observer-20261026
      - validation/radar-ingress-correlation-20261106
      - validation/whatsapp-runtime-journal-correlation-20261107
      - validation/telemetria-operacional-20261027
      - validation/telemetria-v11-panel-first-20261027
      - validation/magalu-recovery-20261027
      - validation/magalu-firstparty-worker-v3-20261027
      - validation/magalu-recovery-focal-main-20261108
      - validation/classificador-universal-v3-20261027
      - feature/landing-page-v1-*
      - validation/landing-v13-media-buttons-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saas-fix1-postgres:
    if: startsWith(github.ref, 'refs/heads/validation/guardian-v1-saas-fix1-') || startsWith(github.ref, 'refs/heads/validation/guardian-v1-me-hotfix-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimus_universal_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimus_universal_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SaaS read-only and Google login failure injection
        run: |
          test -z "${DATABASE_URL:-}"
          node --test \
            tests/saas-fix1-readonly-auth.test.cjs \
            tests/saas-fundacao-v1.test.js \
            tests/saas-beta-config-v1.test.js \
            tests/saas-jornada-cadastro-v1.test.js \
            tests/saas-assinatura-v1.test.js \
            tests/saas-renovacao-assinatura-v1.test.js \
            tests/saas-paywall-pre-dashboard-v1.test.js \
            tests/financeiro-mercadopago-pix-v1.test.js \
            tests/financeiro-checkout-pix-publico-v1.test.js \
            tests/admin-auth-estrito.test.js \
            tests/admin-credit-topup-contract.test.js \
            tests/higiene-saas-conservadora.test.js \
            tests/workspace-registry-engine-v2.test.js \
            tests/executor-relogio-multiworkspace.test.js
          node --check index.js
      - name: Google Auth HTTP integration
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55433/optimus_universal_fixture
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          if [[ ! -e /data ]]; then
            sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /data
          fi
          test -w /data
          mkdir -p "$RUNNER_TEMP/saas-fix1-google-v3"
          MENSAGEIRO_V3_DATA_DIR="$RUNNER_TEMP/saas-fix1-google-v3" \
          node tests/saas-google-login-v1.test.js
          MENSAGEIRO_V3_DATA_DIR="$RUNNER_TEMP/saas-fix1-google-v3" \
          node tests/saas-me-readonly-v1.test.js

      - name: Password recovery HTTP integration
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55433/optimus_universal_fixture
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saas-fix1-recovery-v3"
          MENSAGEIRO_V3_DATA_DIR="$RUNNER_TEMP/saas-fix1-recovery-v3" \
          node tests/saas-recuperacao-senha-v1.test.js

      - name: Universal credit ledger regression on PostgreSQL 17
        if: ${{ !cancelled() }}
        env:
          UF_TEST_PG_PORT: "55433"
          UF_TEST_PG_EXPECTED_SERVER_PORT: "5432"
          UF_TEST_PG_EXPECTED_DATA_DIR: /var/lib/postgresql/data
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          export UF_TEST_PG_EXPECTED_SERVER_HOST="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$UF_TEST_PG_EXPECTED_SERVER_HOST"
          node tests/universal-flow-credits.postgres.js

  rio-p0-postgres:
    if: startsWith(github.ref, 'refs/heads/validation/guardian-v1-rio-p0-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimus_universal_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimus_universal_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only preflight and financial contract regressions
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --check index.js
          node --check modules/engine/universal-credit-eligibility.service.js
          node --test tests/universal-credit-preflight.test.cjs \
            tests/universal-initial-grant-migration.test.cjs \
            tests/saas-cortesia-v1.test.cjs \
            tests/saas-fundacao-v1.test.js \
            tests/saas-renovacao-assinatura-v1.test.js \
            tests/financeiro-mercadopago-pix-v1.test.js \
            tests/universal-flow-queue-executor.test.js \
            tests/universal-flow-queue-preflight.test.js
      - name: Universal preflight, ledger, concurrency and expiry on PostgreSQL 17
        env:
          UF_TEST_PG_PORT: "55433"
          UF_TEST_PG_EXPECTED_SERVER_PORT: "5432"
          UF_TEST_PG_EXPECTED_DATA_DIR: /var/lib/postgresql/data
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          export UF_TEST_PG_EXPECTED_SERVER_HOST="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')"
          test -n "$UF_TEST_PG_EXPECTED_SERVER_HOST"
          node tests/universal-credit-preflight.postgres.js
          node tests/saas-cortesia-v1.postgres.js
          node tests/universal-credit-sources.postgres.js
          node tests/universal-flow-credits.postgres.js
          node tests/universal-flow-expired-fresh.postgres.js

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: AliExpress Radar shortlink candidate - isolated importer and workspace proof
        if: github.ref == 'refs/heads/validation/guardian-v1-ali-magalu-recovery-20261031'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node tests/aliexpress-shortlink-radar-candidate.test.cjs
          node tests/aliexpress-shortlink-multitenancy-candidate.test.cjs
          node tests/aliexpress-manual-importador.test.js
          node tests/aliexpress-afiliacao-workspace.test.js
          node tests/aliexpress-app-moedas-contrato.test.js
          node tests/redirect-resolver-shortlinks-seguros.test.js
          node tests/magalu-engine-importer.test.js
          node tests/magalu-v2-golden-path.test.js
      - name: Diversos integration - isolated replay and commercial invariants
        if: github.ref == 'refs/heads/validation/guardian-v1-diversos-integracao-20261029'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          base=5dd99da80233ab9a49162e02e215b75982e3da28
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- index.js modules/radar modules/teleradar modules/clonador-grupos modules/fila modules/executor modules/mensageiro modules/telemetria utils optimus-capture marketplaces/shopee marketplaces/amazon marketplaces/aliexpress marketplaces/magalu marketplaces/mercadolivre package.json package-lock.json .github/workflows/deploy-backend-vps.yml scripts/deploy-backend-vps-manual.sh
          test "$(git diff --name-only "$base" HEAD -- modules)" = modules/engine/importer/importer.service.js
          node --test tests/diversos-integracao.test.cjs tests/classificador-diversos-20261028.test.cjs
          mkdir -p "$RUNNER_TEMP/diversos-base" "$RUNNER_TEMP/diversos-reports"
          git archive "$base" | tar -x -C "$RUNNER_TEMP/diversos-base"
          node tests/classificador-diversos-replay.cjs --baseline "$RUNNER_TEMP/diversos-base" --out "$RUNNER_TEMP/diversos-reports/focal.json"
          node tests/diversos-integracao-replay.cjs --baseline "$RUNNER_TEMP/diversos-base" --out "$RUNNER_TEMP/diversos-reports/real40.json"
          node --expose-gc tests/classificador-v3-replay.cjs --baseline "$RUNNER_TEMP/diversos-base" --benchmark --out "$RUNNER_TEMP/diversos-reports/v3.json"
          node tests/diversos-engine-materialization-benchmark.cjs --out "$RUNNER_TEMP/diversos-reports/engine-materialization.json"
      - name: Preserve isolated Diversos replays
        if: always() && github.ref == 'refs/heads/validation/guardian-v1-diversos-integracao-20261029'
        uses: actions/upload-artifact@v4
        with:
          name: diversos-integration-replays
          path: ${{ runner.temp }}/diversos-reports/*.json
          if-no-files-found: error
      - name: Garimpei reconciled release - preserve published Shopee and exact sensor
        if: github.ref == 'refs/heads/validation/guardian-v1-garimpei-release-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          git merge-base --is-ancestor 711f864885710e03324735abbdef708d2f6f6d19 HEAD
          git merge-base --is-ancestor 58ac3d19840bb25c8f72bb29e5ac60128a148bd4 HEAD
          git diff --exit-code 868a0cf2d176bb06c014443100b0384269d73016 HEAD -- marketplaces/shopee/importar.js modules/engine/importer/adapters/shopee.adapter.js
          git diff --exit-code ee8f56360e8e943ada9ba360566ef12b2bf107d7 HEAD -- index.js modules/radar modules/telemetria scripts/garimpei-infra-guard.py scripts/garimpei-journal-cleanup.py docs/infra
          git diff --exit-code 58ac3d19840bb25c8f72bb29e5ac60128a148bd4 HEAD -- modules/engine modules/teleradar modules/clonador-grupos modules/fila modules/executor modules/mensageiro modules/mensageiro-v3 modules/mensageiro-v4 utils marketplaces optimus-capture package.json package-lock.json
          python3 -B tests/garimpei-infra-fixtures.py -v
          node --test tests/garimpei-infra.test.cjs tests/garimpei-compose-integration.test.cjs tests/radar-ingress-observation-v1.test.cjs tests/radar-garimpei-observation.test.cjs tests/radar-garimpei-sensor24h.test.cjs tests/telemetria-operacional.test.cjs tests/telemetria-prepared-input.test.cjs tests/telemetria-permanent-contract.test.cjs
          node --test tests/shopee-contextual-recovery.test.cjs tests/shopee-recovery-limits.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node scripts/benchmark-garimpei-sensor24h.cjs
      - name: Garimpei infrastructure - closed mount and retention on Linux
        if: github.ref == 'refs/heads/validation/guardian-v1-garimpei-infra-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          python3 -B tests/garimpei-infra-fixtures.py -v
          node --test tests/garimpei-infra.test.cjs tests/radar-garimpei-sensor24h.test.cjs tests/radar-garimpei-observation.test.cjs tests/radar-ingress-observation-v1.test.cjs
          node scripts/benchmark-garimpei-sensor24h.cjs
          git diff --exit-code 711f864885710e03324735abbdef708d2f6f6d19 HEAD -- index.js modules utils marketplaces optimus-capture package.json package-lock.json
          node --test tests/garimpei-compose-integration.test.cjs
      - name: Garimpei 24h sensor - privacy, bounded journal and on-demand read
        if: github.ref == 'refs/heads/validation/guardian-v1-garimpei-sensor24h-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test tests/radar-ingress-observation-v1.test.cjs tests/radar-garimpei-observation.test.cjs tests/radar-garimpei-sensor24h.test.cjs tests/telemetria-operacional.test.cjs tests/telemetria-prepared-input.test.cjs tests/telemetria-permanent-contract.test.cjs
          node scripts/benchmark-garimpei-sensor24h.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          git diff --exit-code 12589a07843954fb6ea858f34da4c56861e64f8a HEAD -- modules/engine modules/teleradar modules/clonador-grupos modules/fila modules/executor modules/mensageiro modules/mensageiro-v3 modules/mensageiro-v4 optimus-capture utils package.json package-lock.json .github/workflows/deploy-backend-vps.yml
      - name: Garimpei passive observation - exact target and isolated fixtures
        if: github.ref == 'refs/heads/validation/guardian-v1-garimpei-observation-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test tests/radar-ingress-observation-v1.test.cjs tests/radar-garimpei-observation.test.cjs tests/telemetria-operacional.test.cjs tests/telemetria-prepared-input.test.cjs tests/telemetria-permanent-contract.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          git diff --exit-code 12589a07843954fb6ea858f34da4c56861e64f8a HEAD -- modules/engine modules/teleradar modules/clonador-grupos modules/fila modules/executor modules/mensageiro modules/mensageiro-v3 modules/mensageiro-v4 optimus-capture utils package.json package-lock.json .github/workflows/deploy-backend-vps.yml
      - name: Shopee contextual recovery and preserved Magalu Telegram contracts
        if: github.ref == 'refs/heads/validation/shopee-magalu-recovery-20261028' || github.ref == 'refs/heads/validation/guardian-v1-shopee-release-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test --test-concurrency=1 tests/shopee-contextual-recovery.test.cjs tests/shopee-recovery-limits.test.cjs tests/shopee-*.test.js tests/manual-v2-import-shopee.test.js tests/links-comerciais-v2-aliexpress-shopee.test.js tests/magalu-teleradar-recovery.test.cjs tests/magalu-affiliate-link.test.js tests/magalu-factual-resolver.test.js tests/magalu-firstparty-identity-fallback.test.cjs tests/magalu-recovery-retry.test.cjs tests/teleradar.test.js tests/teleradar-handoff.test.js tests/teleradar-operational-control.test.js tests/teleradar-semantica-comercial.test.js tests/safe-redirect-http-lifecycle.test.js
          git diff --exit-code 12589a07843954fb6ea858f34da4c56861e64f8a HEAD -- index.js modules/radar modules/teleradar modules/clonador-grupos modules/fila modules/executor modules/mensageiro-v3 modules/mensageiro-v4 optimus-capture utils/template-universal.js package.json package-lock.json
      - name: Definitive Messenger backend - isolated fixtures only, no deploy
        if: github.ref == 'refs/heads/validation/guardian-v1-messenger-backend-definitivo-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${OPTIMUS_MENSAGEIRO_V4_TARGETS:-}"
          node --test tests/mensageiro-backend-definitivo.test.cjs tests/mensageiro-v3-*.test.cjs tests/mensageiro-v4.test.cjs tests/mensageiro-v4-canary.test.cjs tests/mensageiro-v4-ingress-probe.test.cjs tests/mensageiro-release-readiness.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/whatsapp-reconnect-seguro.test.js
          git diff --exit-code dc4f3f0b9f6f61ce3bbaee0f87675b796bd4b58e HEAD -- index.js modules/radar modules/teleradar modules/clonador-grupos modules/engine modules/fila modules/executor optimus-capture bootstrap package.json package-lock.json
      - name: Universal Messenger - real routers and existing engines, isolated only
        if: github.ref == 'refs/heads/validation/guardian-v1-messenger-universal-20261028'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --test tests/mensageiro-universal.test.cjs tests/mensageiro-v3-*.test.cjs tests/mensageiro-v4.test.cjs tests/mensageiro-v4-canary.test.cjs tests/mensageiro-v4-ingress-probe.test.cjs tests/mensageiro-release-readiness.test.cjs
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/whatsapp-reconnect-seguro.test.js
          git diff --exit-code f9cfc3865ce848c223c84f2e3f916764a25028d2 HEAD -- modules/radar modules/teleradar modules/clonador-grupos modules/engine modules/fila modules/executor optimus-capture package.json package-lock.json
      - name: Messenger readiness - isolated HTTP, handlers and persistence
        if: github.ref == 'refs/heads/validation/guardian-v1-messenger-readiness-20261028'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${OPTIMUS_MENSAGEIRO_V4_TARGETS:-}"
          node --test tests/mensageiro-v3-*.test.cjs tests/mensageiro-v4.test.cjs tests/mensageiro-v4-canary.test.cjs tests/mensageiro-v4-ingress-probe.test.cjs tests/mensageiro-release-readiness.test.cjs tests/mensageiro-programacoes.test.cjs tests/mensageiro-bot-comandos.test.cjs tests/mensageiro-gerente-grupo.test.cjs
          node tests/whatsapp-reconnect-seguro.test.js
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/universal-flow-queue-executor.test.js
          node tests/radar-cobertura-v1.test.js
          node tests/teleradar-handoff.test.js
          node tests/clonador-grupos-foundation.test.js
          node tests/fila-viva-runtime-wiring.test.js
          test "$(git diff --name-only f9cfc3865ce848c223c84f2e3f916764a25028d2 HEAD -- index.js modules optimus-capture package.json package-lock.json)" = modules/mensageiro-v3/routes.js
      - name: Exact Baileys packaging profile - isolated only
        if: github.ref == 'refs/heads/validation/baileys-buffer-packaging-20261026'
        run: |
          node scripts/guardian-v1.cjs prepare --base f50e8a294f839249e5427619e500e37332423363 --source "$GITHUB_SHA"
          node -e "require('./modules/whatsapp/baileys-buffer-hotfix.service.js').applyPatch()"
          node --test tests/guardian-baileys-buffer-packaging.test.cjs
      - name: Baileys buffer recovery and essential contracts
        if: github.ref == 'refs/heads/validation/baileys-buffer-servcel-20261026' || github.ref == 'refs/heads/validation/baileys-buffer-packaging-20261026'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
