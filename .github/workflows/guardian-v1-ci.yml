    if: github.ref == 'refs/heads/validation/mensageiro-v4-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-canary-runtime-20261025' || github.ref == 'refs/heads/validation/mensageiro-v4-ingress-probe-20261026' || github.ref == 'refs/heads/validation/v4-admin-observation-20261026' || github.ref == 'refs/heads/validation/guardian-v1-messenger-readiness-20261028' || github.ref == 'refs/heads/validation/guardian-v1-messenger-universal-20261028' || github.ref == 'refs/heads/validation/guardian-v1-messenger-backend-definitivo-20261028'
