name: Intelligence V1 Phase A CI only

on:
  push:
    branches:
      - validation/intelligence-v1-phase-a-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static contract
        run: |
          node --check modules/inteligencia-universal/foundation-v1.service.js
          node --check modules/inteligencia-universal/oferta-universal.service.js
          node --check modules/inteligencia-universal/index.js
          npm run audit:encoding
      - name: Intelligence V1 Phase A focal contract
        run: node --test tests/intelligence-v1-phase-a.test.cjs
      - name: Category and Universal compatibility
        run: |
          node --test \
            tests/diversos-v4.test.cjs \
            tests/diversos-integracao.test.cjs \
            tests/classificador-diversos-20261028.test.cjs \
            tests/classificador-copy-focal.test.cjs \
            tests/classificador-universal-v3.test.cjs \
            tests/classificador-v3-evidencia-marketplace.test.cjs \
            tests/classificador-v3-magalu-evidencia.test.cjs \
            tests/classificador-v3-legacy-parity.test.cjs
          node tests/inteligencia-universal-decisao.test.js
          node tests/categorias-reducao-diversos.test.js
          node tests/classificador-universal-v2-categorias.test.js
      - name: Known baseline debts remain unchanged
        shell: bash
        run: |
          set -uo pipefail
          baseline_dir="$RUNNER_TEMP/intelligence-v1-baseline"
          git worktree add --detach "$baseline_dir" c8765343215232cb976efc4f70679f72c4287e87
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"

          compare_with_baseline() {
            local test_file="$1"
            local candidate_log="$RUNNER_TEMP/candidate-$(basename "$test_file").log"
            local baseline_log="$RUNNER_TEMP/baseline-$(basename "$test_file").log"
            local candidate_status=0
            local baseline_status=0

            node "$test_file" >"$candidate_log" 2>&1 || candidate_status=$?
            if [[ "$candidate_status" -eq 0 ]]; then
              echo "PASS candidate: $test_file"
              return 0
            fi

            (
              cd "$baseline_dir"
              node "$test_file" >"$baseline_log" 2>&1
            ) || baseline_status=$?

            if [[ "$baseline_status" -eq 0 ]]; then
              echo "REGRESSION: candidate failed but published baseline passed: $test_file"
              cat "$candidate_log"
              return 1
            fi

            local candidate_fingerprint
            local baseline_fingerprint
            candidate_fingerprint="$(grep -E 'AssertionError|at .*tests/.*:[0-9]+:[0-9]+' "$candidate_log" | sed -E 's#^.*tests/#tests/#' | head -n 4)"
            baseline_fingerprint="$(grep -E 'AssertionError|at .*tests/.*:[0-9]+:[0-9]+' "$baseline_log" | sed -E 's#^.*tests/#tests/#' | head -n 4)"

            if [[ -z "$candidate_fingerprint" || "$candidate_fingerprint" != "$baseline_fingerprint" ]]; then
              echo "REGRESSION: failure differs from published baseline: $test_file"
              echo "Candidate fingerprint:"
              printf '%s\n' "$candidate_fingerprint"
              echo "Baseline fingerprint:"
              printf '%s\n' "$baseline_fingerprint"
              cat "$candidate_log"
              return 1
            fi

            echo "BASELINE_DEBT_UNCHANGED: $test_file"
            printf '%s\n' "$candidate_fingerprint"
          }

          compare_with_baseline tests/engine-v2-marketplaces-fidelidade.test.js
          compare_with_baseline tests/template-universal-visual-contract.test.js
      - name: Six marketplace and downstream preservation
        run: |
          node tests/link-conversao-ocorrencia-marketplaces.test.js
          node tests/contrato-comercial-final-universal.test.js
          node tests/imagem-link-contrato-universal.test.js
          node tests/dynamic-link-resolvers.test.js
          node tests/redirect-resolver-shortlinks-seguros.test.js
          node tests/teleradar-handoff.test.js
          node tests/clonador-grupos-foundation.test.js
          node tests/destino-geral-distributor.test.js
      - name: Guardian against published base
        run: node scripts/guardian-v1.cjs validate --base c8765343215232cb976efc4f70679f72c4287e87 --source "$GITHUB_SHA" --report "$RUNNER_TEMP/intelligence-v1-phase-a-guardian.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-v1-phase-a-evidence
          path: ${{ runner.temp }}/intelligence-v1-phase-a-guardian.json
