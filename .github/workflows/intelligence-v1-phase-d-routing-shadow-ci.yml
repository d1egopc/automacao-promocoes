name: Intelligence V1 Phase D routing shadow CI only

on:
  push:
    branches:
      - validation/intelligence-v1-phase-d-routing-shadow-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-v1-phase-d-routing-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: intelligence_v1_phase_d_fixture
          POSTGRES_USER: intelligence_v1_phase_d_ci
          POSTGRES_PASSWORD: intelligence_v1_phase_d_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelligence_v1_phase_d_ci -d intelligence_v1_phase_d_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_SHA: 887e0d7c29b6321d7e6bd25cb134cf4155f75294
      DATABASE_URL: ""
      INTELLIGENCE_MEMORY_TEST_DATABASE_URL: postgresql://intelligence_v1_phase_d_ci:intelligence_v1_phase_d_disposable@127.0.0.1:5432/intelligence_v1_phase_d_fixture
      OPTIMUS_INTELLIGENCE_V1_MODE: "off"
      OPTIMUS_INTELLIGENCE_V1_DISABLED: "1"
      OPTIMUS_INTELLIGENCE_V1_MEMORY_MODE: "off"
      OPTIMUS_INTELLIGENCE_V1_MEMORY_DISABLED: "1"
      OPTIMUS_INTELLIGENCE_V1_ROUTING_MODE: "off"
      OPTIMUS_INTELLIGENCE_V1_ROUTING_DISABLED: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prove isolated scope and locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/validation/intelligence-v1-phase-d-routing-shadow-20261107
          test -z "${DATABASE_URL:-}"
          node --version | grep -Eq '^v24\.'
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"..HEAD
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/intelligence-v1-phase-d-routing-shadow-ci.yml \
            modules/engine/distributor/distributor.service.js \
            modules/engine/importer/importer.service.js \
            modules/inteligencia-universal/index.js \
            modules/inteligencia-universal/routing-shadow-v1.service.js \
            tests/fixtures/intelligence-v1-phase-d.sanitized.json \
            tests/intelligence-v1-phase-d.test.cjs | sort)"
          test "$changed" = "$expected"
          npm ci
      - name: Static and scope isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check modules/inteligencia-universal/routing-shadow-v1.service.js
          node --check modules/inteligencia-universal/index.js
          node --check modules/engine/importer/importer.service.js
          node --check modules/engine/distributor/distributor.service.js
          node --check tests/intelligence-v1-phase-d.test.cjs
          ! grep -Eq 'modules/(executor|fila|auto-clean)|frontend|migrations' <(git diff --name-only "$BASE_SHA"..HEAD)
          ! grep -Eq 'Sex Shop \+18' marketplaces/inteligencia/categorias-globais.js
          npm run audit:encoding
      - name: Phase D focal routing shadow
        run: node --test tests/intelligence-v1-phase-d.test.cjs
      - name: Phases A B C preservation with PostgreSQL 17
        run: |
          node --test \
            tests/intelligence-v1-phase-a.test.cjs \
            tests/intelligence-v1-memory.test.cjs \
            tests/intelligence-v1-phase-c.test.cjs
          node tests/intelligence-v1-memory.postgres.test.cjs
      - name: Distributor RIO fanout and destination regressions
        run: |
          node tests/destino-geral-distributor.test.js
          node tests/destinos-compatibilidade-kabum-awin.test.js
          node tests/engine-fanout-universal-v2.test.js
          node tests/fila-fanout-destinos-estado.test.js
          node tests/engine-distributor-origem-fairness.test.js
      - name: Six marketplaces and commercial invariants
        run: |
          node tests/link-conversao-ocorrencia-marketplaces.test.js
          node tests/contrato-comercial-final-universal.test.js
          node tests/radar-commercial-fidelity.test.cjs
          node tests/magalu-clonador-universal-e2e.test.js
      - name: Guardian against Phase C candidate
        run: node scripts/guardian-v1.cjs validate --base "$BASE_SHA" --source "$GITHUB_SHA" --report "$RUNNER_TEMP/intelligence-v1-phase-d-guardian.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-v1-phase-d-evidence
          path: ${{ runner.temp }}/intelligence-v1-phase-d-guardian.json
