name: KaBuM shortlink proof CI only

on:
  push:
    branches: [validation/guardian-v1-kabum-shortlink-proof-p0-20261116]

permissions:
  contents: read

jobs:
  kabum-shortlink-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 96223308cf82d0e4af4544a1103446bed0558e74
      KABUM_PG_FIXTURE_DIR: /var/lib/postgresql/data
      ML_WORK_ENRICHMENT_ACTIVE: '0'
      ML_WORK_ENRICHMENT_CANARY_CLIENTES: ''
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optimus_kabum_ci_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimus_kabum_ci_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact scope and Guardian overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          diff -u <(printf '%s\n' \
            'A .github/workflows/kabum-shortlink-proof-ci.yml' \
            'M modules/engine/importer/adapters/awin.adapter.js' \
            'M modules/engine/importer/importer.service.js' \
            'A tests/kabum-shortlink-proof.postgres.cjs' \
            'A tests/kabum-shortlink-technical-proof.test.cjs') \
            <(git diff --name-status --no-renames "$BASE_SHA" HEAD | tr '\t' ' ')
          node scripts/guardian-v1.cjs prepare --base "$BASE_SHA" --source "$GITHUB_SHA" \
            --release-mode overlay > "$RUNNER_TEMP/plan.json"
          node -e '
            const assert = require("node:assert/strict");
            const plan = require(process.argv[1]);
            assert.equal(plan.validation, "PASS");
            assert.equal(plan.deployMode, "overlay");
            assert.deepEqual([...plan.runtimeFiles].sort(), [
              "modules/engine/importer/adapters/awin.adapter.js",
              "modules/engine/importer/importer.service.js"
            ]);
            console.log("GUARDIAN_RUNTIME=" + plan.runtimeFiles.join(","));
          ' "$RUNNER_TEMP/plan.json"
      - name: Clean Node 24 dependencies
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: npm ci
      - name: Real job 1167194 and focal contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/engine/importer/adapters/awin.adapter.js
          node --check modules/engine/importer/importer.service.js
          node --test --test-reporter=tap \
            tests/kabum-shortlink-technical-proof.test.cjs \
            tests/kabum-categoria-ancora.test.cjs \
            tests/destinos-compatibilidade-kabum-awin.test.js \
            tests/link-conversao-ocorrencia-marketplaces.test.js \
            tests/universal-flow-queue-preflight.test.js | tee "$RUNNER_TEMP/node24.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/node24.log"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/node24.log"
      - name: PostgreSQL 17 persisted proof, queue and workspace isolation
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=tap \
            tests/kabum-shortlink-proof.postgres.cjs \
            tests/kabum-anchor-queue.postgres.cjs | tee "$RUNNER_TEMP/pg17.log"
          grep -Eq '^# pass 2$' "$RUNNER_TEMP/pg17.log"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/pg17.log"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/pg17.log"
      - name: Build disposable Linux overlay and smoke-test candidate
        shell: bash
        run: |
          set -euo pipefail
          base_image="local/optimus-deploy-base:ci-$GITHUB_RUN_ID"
          candidate="local/optimus-kabum-candidate:ci-$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/kabum-base" "$RUNNER_TEMP/kabum-context" "$RUNNER_TEMP/kabum-test"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/kabum-base"
          grep -Fx 'RUN npm ci --omit=dev' "$RUNNER_TEMP/kabum-base/Dockerfile"
          grep -F 'apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core' "$RUNNER_TEMP/kabum-base/Dockerfile"
          sed -e 's|apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core|apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core git ca-certificates|' \
            -e 's|^RUN npm ci --omit=dev$|RUN GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf GIT_CONFIG_VALUE_0=ssh://git@github.com/ npm ci --omit=dev|' \
            "$RUNNER_TEMP/kabum-base/Dockerfile" > "$RUNNER_TEMP/kabum-base.Dockerfile"
          docker build -f "$RUNNER_TEMP/kabum-base.Dockerfile" -t "$base_image" "$RUNNER_TEMP/kabum-base"
          for file in modules/engine/importer/adapters/awin.adapter.js modules/engine/importer/importer.service.js; do
            install -D "$file" "$RUNNER_TEMP/kabum-context/$file"
          done
          node scripts/guardian-v1.cjs build-dockerfile --base "$BASE_SHA" --source "$GITHUB_SHA" \
            --base-tag "$base_image" > "$RUNNER_TEMP/kabum-overlay.Dockerfile"
          grep -Fx 'COPY --chown=node:node modules/engine/importer/adapters/awin.adapter.js /app/modules/engine/importer/adapters/awin.adapter.js' "$RUNNER_TEMP/kabum-overlay.Dockerfile"
          grep -Fx 'COPY --chown=node:node modules/engine/importer/importer.service.js /app/modules/engine/importer/importer.service.js' "$RUNNER_TEMP/kabum-overlay.Dockerfile"
          if grep -F 'COPY --chown=node:node optimus-capture/' "$RUNNER_TEMP/kabum-overlay.Dockerfile"; then
            echo 'Chrome extension files must stay outside the KaBuM overlay' >&2
            exit 1
          fi
          docker build --pull=false --network=none -f "$RUNNER_TEMP/kabum-overlay.Dockerfile" -t "$candidate" "$RUNNER_TEMP/kabum-context"
          for file in modules/engine/importer/adapters/awin.adapter.js modules/engine/importer/importer.service.js; do
            candidate_hash="$(git show "$GITHUB_SHA:$file" | sha256sum | cut -d' ' -f1)"
            test "$(docker run --rm --network=none "$candidate" sha256sum "/app/$file" | cut -d' ' -f1)" = "$candidate_hash"
            printf 'OVERLAY_HASH %s %s\n' "$candidate_hash" "$file"
          done
          docker image inspect "$candidate" --format 'DOCKER_IMAGE_ID={{.Id}}'
          cp tests/kabum-shortlink-technical-proof.test.cjs "$RUNNER_TEMP/kabum-test/"
          docker run --rm --network=none \
            -e ML_WORK_ENRICHMENT_ACTIVE=0 -e ML_WORK_ENRICHMENT_CANARY_CLIENTES= \
            --mount "type=bind,src=$RUNNER_TEMP/kabum-test,dst=/app/ci-kabum,readonly" \
            "$candidate" node --test /app/ci-kabum/kabum-shortlink-technical-proof.test.cjs
