name: Mensageiro Baileys listener CI only

on:
  push:
    branches:
      - validation/mensageiro-baileys-listener-observability-20261023
      - validation/gerente-v2-observability-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/validation/mensageiro-baileys-listener-observability-20261023' || github.ref == 'refs/heads/validation/gerente-v2-observability-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --version | grep -Eq '^v24\.'
          case "$GITHUB_REF" in
            refs/heads/validation/mensageiro-baileys-listener-observability-20261023)
              base=348cde4cf7a20c518a60435b7ddb0768e97e86ba
              expected=(
                .github/workflows/mensageiro-baileys-listener-ci.yml
                index.js
                modules/telemetria/infra-memory-snapshot.js
                modules/whatsapp/socket-listener-lifecycle.service.js
                scripts/deploy-backend-vps-manual.sh
                tests/deploy-backend-runtime-classification.test.cjs
                tests/deploy-backend-compose-image-validation.test.cjs
                tests/whatsapp-socket-listener-baileys-real.test.cjs
              )
              ;;
            refs/heads/validation/gerente-v2-observability-20261024)
              base=10b066f827117bb78af310e982de99b5880119bc
              expected=(
                .github/workflows/mensageiro-baileys-listener-ci.yml
                docs/GERENTE-V2-OBSERVABILITY.md
                index.js
                modules/mensageiro-v3/operational-gates.js
                modules/mensageiro/gerente-observability-v2.js
                modules/mensageiro/gerente-observability-v2.routes.js
                modules/mensageiro/gerente.service.js
                scripts/deploy-backend-vps-manual.sh
                scripts/benchmark-gerente-observability-v2.cjs
                tests/deploy-backend-v2-overlay-validation.test.cjs
                tests/mensageiro-gerente-observability-v2.test.cjs
                tests/whatsapp-socket-listener-baileys-real.test.cjs
              )
              ;;
            *) echo "unsupported_ref:$GITHUB_REF" >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort > /tmp/listener-actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/listener-expected
          diff -u /tmp/listener-expected /tmp/listener-actual
          if [ "$GITHUB_REF" = 'refs/heads/validation/mensageiro-baileys-listener-observability-20261023' ]; then
            bash -n scripts/deploy-backend-vps-manual.sh
            node tests/deploy-backend-runtime-classification.test.cjs
            node tests/deploy-backend-compose-image-validation.test.cjs
          else
            bash -n scripts/deploy-backend-vps-manual.sh
            node tests/deploy-backend-v2-overlay-validation.test.cjs
          fi
      - run: npm ci
      - name: Listener and Messenger regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          if [ "$GITHUB_REF" = 'refs/heads/validation/gerente-v2-observability-20261024' ]; then
            node tests/mensageiro-gerente-observability-v2.test.cjs
          fi
          node tests/whatsapp-socket-listener-baileys-real.test.cjs
          node tests/whatsapp-socket-listener-lifecycle.test.js
          node tests/infra-memory-snapshot.test.js
          node tests/mensageiro-bot-comandos.test.cjs
          node tests/mensageiro-gerente-grupo.test.cjs
          node tests/mensageiro-programacoes.test.cjs
          node tests/mensageiro-v3-schedule-timezone.test.cjs
          node tests/mensageiro-v3-original-ui-compat.test.cjs
          node tests/mensageiro-v3-operational-hotfix.test.cjs
      - name: RIO Radar TeleRadar Clonador and live queue contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/universal-flow-queue-executor.test.js
          node tests/radar-cobertura-v1.test.js
          node tests/teleradar-handoff.test.js
          node tests/clonador-grupos-foundation.test.js
          node tests/fila-viva-runtime-wiring.test.js
