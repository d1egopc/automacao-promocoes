name: Mensageiro V3 M3.4-P3 isolated validation

on:
  push:
    branches:
      - validation/mensageiro-v3-m34-p3-node24-20261020

permissions:
  contents: read

concurrency:
  group: mensageiro-v3-m34-p3-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-node24:
    name: GitHub-hosted Linux / Node 24 / fence-aware rollback
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/mensageiro-v3-m34-p3-node24-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove isolated runner, ref, and no production database
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/validation/mensageiro-v3-m34-p3-node24-20261020
          test "$(node --version | cut -c1-3)" = v24
          test -z "${DATABASE_URL:-}"

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax, encoding, and isolated scope checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check modules/mensageiro/storage.js
          node --check modules/mensageiro/programacoes.scheduler.js
          node --check modules/mensageiro-v3/src/v3/store.js
          node --check modules/mensageiro-v3/src/v3/scheduler.js
          node --check modules/mensageiro-v3/src/v3/baileys-ack-correlator.js
          node --check modules/mensageiro-v3/src/v3/integration-matrix.js
          node --check modules/mensageiro-v3/routes.js
          node --check modules/mensageiro-v3/workspace-fence.js
          node --check modules/mensageiro-v3/handler-bridge.js
          node --check modules/mensageiro-v3/adapter.js
          node --check modules/mensageiro-v3/legacy-compat.js
          node --check modules/mensageiro/programacoes.scheduler.js
          node --check index.js
          node --check modules/engine/auto-clean/auto-clean.service.js
          node --check tests/mensageiro-programacoes.test.cjs
          node --check tests/mensageiro-v3-m33-persistence.test.cjs
          node --check tests/mensageiro-v3-m34-p21-recurrence.test.cjs
          node --check tests/mensageiro-v3-m34-p3-rollback.test.cjs
          node --check tests/mensageiro-v3-baileys-ack.test.cjs
          node --check tests/mensageiro-v3-m34-p3-container-smoke.cjs
          node --check tests/mensageiro-v3-universal.test.cjs
          node --check tests/mensageiro-v3-original-ui-compat.test.cjs
          node --check tests/mensageiro-v3-release-bootstrap.test.cjs
          node --check modules/links/engine-capture-diagnostic.routes.js
          node --check modules/radar/redirect/contextual-html-candidate.js
          node --check modules/radar/redirect/redirect-diagnostic-code.js
          node --check tests/optimus-auto-clean-v1-shadow.test.js
          npm run audit:encoding
          git diff --check origin/main...HEAD

      - name: V3 persistence, restart, fence, and real handler gates
        run: |
          node --test tests/mensageiro-v3-release-bootstrap.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m33-persistence.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m331-durability.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m32-integration.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-routes.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m322-real-handlers.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m34-p21-recurrence.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-m34-p3-rollback.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-baileys-ack.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-universal.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-v3-original-ui-compat.test.cjs

      - name: Legacy Mensageiro and production guard regressions
        run: |
          node tests/mensageiro-programacoes.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-bot-comandos.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-atendimento-perfil-pv.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-gerente-grupo.test.cjs
          node --test --test-concurrency=1 tests/mensageiro-multiperfil-isolamento.test.cjs

      - name: Auto-Clean production contract and claims isolation
        run: |
          node tests/optimus-auto-clean-v1-shadow.test.js
          node tests/fila-historico-compactacao.test.js
          node tests/engine-validator-claim-recovery.test.js

      - name: Build disposable fence-aware image (no registry, no production)
        shell: bash
        run: |
          set -Eeuo pipefail
          image="mensageiro-v3-m34-p3:${GITHUB_SHA}"
          docker build --pull=false --file Dockerfile --tag "$image" .
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          printf 'IMAGE_TAG=%s\nIMAGE_ID=%s\nIMAGE_REPO_DIGEST=%s\n' "$image" "$image_id" "${digest:-unpublished-local-image}" | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect "$image" --format '{{.Config.User}}' | grep -qx node

      - name: Prove restart and container recreation with disposable volume
        shell: bash
        run: |
          set -Eeuo pipefail
          volume="mensageiro-v3-m34-p3-smoke-${GITHUB_RUN_ID}"
          image="mensageiro-v3-m34-p3:${GITHUB_SHA}"
          cleanup() { docker volume rm "$volume" >/dev/null 2>&1 || true; docker image rm "$image" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          # An empty Docker volume is root-owned even though the image's
          # application data directory is node-owned. Initialize only this
          # disposable volume before running the unprivileged smoke checks.
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$image" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$image" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify "$image" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
