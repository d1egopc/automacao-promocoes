name: Mensageiro V3 M3.4-P3 image artifacts

on:
  push:
    branches:
      - validation/mensageiro-v3-m34-p3-node24-20261020

permissions:
  contents: read
  packages: write

concurrency:
  group: mensageiro-v3-m34-p3-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-publish-and-smoke:
    name: GitHub-hosted Linux / Node 24 / immutable images
    if: github.ref == 'refs/heads/validation/mensageiro-v3-m34-p3-node24-20261020'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: d1egopc
      IMAGE_REPO: automacao-promocoes
      BASE_SHA: ecaeb3cfd9acede0d4902e50bee28f79810a0519
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require only the three recovered modules and release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          changed="$(git diff --name-only "$BASE_SHA..HEAD" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/mensageiro-v3-m34-p2-validation.yml \
            .github/workflows/mensageiro-v3-m34-p3-image-artifacts.yml \
            modules/links/engine-capture-diagnostic.routes.js \
            modules/radar/redirect/contextual-html-candidate.js \
            modules/radar/redirect/redirect-diagnostic-code.js \
            tests/mensageiro-v3-release-bootstrap.test.cjs \
            tests/mensageiro-v3-release-http-smoke.sh | sort)"
          test "$changed" = "$expected"

      - name: Use Node 24 for gate tooling
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirm Node 24
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version | grep -Eq '^v24\.'

      - name: Verify recovered bootstrap dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --test tests/mensageiro-v3-release-bootstrap.test.cjs
          node --check index.js
          git diff --check "$BASE_SHA..HEAD"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with the ephemeral GitHub token
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable publication image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$REGISTRY/$IMAGE_OWNER/$IMAGE_REPO/mensageiro-v3-publication"
          ref="$image:$SOURCE_SHA"
          docker buildx build \
            --pull=false \
            --provenance=false \
            --sbom=false \
            --file Dockerfile \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$IMAGE_OWNER/$IMAGE_REPO" \
            --label "org.optimus.mensageiro.role=publication" \
            --tag "$ref" \
            --push .
          echo "PUBLICATION_REF=$ref" >> "$GITHUB_ENV"

      - name: Build and push immutable fence-aware recovery image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$REGISTRY/$IMAGE_OWNER/$IMAGE_REPO/mensageiro-v3-recovery"
          ref="$image:$SOURCE_SHA"
          docker buildx build \
            --pull=false \
            --provenance=false \
            --sbom=false \
            --file Dockerfile \
            --build-arg MENSAGEIRO_V3_RECOVERY_DISABLED=true \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$IMAGE_OWNER/$IMAGE_REPO" \
            --label "org.optimus.mensageiro.role=fence-aware-recovery" \
            --label "org.optimus.mensageiro.legacy=blocked" \
            --tag "$ref" \
            --push .
          echo "RECOVERY_REF=$ref" >> "$GITHUB_ENV"

      - name: Pull by immutable references and record digests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$PUBLICATION_REF"
          docker pull "$RECOVERY_REF"
          publication_digest="$(docker image inspect "$PUBLICATION_REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          recovery_digest="$(docker image inspect "$RECOVERY_REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          [[ "$publication_digest" == sha256:* ]]
          [[ "$recovery_digest" == sha256:* ]]
          publication_repo="${PUBLICATION_REF%:*}"
          recovery_repo="${RECOVERY_REF%:*}"
          publication_immutable="$publication_repo@$publication_digest"
          recovery_immutable="$recovery_repo@$recovery_digest"
          docker pull "$publication_immutable"
          docker pull "$recovery_immutable"
          {
            echo "IMAGE_PUBLICATION_REF=$publication_immutable"
            echo "IMAGE_PUBLICATION_DIGEST=$publication_digest"
            echo "IMAGE_RECOVERY_REF=$recovery_immutable"
            echo "IMAGE_RECOVERY_DIGEST=$recovery_digest"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PUBLICATION_REF=$publication_immutable" >> "$GITHUB_ENV"
          echo "RECOVERY_REF=$recovery_immutable" >> "$GITHUB_ENV"

      - name: Verify GHCR packages remain private
        shell: bash
        run: |
          set -Eeuo pipefail
          anonymous_status() {
            local package="$1"
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://$REGISTRY/v2/$IMAGE_OWNER/$IMAGE_REPO/$package/manifests/$SOURCE_SHA"
          }
          publication_status="$(anonymous_status mensageiro-v3-publication)"
          recovery_status="$(anonymous_status mensageiro-v3-recovery)"
          [[ "$publication_status" == 401 || "$publication_status" == 403 ]]
          [[ "$recovery_status" == 401 || "$recovery_status" == 403 ]]
          echo "GHCR_PRIVATE_VERIFIED=true" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke publication image with restart and persistent V3 state
        shell: bash
        run: |
          set -Eeuo pipefail
          volume="mensageiro-v3-p3-publish-${GITHUB_RUN_ID}"
          cleanup() { docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$PUBLICATION_REF" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$PUBLICATION_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          cid="$(docker create --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify "$PUBLICATION_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs)"
          docker start -a "$cid"
          docker rm "$cid" >/dev/null
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify "$PUBLICATION_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs

      - name: Smoke fence-aware recovery without changing V3 state
        shell: bash
        run: |
          set -Eeuo pipefail
          volume="mensageiro-v3-p3-recovery-${GITHUB_RUN_ID}"
          cleanup() { docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$PUBLICATION_REF" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$PUBLICATION_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs >/tmp/v3-seed.json
          before="$(docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$RECOVERY_REF" sha256sum /data/mensageiro-v3/state.json | awk '{print $1}')"
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify -e V3_SMOKE_EXPECT_RECOVERY_DISABLED=true "$RECOVERY_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          after="$(docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$RECOVERY_REF" sha256sum /data/mensageiro-v3/state.json | awk '{print $1}')"
          test "$before" = "$after"
          echo "Recovery image kept the V3 state unchanged and blocked the legacy handler." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap both images with disposable PostgreSQL 17 and HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/mensageiro-v3-release-http-smoke.sh "$PUBLICATION_REF"
          bash tests/mensageiro-v3-release-http-smoke.sh "$RECOVERY_REF"
