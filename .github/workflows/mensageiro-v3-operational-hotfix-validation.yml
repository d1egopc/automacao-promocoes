name: Mensageiro V3 operational hotfix CI-only

on:
  push:
    branches:
      - validation/mensageiro-v3-operational-hotfix-20261021

permissions:
  contents: read

jobs:
  node24-docker:
    if: github.ref == 'refs/heads/validation/mensageiro-v3-operational-hotfix-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Confirm isolated scope and runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --version | grep -Eq '^v24\.'
          git merge-base --is-ancestor 1e9bd1104ae549cf09f9095e726cc8c0addfdd48 HEAD
          changed="$(git diff --name-only 1e9bd1104ae549cf09f9095e726cc8c0addfdd48..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/mensageiro-v3-operational-hotfix-validation.yml \
            index.js \
            modules/mensageiro-v3/operational-gates.js \
            modules/mensageiro-v3/src/v3/scheduler.js \
            modules/mensageiro-v3/src/v3/store.js \
            tests/mensageiro-v3-m34-p21-recurrence.test.cjs \
            tests/mensageiro-v3-operational-hotfix.test.cjs | sort)"
          test "$changed" = "$expected"
          git diff --check 1e9bd1104ae549cf09f9095e726cc8c0addfdd48..HEAD
      - run: npm ci
      - name: Operational hotfix and V3 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check index.js
          node --check modules/mensageiro-v3/operational-gates.js
          node --check modules/mensageiro-v3/src/v3/scheduler.js
          node --check modules/mensageiro-v3/src/v3/store.js
          node --test --test-concurrency=1 \
            tests/mensageiro-v3-operational-hotfix.test.cjs \
            tests/mensageiro-v3-m322-real-handlers.test.cjs \
            tests/mensageiro-v3-m34-p21-recurrence.test.cjs \
            tests/mensageiro-v3-baileys-ack.test.cjs \
            tests/mensageiro-v3-universal.test.cjs \
            tests/mensageiro-v3-m34-p3-rollback.test.cjs
          node --test tests/mensageiro-v3-release-bootstrap.test.cjs
      - name: Build and smoke disposable publication and recovery images
        shell: bash
        run: |
          set -Eeuo pipefail
          publication="v3-operational-hotfix-publication:${GITHUB_SHA}"
          recovery="v3-operational-hotfix-recovery:${GITHUB_SHA}"
          docker build --pull=false --file Dockerfile --tag "$publication" .
          docker build --pull=false --file Dockerfile --build-arg MENSAGEIRO_V3_RECOVERY_DISABLED=true --tag "$recovery" .
          bash tests/mensageiro-v3-release-http-smoke.sh "$publication"
          bash tests/mensageiro-v3-release-http-smoke.sh "$recovery"
          volume="v3-hotfix-${GITHUB_RUN_ID}"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$publication" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$publication" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify -e V3_SMOKE_EXPECT_RECOVERY_DISABLED=true "$recovery" node tests/mensageiro-v3-m34-p3-container-smoke.cjs

  private-images:
    needs: node24-docker
    if: github.ref == 'refs/heads/validation/mensageiro-v3-operational-hotfix-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      FUNCTIONAL_SHA: a0e14ccb974fe02c12d7f8a178a43a861b0c6363
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve the approved functional candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$FUNCTIONAL_SHA" HEAD
          test "$(git diff --name-only "$FUNCTIONAL_SHA..HEAD")" = ".github/workflows/mensageiro-v3-operational-hotfix-validation.yml"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create new packages with harmless seed and prove PRIVATE before code
        shell: bash
        run: |
          set -Eeuo pipefail
          for role in publication recovery; do
            package="automacao-promocoes%2Fmensageiro-v3-hotfix-20261021-${role}"
            existing="$(gh api "/users/d1egopc/packages/container/${package}" --jq '.visibility' 2>/dev/null || true)"
            if [[ -n "$existing" ]]; then
              echo "GHCR_NEW_PACKAGE_REQUIRED_${role^^}"
              exit 1
            fi
          done
          docker pull hello-world:latest
          for role in publication recovery; do
            image="ghcr.io/d1egopc/automacao-promocoes/mensageiro-v3-hotfix-20261021-${role}"
            package="automacao-promocoes%2Fmensageiro-v3-hotfix-20261021-${role}"
            docker tag hello-world:latest "$image:privacy-seed-$GITHUB_RUN_ID"
            docker push "$image:privacy-seed-$GITHUB_RUN_ID"
            visibility=""
            for attempt in 1 2 3 4 5; do
              visibility="$(gh api "/users/d1egopc/packages/container/${package}" --jq '.visibility' 2>/dev/null || true)"
              [[ -n "$visibility" ]] && break
              sleep 2
            done
            echo "GHCR_SEED_${role^^}_VISIBILITY=${visibility:-UNKNOWN}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$visibility" != private ]]; then
              echo "GHCR_PRIVATE_GATE_FAILED_${role^^}=${visibility:-UNKNOWN}"
              exit 1
            fi
          done
      - name: Publish both candidate roles by unique SHA tag
        shell: bash
        run: |
          set -Eeuo pipefail
          for role in publication recovery; do
            image="ghcr.io/d1egopc/automacao-promocoes/mensageiro-v3-hotfix-20261021-${role}"
            build_args=()
            if [[ "$role" == recovery ]]; then build_args+=(--build-arg MENSAGEIRO_V3_RECOVERY_DISABLED=true); fi
            docker buildx build --pull=false --provenance=false --sbom=false \
              --file Dockerfile "${build_args[@]}" \
              --label "org.opencontainers.image.revision=$FUNCTIONAL_SHA" \
              --label "org.optimus.mensageiro.role=$role" \
              --tag "$image:$GITHUB_SHA" --push .
            digest="$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
            [[ "$digest" == sha256:* ]]
            docker pull "$image@$digest"
            echo "${role^^}_REF=$image@$digest" >> "$GITHUB_ENV"
            echo "${role^^}_REF=$image@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Verify private visibility and fence-aware recovery from immutable digests
        shell: bash
        run: |
          set -Eeuo pipefail
          for role in publication recovery; do
            package="automacao-promocoes%2Fmensageiro-v3-hotfix-20261021-${role}"
            test "$(gh api "/users/d1egopc/packages/container/${package}" --jq '.visibility')" = private
          done
          volume="v3-hotfix-pull-${GITHUB_RUN_ID}"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$PUBLICATION_REF" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$PUBLICATION_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify -e V3_SMOKE_EXPECT_RECOVERY_DISABLED=true "$RECOVERY_REF" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
