name: Mensageiro V3 operational hotfix CI-only

on:
  push:
    branches:
      - validation/mensageiro-v3-operational-hotfix-20261021

permissions:
  contents: read

jobs:
  node24-docker:
    if: github.ref == 'refs/heads/validation/mensageiro-v3-operational-hotfix-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Confirm isolated scope and runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          node --version | grep -Eq '^v24\.'
          git merge-base --is-ancestor 1e9bd1104ae549cf09f9095e726cc8c0addfdd48 HEAD
          changed="$(git diff --name-only 1e9bd1104ae549cf09f9095e726cc8c0addfdd48..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/mensageiro-v3-operational-hotfix-validation.yml \
            index.js \
            modules/mensageiro-v3/operational-gates.js \
            modules/mensageiro-v3/src/v3/scheduler.js \
            modules/mensageiro-v3/src/v3/store.js \
            tests/mensageiro-v3-m34-p21-recurrence.test.cjs \
            tests/mensageiro-v3-operational-hotfix.test.cjs | sort)"
          test "$changed" = "$expected"
          git diff --check 1e9bd1104ae549cf09f9095e726cc8c0addfdd48..HEAD
      - run: npm ci
      - name: Operational hotfix and V3 regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check index.js
          node --check modules/mensageiro-v3/operational-gates.js
          node --check modules/mensageiro-v3/src/v3/scheduler.js
          node --check modules/mensageiro-v3/src/v3/store.js
          node --test --test-concurrency=1 \
            tests/mensageiro-v3-operational-hotfix.test.cjs \
            tests/mensageiro-v3-m322-real-handlers.test.cjs \
            tests/mensageiro-v3-m34-p21-recurrence.test.cjs \
            tests/mensageiro-v3-baileys-ack.test.cjs \
            tests/mensageiro-v3-universal.test.cjs \
            tests/mensageiro-v3-m34-p3-rollback.test.cjs
          node --test tests/mensageiro-v3-release-bootstrap.test.cjs
      - name: Build and smoke disposable publication and recovery images
        shell: bash
        run: |
          set -Eeuo pipefail
          publication="v3-operational-hotfix-publication:${GITHUB_SHA}"
          recovery="v3-operational-hotfix-recovery:${GITHUB_SHA}"
          docker build --pull=false --file Dockerfile --tag "$publication" .
          docker build --pull=false --file Dockerfile --build-arg MENSAGEIRO_V3_RECOVERY_DISABLED=true --tag "$recovery" .
          bash tests/mensageiro-v3-release-http-smoke.sh "$publication"
          bash tests/mensageiro-v3-release-http-smoke.sh "$recovery"
          volume="v3-hotfix-${GITHUB_RUN_ID}"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user root --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" "$publication" sh -lc 'chown -R node:node /data/mensageiro-v3'
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=seed "$publication" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
          docker run --rm --user node --mount "type=volume,src=$volume,dst=/data/mensageiro-v3" -e V3_SMOKE_ROOT=/data/mensageiro-v3 -e V3_SMOKE_MODE=verify -e V3_SMOKE_EXPECT_RECOVERY_DISABLED=true "$recovery" node tests/mensageiro-v3-m34-p3-container-smoke.cjs
