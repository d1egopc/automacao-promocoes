name: Servmaq and AliExpress storage read-only

on:
  push:
    branches:
      - validation/servmaq-aliexpress-storage-readonly-20261015

permissions:
  contents: read

concurrency:
  group: servmaq-aliexpress-storage-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    name: Storage and pipeline evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/servmaq-aliexpress-storage-readonly-20261015'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      COMPOSE_FILE: /opt/optimus/infra/compose.yml
      BACKEND_DIR: /opt/optimus/backend
      DATA_DIR: /opt/optimus/data
      CLIENT_ID: user_k3phmbkf
      EXPECTED_SHA: ac3a0f65518d93574f5035f295635f4009c1b199
      DEPLOY_CUTOFF: '2026-10-15T04:43:00Z'
      SERVMAQ_WINDOW_START: '2026-10-15T12:03:00Z'
      SERVMAQ_WINDOW_END: '2026-10-15T12:08:00Z'

    steps:
      - name: Checkout workflow only
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify isolated read-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/validation/servmaq-aliexpress-storage-readonly-20261015
          test "$GITHUB_WORKSPACE" != "$BACKEND_DIR"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$files" = '.github/workflows/servmaq-aliexpress-storage-readonly.yml'
          printf 'scope=isolated read_only=true production_mutation=false\n'

      - name: Read Servmaq JSON and AliExpress PostgreSQL evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '\n### Storage and pipeline evidence\n' >> "$GITHUB_STEP_SUMMARY"
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          postgres_id="$(docker compose -f "$COMPOSE_FILE" ps -q postgres)"
          test -n "$backend_id" && test -n "$postgres_id"
          docker inspect --format 'backend_status={{.State.Status}} restart={{.RestartCount}} oom={{.State.OOMKilled}}' "$backend_id"
          docker inspect --format 'postgres_status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart={{.RestartCount}} oom={{.State.OOMKilled}}' "$postgres_id"
          printf 'production_sha='; git -C "$BACKEND_DIR" rev-parse HEAD
          test "$(git -C "$BACKEND_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"
          docker exec -i "$backend_id" env CLIENT_ID="$CLIENT_ID" DEPLOY_CUTOFF="$DEPLOY_CUTOFF" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const pg = require('pg');
          const NativePromise = globalThis.Promise;
          if (typeof NativePromise !== 'function') throw new Error('native_promise_unavailable');
          if (pg.defaults && typeof pg.defaults === 'object') pg.defaults.Promise = NativePromise;
          const { Pool } = pg;
          const clientId = process.env.CLIENT_ID;
          const cutoff = process.env.DEPLOY_CUTOFF;
          const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { console.log('FILE_READ_FAILED=' + path.basename(file)); return null; } };
          const hashId = value => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 12) : '';
          const globalConfig = readJson('/data/mensageiro.json');
          const client = readJson(`/data/clientes/${clientId}/mensageiro-config.json`);
          const cfg = globalConfig && globalConfig[clientId] && typeof globalConfig[clientId] === 'object' ? globalConfig[clientId] : null;
          const radar = readJson(`/data/clientes/${clientId}/radar-config.json`);
          const radarSessions = Array.isArray(radar?.sessoesWhatsappMonitoradas) ? radar.sessoesWhatsappMonitoradas : [];
          const radarGroups = radarSessions.flatMap(s => Array.isArray(s?.gruposMonitorados) ? s.gruposMonitorados : []);
          console.log('ALIEXPRESS_RADAR_SOURCE_CONFIG=' + JSON.stringify({
            workspace: clientId,
            monitoramentoAtivo: radar?.monitoramentoAtivo === true,
            sessions: radarSessions.length,
            activeSessions: radarSessions.filter(s => s?.ativo !== false).length,
            groups: radarGroups.length,
            activeGroups: radarGroups.filter(g => g?.ativo !== false).length,
            sessionIdsPresent: radarSessions.filter(s => s?.sessaoId || s?.id || s?.sessionId).length,
            groupIdsPresent: radarGroups.filter(g => g?.id || g?.grupoId || g?.jid).length
          }));
          let radarConfigCount = 0; let activeRadarConfigCount = 0; let monitoredSessionCount = 0; let monitoredGroupCount = 0;
          try {
            const dirs = fs.readdirSync('/data/clientes', { withFileTypes: true }).filter(d => d.isDirectory()).slice(0, 200);
            for (const dir of dirs) {
              const r = readJson(`/data/clientes/${dir.name}/radar-config.json`);
              if (!r) continue;
              radarConfigCount++;
              if (r.monitoramentoAtivo === true) activeRadarConfigCount++;
              const ss = Array.isArray(r.sessoesWhatsappMonitoradas) ? r.sessoesWhatsappMonitoradas : [];
              monitoredSessionCount += ss.filter(s => s?.ativo !== false).length;
              monitoredGroupCount += ss.reduce((n, s) => n + (Array.isArray(s?.gruposMonitorados) ? s.gruposMonitorados.filter(g => g?.ativo !== false).length : 0), 0);
            }
          } catch {}
          console.log('ALIEXPRESS_RADAR_CONFIG_SUMMARY=' + JSON.stringify({ radarConfigCount, activeRadarConfigCount, monitoredSessionCount, monitoredGroupCount }));
          const profiles = Array.isArray(cfg?.perfis) ? cfg.perfis : [];
          const byProfile = new Map(profiles.map(p => [String(p?.id || ''), p]));
          const programs = Array.isArray(cfg?.programacoes) ? cfg.programacoes : [];
          const selected = programs.filter(p => /bom\s*dia/i.test(String(p?.nome || '')) || String(p?.horario || '') === '07:00');
          console.log('SERVMAQ_CONFIG_FILE_READ=' + Boolean(cfg));
          console.log('SERVMAQ_HISTORY_FILE_READ=' + Boolean(client));
          console.log('SERVMAQ_PROGRAM_FOUND=' + (selected.length > 0));
          console.log('SERVMAQ_PROGRAM_COUNT=' + selected.length);
          for (const p of selected.slice(0, 10)) {
            const profile = byProfile.get(String(p?.perfilId || ''));
            const groups = Array.isArray(p?.grupos) ? p.grupos : (Array.isArray(p?.gruposIds) ? p.gruposIds : []);
            const contents = Array.isArray(p?.conteudos) ? p.conteudos : [];
            const image = contents.find(c => /imagem/i.test(String(c?.tipo || '')) || c?.imagem || c?.imagemUrl || c?.url);
            console.log('SERVMAQ_PROGRAM=' + JSON.stringify({
              id: String(p?.id || ''), nome: String(p?.nome || ''), ativo: p?.ativo === true,
              horario: String(p?.horario || ''), perfilId: String(p?.perfilId || ''), status: String(p?.status || ''),
              nextRunAt: String(p?.nextRunAt || ''), ultimoEnvioEm: String(p?.ultimoEnvioEm || ''),
              ultimoRunIdPresent: Boolean(p?.ultimoRunId), lockAtePresent: Boolean(p?.lockAte), groupsCount: groups.length,
              imagePresent: Boolean(image), imageType: image ? String(image?.tipo || 'unknown') : '',
              globalSessionPresent: Boolean(cfg?.sessaoId || cfg?.sessaoWhatsappId || cfg?.sessaoGruposId),
              profileSessionPresent: Boolean(profile?.sessaoId),
              profileSessionMatches: Boolean(profile && String(profile.sessaoId || '') === String(cfg?.sessaoId || cfg?.sessaoWhatsappId || cfg?.sessaoGruposId || '')),
              globalSessionHashes: [cfg?.sessaoId, cfg?.sessaoWhatsappId, cfg?.sessaoGruposId].filter(Boolean).map(hashId),
              profileSessionHash: hashId(profile?.sessaoId),
              programGroupHashes: groups.slice(0, 20).map(g => hashId(typeof g === 'object' ? (g?.id || g?.jid || g?.grupoId || g?.groupId) : g)),
              sendResultFieldsPresent: ['ultimoResultado','resultadoEnvio','ultimoEnvioResultado','ultimoErro','respostaEnvio'].some(k => p?.[k] !== undefined)
            }));
          }
          const managerFiles = ['/data/clientes/' + clientId + '/mensageiro-gerente-infracoes.json', '/data/clientes/' + clientId + '/mensageiro-gerente-operacional.json'];
          for (const file of managerFiles) {
            const data = readJson(file);
            const entries = Array.isArray(data?.infracoes) ? data.infracoes : (Array.isArray(data?.motivos) ? data.motivos : []);
            const hits = entries.filter(x => /teste/i.test(JSON.stringify(x || {})) || /07:20|10:20/.test(JSON.stringify(x || {})));
            console.log('SERVMAQ_MANAGER_FILE=' + path.basename(file) + ' entries=' + entries.length + ' matching_window=' + hits.length);
          }
          const historySources = [client?.atendimento?.historico, client?.historicoProgramacoes, client?.programacoesHistorico, cfg?.historicoProgramacoes];
          const history = historySources.find(Array.isArray) || [];
          const h0700 = history.filter(x => /07:00|2026-10-15/.test(JSON.stringify(x || {})));
          console.log('SERVMAQ_HISTORY_COUNT=' + history.length);
          console.log('SERVMAQ_HISTORY_0700_COUNT=' + h0700.length);
          for (const h of h0700.slice(0, 30)) console.log('SERVMAQ_HISTORY_0700=' + JSON.stringify({
            status: String(h?.status || h?.resultado || ''), resultado: String(h?.resultado || ''),
            timestamp: String(h?.timestamp || h?.data || h?.executadoEm || h?.criadoEm || ''),
            runIdPresent: Boolean(h?.runId || h?.ultimoRunId), lockPresent: Boolean(h?.lockAte),
            reason: String(h?.codigo || h?.motivo || h?.erro || '').slice(0, 80)
          }));
          const safeName = n => '"' + String(n).replaceAll('"', '""') + '"';
          const safeValue = (name, value) => {
            if (value === null || value === undefined) return null;
            if (/url|text|message|body|title|name|cookie|token|secret|password|credential|key|image|link|grupo|sessao|jid|phone/i.test(name)) return '<omitted>';
            const s = String(value); return s.length > 120 ? s.slice(0, 120) + '…' : s;
          };
          const wanted = ['engine_eventos_brutos','engine_links','engine_jobs_cliente','engine_processamentos','engine_ofertas','engine_eventos_comerciais','engine_universal_queue_items','engine_universal_queue_destinations','fila_claims_ativos','fila_checkpoints_entrega'];
          const timeCols = ['created_at','createdAt','captured_at','received_at','occurred_at','updated_at','capturado_em','criado_em','atualizado_em','ocorrido_em','criada_em','claimed_at','confirmed_at','started_at'];
          (async () => {
            const url = process.env.DATABASE_URL || process.env.DATABASE_URL_UNIVERSAL;
            if (!url) { console.log('ALIEXPRESS_DB_READONLY=UNAVAILABLE'); return; }
            const pool = new Pool({ connectionString: url, max: 1, connectionTimeoutMillis: 4000 });
            const c = await pool.connect();
            try {
              await c.query('BEGIN'); await c.query('SET TRANSACTION READ ONLY'); await c.query("SET LOCAL statement_timeout='5000ms'");
              const meta = (await c.query('SELECT table_name,column_name FROM information_schema.columns WHERE table_schema=$1 AND table_name = ANY($2::text[]) ORDER BY table_name,ordinal_position', ['public', wanted])).rows;
              const by = new Map(); for (const r of meta) { if (!by.has(r.table_name)) by.set(r.table_name, []); by.get(r.table_name).push(r.column_name); }
              console.log('ALIEXPRESS_DB_READONLY=PASS');
              for (const table of wanted) {
                const cols = by.get(table) || []; if (!cols.length) { console.log('ALIEXPRESS_TABLE=' + table + ' unavailable'); continue; }
                const tc = timeCols.find(x => cols.includes(x)); if (!tc) { console.log('ALIEXPRESS_TABLE=' + table + ' skipped_no_time_column'); continue; }
                const select = ['id','uuid','evento_id','event_id','link_id','job_id','cliente_id','workspace_id','marketplace','marketplace_detectado','fonte','origem_tipo','grupo_id','status','tentativas','motivo_final','motivo_status','etapa','oferta_id','fila_item_id','destination_id','terminal_status','credit_debited','confirmed_at','criado_em','atualizado_em','link_afiliado','link_original','link_expandido'].filter(x => cols.includes(x));
                if (!select.length) { console.log('ALIEXPRESS_TABLE=' + table + ' skipped_no_safe_columns'); continue; }
                const marketplace = cols.includes('marketplace') ? ` AND ${safeName('marketplace')}::text ILIKE '%aliexpress%'` : (cols.includes('marketplace_detectado') ? ` AND ${safeName('marketplace_detectado')}::text ILIKE '%aliexpress%'` : '');
                const sql = `SELECT ${select.map(safeName).join(',')} FROM ${safeName(table)} WHERE ${safeName(tc)} >= $1${marketplace} ORDER BY ${safeName(tc)} DESC LIMIT 50`;
                const rows = (await c.query(sql, [cutoff])).rows;
                console.log('ALIEXPRESS_TABLE=' + table + ' rows=' + rows.length);
                for (const row of rows.slice(0, 20)) { const out = {}; const presentFields = []; for (const [k,v] of Object.entries(row)) { if (/link_afiliado|link_original|link_expandido/i.test(k) && v) presentFields.push(k); out[k] = safeValue(k,v); } if (presentFields.length) out.present_fields = presentFields; console.log('ALIEXPRESS_ROW=' + JSON.stringify(out)); }
              }
              await c.query('COMMIT');
            } catch (e) { try { await c.query('ROLLBACK'); } catch {} console.log('ALIEXPRESS_DB_READONLY=FAILED reason=' + String(e.message).replace(/[^a-zA-Z0-9_. -]/g,' ').slice(0,160)); }
            finally { c.release(); await pool.end(); }
          })().catch(e => console.log('ALIEXPRESS_DB_READONLY=FAILED reason=' + String(e.message).replace(/[^a-zA-Z0-9_. -]/g,' ').slice(0,160)));
          NODE

      - name: Read-only targeted queue and delivery state
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          docker exec -i "$backend_id" env TARGET_WORKSPACE=user_pss60lus TARGET_EVENT=150165 TARGET_JOB=716302 TARGET_OFFER=125928 TARGET_ITEM=9474 node - <<'NODE'
          const crypto = require('crypto');
          const pg = require('pg');
          const NativePromise = globalThis.Promise;
          if (typeof NativePromise !== 'function') throw new Error('native_promise_unavailable');
          if (pg.defaults && typeof pg.defaults === 'object') pg.defaults.Promise = NativePromise;
          const { Pool } = pg;
          const workspace = process.env.TARGET_WORKSPACE;
          const eventId = Number(process.env.TARGET_EVENT);
          const jobId = Number(process.env.TARGET_JOB);
          const offerId = Number(process.env.TARGET_OFFER);
          const itemId = Number(process.env.TARGET_ITEM);
          const hash = value => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 12) : '';
          const safeName = name => '"' + String(name).replaceAll('"', '""') + '"';
          const pick = (row, names) => { for (const n of names) if (Object.prototype.hasOwnProperty.call(row, n)) return row[n]; return null; };
          const proofWorkspace = value => {
            if (!value || typeof value !== 'object') return false;
            const candidates = [value.workspaceId, value.workspace_id, value.clienteId, value.cliente_id, value.afiliacaoWorkspace?.workspaceId, value.conversaoWorkspace?.workspaceId];
            return candidates.some(v => String(v || '') === workspace);
          };
          const metadataWorkspaceMatches = value => {
            if (!value) return false;
            try { return proofWorkspace(typeof value === 'string' ? JSON.parse(value) : value); } catch { return false; }
          };
          const urlProof = value => {
            if (!value) return { present: false, https: false, host: '' };
            try { const u = new URL(String(value)); return { present: true, https: u.protocol === 'https:', host: u.hostname }; }
            catch { return { present: true, https: false, host: '' }; }
          };
          const safeFields = ['id','status','state','revision','terminal_at','terminal_status','terminal_reason','created_at','updated_at','available_at','send_started_at','confirmed_at','credit_debited','resolved_at','resolution_source','channel','attempts','tentativas','motivo_codigo','classificacao','status_http','estado','criado_em','atualizado_em','fila_item_id','queue_item_id','evento_id','job_id','oferta_id','workspace_id','cliente_id','tipo_evento','origem_pipeline'];
          const readTable = async (c, table, predicate, params) => {
            const cols = (await c.query('SELECT column_name FROM information_schema.columns WHERE table_schema=$1 AND table_name=$2 ORDER BY ordinal_position', ['public', table])).rows.map(r => r.column_name);
            if (!cols.length) { console.log('TARGET_TABLE=' + table + ' unavailable'); return []; }
            const selected = safeFields.filter(x => cols.includes(x));
            for (const extra of ['metadata','link_afiliado','cliente_id']) if (cols.includes(extra) && !selected.includes(extra)) selected.push(extra);
            const rows = (await c.query(`SELECT ${selected.map(safeName).join(',')} FROM ${safeName(table)} WHERE ${predicate}`, params)).rows;
            console.log('TARGET_TABLE=' + table + ' rows=' + rows.length);
            return rows;
          };
          const sanitizeRow = row => {
            const out = {};
            for (const [k,v] of Object.entries(row)) {
              if (/metadata/i.test(k)) continue;
              if (/destination_id|connection_id|provider_message_id|confirmation_key|workspace_id|cliente_id|fila_item_id|queue_item_id|grupo|sessao|link|url/i.test(k)) out[k] = v ? '<present:' + hash(v) + '>' : v;
              else if (/terminal_reason|motivo_codigo|classificacao/i.test(k)) out[k] = v == null ? null : String(v).slice(0, 100);
              else out[k] = v;
            }
            return out;
          };
          (async () => {
            const url = process.env.DATABASE_URL || process.env.DATABASE_URL_UNIVERSAL;
            if (!url) { console.log('TARGET_DB_READONLY=UNAVAILABLE'); return; }
            const pool = new Pool({ connectionString: url, max: 1, connectionTimeoutMillis: 4000 });
            const c = await pool.connect();
            try {
              await c.query('BEGIN'); await c.query('SET TRANSACTION READ ONLY'); await c.query("SET LOCAL statement_timeout='5000ms'");
              const items = await readTable(c, 'engine_universal_queue_items', '"id"=$1', [itemId]);
              for (const row of items) console.log('TARGET_QUEUE_ITEM=' + JSON.stringify(sanitizeRow(row)));
              const destinations = await readTable(c, 'engine_universal_queue_destinations', '"queue_item_id"=$1 AND "workspace_id"=$2', [itemId, workspace]);
              console.log('TARGET_DESTINATIONS_COUNT=' + destinations.length);
              for (const row of destinations) console.log('TARGET_DESTINATION=' + JSON.stringify(sanitizeRow(row)));
              const checkpoints = await readTable(c, 'fila_checkpoints_entrega', '"fila_item_id"=$1', ['universal_' + itemId]);
              for (const row of checkpoints) console.log('TARGET_CHECKPOINT=' + JSON.stringify(sanitizeRow(row)));
              const events = await readTable(c, 'engine_eventos_comerciais', '(("job_id"=$1) OR ("oferta_id"=$2)) AND ("workspace_id"=$3 OR "cliente_id"=$3)', [jobId, offerId, workspace]);
              for (const row of events) console.log('TARGET_COMMERCIAL_EVENT=' + JSON.stringify(sanitizeRow(row)));
              const offers = await readTable(c, 'engine_ofertas', '"id"=$1 AND "evento_id"=$2', [offerId, eventId]);
              for (const row of offers) {
                const link = urlProof(row.link_afiliado);
                console.log('TARGET_OFFER=' + JSON.stringify({ id: row.id, status: row.status, motivo_status: row.motivo_status, linkAfiliadoPresent: link.present, linkAfiliadoHttps: link.https, linkAfiliadoHost: link.host || '', metadataWorkspaceMatches: metadataWorkspaceMatches(row.metadata) }));
              }
              const jobs = await readTable(c, 'engine_jobs_cliente', '"id"=$1 AND "evento_id"=$2 AND "cliente_id"=$3', [jobId, eventId, workspace]);
              for (const row of jobs) console.log('TARGET_JOB=' + JSON.stringify({ id: row.id, status: row.status, tentativas: row.tentativas, motivo_final: row.motivo_final, oferta_id: row.oferta_id, linkAfiliadoPresent: Boolean(row.link_afiliado), metadataWorkspaceMatches: metadataWorkspaceMatches(row.metadata) }));
              await c.query('COMMIT');
              console.log('TARGET_DB_READONLY=PASS');
            } catch (e) { try { await c.query('ROLLBACK'); } catch {} console.log('TARGET_DB_READONLY=FAILED reason=' + String(e.message).replace(/[^a-zA-Z0-9_. -]/g,' ').slice(0,180)); }
            finally { c.release(); await pool.end(); }
          })().catch(e => console.log('TARGET_DB_READONLY=FAILED reason=' + String(e.message).replace(/[^a-zA-Z0-9_. -]/g,' ').slice(0,180)));
          NODE

      - name: Read-only Servmaq runtime routing
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          docker exec -i "$backend_id" env CLIENT_ID="$CLIENT_ID" TARGET_PROGRAM=5b31e3c6-9aaa-481c-b5f2-a47ec2b3f618 node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const jwt = require('jsonwebtoken');
          const clientId = process.env.CLIENT_ID;
          const programId = process.env.TARGET_PROGRAM;
          const hash = value => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 12) : '';
          const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
          const groupId = value => {
            if (value && typeof value === 'object') return String(value.id || value.jid || value.grupoId || value.groupId || value.remoteJid || '').trim();
            return String(value || '').trim();
          };
          const groupName = value => value && typeof value === 'object'
            ? String(value.nome || value.name || value.subject || value.titulo || '').trim()
            : '';
          const listGroups = value => Array.isArray(value) ? value : [];
          const global = readJson('/data/mensageiro.json') || {};
          const client = readJson(`/data/clientes/${clientId}/mensageiro-config.json`) || {};
          const sessionsMeta = readJson('/data/sessoes.json') || {};
          const cfg = global[clientId] && typeof global[clientId] === 'object' ? global[clientId] : {};
          const sessionId = String(cfg.sessaoId || cfg.sessaoWhatsappId || cfg.sessaoGruposId || '').trim();
          const profiles = Array.isArray(cfg.perfis) ? cfg.perfis : [];
          const profileById = new Map(profiles.map(p => [String(p?.id || ''), p]));
          const programs = Array.isArray(cfg.programacoes) ? cfg.programacoes : [];
          const program = programs.find(p => String(p?.id || '') === programId) || null;
          const profile = program?.perfilId ? profileById.get(String(program.perfilId)) : null;
          const gerente = profile?.modulos?.gerente || null;
          const gerenteConfig = gerente?.configuracao || {};
          const gerenteGroups = listGroups(gerente?.grupos);
          const profileGroups = listGroups(profile?.grupos);
          const programGroups = listGroups(program?.grupos || program?.gruposIds);
          const effectiveGerenteGroups = gerente?.gruposConfigurados === true ? gerenteGroups : profileGroups;
          const names = [...gerenteGroups, ...profileGroups, ...programGroups].map(groupName).filter(Boolean);
          const rules = Array.isArray(gerenteConfig.regras) ? gerenteConfig.regras : [];
          const activeRules = rules.filter(r => r && r.ativo === true);
          const wordRules = activeRules.filter(r => String(r.tipo || '').toLowerCase() === 'palavras_proibidas');
          const words = wordRules.flatMap(r => Array.isArray(r?.parametros?.palavras) ? r.parametros.palavras : []).map(v => String(v).toLowerCase());
          const sessaoMeta = sessionsMeta[sessionId] && typeof sessionsMeta[sessionId] === 'object' ? sessionsMeta[sessionId] : null;
          console.log('SERVMAQ_PERSISTED_ROUTING=' + JSON.stringify({
            sessionHash: hash(sessionId),
            programFound: Boolean(program),
            programPerfilIdPresent: Boolean(program?.perfilId),
            profileFound: Boolean(profile),
            profileActive: profile?.ativo === true,
            gerenteActive: gerente?.ativo === true,
            gerenteOwnGroups: gerente?.gruposConfigurados === true,
            gerenteGroupHashes: effectiveGerenteGroups.map(groupId).filter(Boolean).slice(0, 20).map(hash),
            gerenteGroupsNamedServmaq: effectiveGerenteGroups.some(g => /servmaq/i.test(groupName(g))),
            programGroupHashes: programGroups.map(groupId).filter(Boolean).slice(0, 20).map(hash),
            programGroupsNamedServmaq: programGroups.some(g => /servmaq/i.test(groupName(g))),
            persistedSessionStatus: sessaoMeta?.status || '',
            persistedSessionWorkspace: Boolean(sessaoMeta?.workspaceId || sessaoMeta?.clienteId),
            activeRules: activeRules.length,
            blockedTestWord: words.includes('teste'),
            blockedBolsonaroWord: words.includes('bolsonaro'),
            isentarAdmins: gerenteConfig.isentarAdmins !== false,
            isentarDono: gerenteConfig.isentarDono !== false,
            authorizedCount: Array.isArray(gerenteConfig.autorizados) ? gerenteConfig.autorizados.length : 0,
            moderatorCount: Array.isArray(gerenteConfig.moderadores) ? gerenteConfig.moderadores.length : 0
          }));

          (async () => {
            const secret = process.env.JWT_SECRET || 'segredo';
            const token = jwt.sign({ clienteId: clientId }, secret, { expiresIn: '30s' });
            const response = await fetch('http://127.0.0.1:3000/sessoes', { headers: { authorization: `Bearer ${token}` } });
            const body = await response.json().catch(() => ({}));
            const rows = Array.isArray(body?.sessoes) ? body.sessoes : [];
            const match = rows.find(row => String(row?.id || row?.sessaoId || '') === sessionId);
            console.log('SERVMAQ_RUNTIME_SESSION=' + JSON.stringify({
              httpStatus: response.status,
              sessionFound: Boolean(match),
              sessionHash: hash(match?.id || match?.sessaoId || sessionId),
              status: match?.status || 'not_found',
              conectado: match?.conectado === true,
              grupos: Number(match?.grupos || match?.totalGrupos || 0),
              qrDisponivel: match?.qrDisponivel === true
            }));
          })().catch(error => console.log('SERVMAQ_RUNTIME_SESSION=FAILED reason=' + String(error.message).replace(/[^a-zA-Z0-9_. -]/g, ' ').slice(0, 120)));
          NODE

      - name: Reconcile all active Servmaq manager profiles read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          test -n "$backend_id"
          docker exec -i "$backend_id" env CLIENT_ID="$CLIENT_ID" TARGET_PROGRAM=5b31e3c6-9aaa-481c-b5f2-a47ec2b3f618 node - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const crypto = require('crypto');
          const jwt = require('jsonwebtoken');
          const clientId = process.env.CLIENT_ID;
          const programId = process.env.TARGET_PROGRAM;
          const hash = value => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 12) : '';
          const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
          const idOf = value => {
            if (value && typeof value === 'object') return String(value.id || value.jid || value.grupoId || value.groupId || value.remoteJid || '').trim();
            return String(value || '').trim();
          };
          const nameOf = value => value && typeof value === 'object'
            ? String(value.nome || value.name || value.subject || value.titulo || '').trim()
            : '';
          const sessionOf = value => String(value?.sessaoId || value?.sessaoWhatsappId || value?.sessaoGruposId || '').trim();
          const list = value => Array.isArray(value) ? value : [];
          const activeProfile = profile => profile && profile.removido !== true && profile.removed !== true && profile.excluido !== true && profile.ativo !== false;
          const cfg = (readJson('/data/mensageiro.json') || {})[clientId] || {};
          const programs = list(cfg.programacoes);
          const program = programs.find(item => String(item?.id || '') === programId) || null;
          const defaultSession = sessionOf(cfg);
          const profiles = list(cfg.perfis).filter(activeProfile);
          const managerProfiles = profiles.filter(profile => profile?.modulos?.gerente?.ativo === true);
          const sessionIds = [...new Set([defaultSession, ...managerProfiles.map(sessionOf), ...[program].filter(Boolean).map(sessionOf)].filter(Boolean))];
          const profileRows = managerProfiles.map(profile => {
            const gerente = profile?.modulos?.gerente || {};
            const ownGroups = list(gerente.grupos);
            const inheritedGroups = list(profile.grupos);
            const effectiveGroups = gerente.gruposConfigurados === true ? ownGroups : inheritedGroups;
            const configuracao = gerente.configuracao || {};
            const rules = list(configuracao.regras).filter(rule => rule?.ativo === true);
            const words = rules
              .filter(rule => String(rule?.tipo || '').toLowerCase() === 'palavras_proibidas')
              .flatMap(rule => list(rule?.parametros?.palavras || rule?.parametros?.termos || rule?.palavras || rule?.termos))
              .map(word => String(word).trim().toLowerCase())
              .filter(Boolean);
            return {
              profileHash: hash(profile.id),
              profileNamePresent: Boolean(profile.nome),
              sessionHash: hash(sessionOf(profile) || defaultSession),
              sessionOwn: Boolean(sessionOf(profile)),
              active: profile.ativo !== false,
              gerenteGroupsConfigured: gerente.gruposConfigurados === true,
              effectiveGroupHashes: effectiveGroups.map(idOf).filter(Boolean).slice(0, 30).map(hash),
              effectiveGroupCount: effectiveGroups.map(idOf).filter(Boolean).length,
              rulesActive: rules.length,
              testWordActive: words.includes('teste'),
              bolsonaroWordActive: words.includes('bolsonaro'),
              actions: [...new Set(rules.map(rule => String(rule?.acao || '').trim()).filter(Boolean))].slice(0, 10),
              isentarAdmins: configuracao.isentarAdmins !== false,
              isentarDono: configuracao.isentarDono !== false,
              authorizedCount: list(configuracao.autorizados).length,
              moderatorCount: list(configuracao.moderadores).length
            };
          });
          const programGroups = list(program?.grupos || program?.gruposIds).map(idOf).filter(Boolean);
          const programSession = sessionOf(program) || defaultSession;
          const secret = process.env.JWT_SECRET || 'segredo';
          const token = jwt.sign({ clienteId: clientId }, secret, { expiresIn: '30s' });
          const getJson = async path => {
            const response = await fetch(`http://127.0.0.1:3000${path}`, { headers: { authorization: `Bearer ${token}` } });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, body };
          };
          (async () => {
            const sessionsResponse = await getJson('/sessoes');
            const sessionRows = list(sessionsResponse.body?.sessoes);
            const runtimeRows = sessionIds.map(id => {
              const row = sessionRows.find(item => String(item?.id || item?.sessaoId || '') === id);
              return { id, row };
            });
            const openRuntime = runtimeRows.filter(item => item.row?.status === 'open' || item.row?.conectado === true);
            const groupCatalogs = [];
            for (const item of openRuntime.slice(0, 10)) {
              const result = await getJson(`/grupos/${encodeURIComponent(item.id)}`);
              const groups = list(result.body?.grupos || result.body?.gruposLista);
              groupCatalogs.push({
                sessionId: item.id,
                httpStatus: result.status,
                groups: groups.map(group => ({ id: idOf(group), name: nameOf(group) })).filter(group => group.id)
              });
            }
            const catalogFor = id => groupCatalogs.find(item => item.sessionId === id)?.groups || [];
            const actualProgramGroups = catalogFor(programSession);
            const actualProgramIds = new Set(actualProgramGroups.map(group => group.id));
            const programMatches = programGroups.filter(id => actualProgramIds.has(id));
            const servmaqNames = actualProgramGroups.map(group => group.name).filter(name => /servmaq/i.test(name)).slice(0, 5);
            const managerRows = profileRows.map(row => {
              const profile = managerProfiles.find(item => hash(item.id) === row.profileHash);
              const manager = profile?.modulos?.gerente || {};
              const effective = manager.gruposConfigurados === true ? list(manager.grupos) : list(profile?.grupos);
              const sessionId = sessionOf(profile) || defaultSession;
              const actual = catalogFor(sessionId);
              const actualIds = new Set(actual.map(group => group.id));
              const ids = effective.map(idOf).filter(Boolean);
              const matching = ids.filter(id => actualIds.has(id));
              return { ...row, groupMatches: matching.length, actualGroupCount: actual.length, servmaqNames: actual.map(group => group.name).filter(name => /servmaq/i.test(name)).slice(0, 5) };
            });
            const sessionRow = runtimeRows.find(item => item.id === (programSession || defaultSession));
            const senderCriteria = managerRows.map(row => ({ profileHash: row.profileHash, fromMeIgnoredByCode: true, isentarAdmins: row.isentarAdmins, isentarDono: row.isentarDono, authorizedCount: row.authorizedCount, moderatorCount: row.moderatorCount }));
            console.log('SESSION_OPEN=' + JSON.stringify({
              httpStatus: sessionsResponse.status,
              sessionHash: hash(programSession || defaultSession),
              status: sessionRow?.row?.status || 'not_found',
              conectado: sessionRow?.row?.conectado === true,
              grupos: Number(sessionRow?.row?.grupos || sessionRow?.row?.totalGrupos || 0),
              qrDisponivel: sessionRow?.row?.qrDisponivel === true
            }));
            console.log('ACTIVE_MANAGER_PROFILES=' + JSON.stringify({ count: managerRows.length, profiles: managerRows }));
            console.log('MANAGER_RULES=' + JSON.stringify({ profiles: managerRows.map(row => ({ profileHash: row.profileHash, rulesActive: row.rulesActive, actions: row.actions })) }));
            console.log('TEST_WORD_ACTIVE=' + managerRows.some(row => row.testWordActive));
            console.log('BOLSONARO_WORD_ACTIVE=' + managerRows.some(row => row.bolsonaroWordActive));
            console.log('MANAGER_GROUPS=' + JSON.stringify({ profiles: managerRows.map(row => ({ profileHash: row.profileHash, sessionHash: row.sessionHash, groupMatches: row.groupMatches, actualGroupCount: row.actualGroupCount, servmaqNames: row.servmaqNames })) }));
            console.log('PROGRAM_GROUP_NAME=' + JSON.stringify({ sessionHash: hash(programSession), configuredGroupCount: programGroups.length, matchedGroupCount: programMatches.length, servmaqNames }));
            console.log('GROUP_MATCH=' + JSON.stringify({ program: programGroups.length > 0 && programMatches.length === programGroups.length, managers: managerRows.map(row => ({ profileHash: row.profileHash, allGroupsInSession: row.effectiveGroupCount > 0 && row.groupMatches === row.effectiveGroupCount })) }));
            console.log('POSSIBLE_EXEMPTION=' + JSON.stringify({ senderProvided: false, criteria: senderCriteria }));
          })().catch(error => console.log('SERVMAQ_MANAGER_RECONCILIATION=FAILED reason=' + String(error.message).replace(/[^a-zA-Z0-9_. -]/g, ' ').slice(0, 160)));
          NODE

      - name: Read-only targeted Servmaq event evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          test -n "$backend_id"
          docker exec -i "$backend_id" env CLIENT_ID="$CLIENT_ID" WINDOW_START="$SERVMAQ_WINDOW_START" WINDOW_END="$SERVMAQ_WINDOW_END" node - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const crypto = require('crypto');
          const clientId = process.env.CLIENT_ID;
          const start = Date.parse(process.env.WINDOW_START);
          const end = Date.parse(process.env.WINDOW_END);
          const hash = value => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 12) : '';
          const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
          const inWindow = value => {
            const ts = Date.parse(String(value || ''));
            return Number.isFinite(ts) && ts >= start && ts <= end;
          };
          const timestampOf = value => value?.timestamp || value?.data || value?.executadoEm || value?.criadoEm || value?.createdAt || value?.created_at || '';
          const safeCode = value => String(value || '').replace(/[^a-z0-9_:-]/gi, '_').slice(0, 80);
          const operational = readJson(`/data/clientes/${clientId}/mensageiro-gerente-operacional.json`);
          const operationalRows = Array.isArray(operational?.motivos) ? operational.motivos : [];
          const operationalWindow = operationalRows.filter(row => inWindow(timestampOf(row)));
          console.log('SERVMAQ_OPERATIONAL_WINDOW_COUNT=' + operationalWindow.length);
          console.log('SERVMAQ_OPERATIONAL_CODES=' + JSON.stringify([...new Set(operationalWindow.map(row => safeCode(row?.codigo)).filter(Boolean))]));
          console.log('SERVMAQ_OPERATIONAL_EVENTS=' + JSON.stringify(operationalWindow.slice(0, 30).map(row => ({
            timestamp: String(timestampOf(row)),
            code: safeCode(row?.codigo),
            profilePresent: Boolean(row?.perfilId),
            sessionHash: hash(row?.sessaoId),
            groupHash: hash(row?.grupoId)
          }))));
          const infra = readJson(`/data/clientes/${clientId}/mensageiro-gerente-infracoes.json`);
          const infraRows = Array.isArray(infra?.infracoes) ? infra.infracoes : [];
          const infraWindow = infraRows.filter(row => inWindow(timestampOf(row)));
          console.log('SERVMAQ_INFRACTION_WINDOW_COUNT=' + infraWindow.length);
          console.log('SERVMAQ_INFRACTION_RESULTS=' + JSON.stringify([...new Set(infraWindow.map(row => safeCode(row?.resultado || row?.status)).filter(Boolean))]));
          const cfg = readJson(`/data/clientes/${clientId}/mensageiro-config.json`);
          const histories = [cfg?.atendimento?.historico, cfg?.historico, cfg?.historicoGerente].filter(Array.isArray).flat();
          const historyWindow = histories.filter(row => inWindow(timestampOf(row)) && (/moderacao|gerente/i.test(String(row?.tipo || row?.origem || row?.modulo || '')) || row?.resultado || row?.status));
          console.log('SERVMAQ_HISTORY_WINDOW_COUNT=' + historyWindow.length);
          console.log('SERVMAQ_HISTORY_RESULTS=' + JSON.stringify([...new Set(historyWindow.map(row => safeCode(row?.resultado || row?.status || row?.codigo)).filter(Boolean))]));
          const eventEvidence = operationalWindow.length || infraWindow.length || historyWindow.length;
          let blocker = eventEvidence ? 'SEE_PERSISTED_RESULTS' : 'NO_PERSISTED_EVENT_EVIDENCE';
          if (operationalWindow.some(row => ['from_me','isento_admin','isento_dono','isento_autorizado','isento_moderador'].includes(String(row?.codigo)))) blocker = 'EVENT_IGNORED_BY_GATE';
          else if (operationalWindow.some(row => ['participante_nao_resolvido','key_incompleta','perfil_nao_resolvido','gerente_inativo','sem_regras_ativas','sem_violacao','bot_sem_admin','metadata_indisponivel'].includes(String(row?.codigo)))) blocker = 'GERENTE_GATE_RECORDED';
          else if (operationalWindow.some(row => String(row?.codigo) === 'delete_falhou')) blocker = 'DELETE_FAILED_RECORDED';
          else if (operationalWindow.some(row => String(row?.codigo) === 'delete_ok')) blocker = 'DELETE_SUCCEEDED_RECORDED';
          console.log('SERVMAQ_FIRST_PROVEN_BLOCKER=' + blocker);
          console.log('SERVMAQ_SENDER_IDENTITY_OBSERVED=false');
          console.log('SERVMAQ_FROM_ME_OBSERVED=false');
          NODE

      - name: Read-only HTTP smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --output /dev/null --write-out 'public_http=%{http_code} latency_s=%{time_total}\n' https://go.optimuspromo.com.br/
