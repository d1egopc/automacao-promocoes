name: Servmaq trace scope check (read-only)

on:
  push:
    branches:
      - servmaq-trace-scope-check-20261015

permissions:
  contents: read

concurrency:
  group: servmaq-trace-scope-check
  cancel-in-progress: false

jobs:
  scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/servmaq-trace-scope-check-20261015'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      COMPOSE_FILE: /opt/optimus/infra/compose.yml
      BACKEND_DIR: /opt/optimus/backend
      DATA_DIR: /opt/optimus/data
      EXPECTED_SHA: ac3a0f65518d93574f5035f295635f4009c1b199
    steps:
      - name: Checkout workflow only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Exact Servmaq scope read-only check
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/servmaq-trace-scope-check-20261015
          test "$GITHUB_WORKSPACE" != "$BACKEND_DIR"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$files" = '.github/workflows/servmaq-trace-scope-check.yml'
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          postgres_id="$(docker compose -f "$COMPOSE_FILE" ps -q postgres)"
          test -n "$backend_id" && test -n "$postgres_id"
          backend_state="$(docker inspect --format '{{.State.Status}}|{{.RestartCount}}|{{.State.OOMKilled}}' "$backend_id")"
          postgres_state="$(docker inspect --format '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.RestartCount}}|{{.State.OOMKilled}}' "$postgres_id")"
          [[ "$backend_state" == running\|0\|false ]] && [[ "$postgres_state" == running\|healthy\|0\|false ]]
          test "$(git -C "$BACKEND_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          docker exec -i "$backend_id" node - <<'NODE' > "$tmpdir/scope" 2>/dev/null
          const fs = require('fs');
          const jwt = require('jsonwebtoken');
          const clientId = 'user_k3phmbkf';
          const read = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
          const list = value => Array.isArray(value) ? value : [];
          const idOf = value => value && typeof value === 'object' ? String(value.id || value.jid || value.grupoId || value.groupId || value.remoteJid || '').trim() : String(value || '').trim();
          const sessionOf = value => String(value?.sessaoId || value?.sessaoWhatsappId || value?.sessaoGruposId || '').trim();
          const active = value => value && value.removido !== true && value.removed !== true && value.excluido !== true && value.ativo !== false;
          const cfg = (read('/data/mensageiro.json') || {})[clientId] || {};
          const profiles = list(cfg.perfis).filter(active);
          const managers = profiles.filter(profile => profile?.modulos?.gerente?.ativo === true);
          const programs = list(cfg.programacoes);
          const program = programs.find(item => /bom\s*dia/i.test(String(item?.nome || '')) || String(item?.horario || '') === '07:00');
          const defaultSession = sessionOf(cfg);
          const programSession = sessionOf(program) || defaultSession;
          const programGroups = list(program?.grupos || program?.gruposIds).map(idOf).filter(Boolean);
          const token = jwt.sign({ clienteId: clientId }, process.env.JWT_SECRET || 'segredo', { expiresIn: '30s' });
          const getJson = async path => { const response = await fetch('http://127.0.0.1:3000' + path, { headers: { authorization: 'Bearer ' + token } }); return { status: response.status, body: await response.json().catch(() => ({})) }; };
          const unique = values => [...new Set(values)];
          (async () => {
            if (!program || !programSession || !programGroups.length || !managers.length) throw new Error('scope_config_incomplete');
            const sessionsResponse = await getJson('/sessoes');
            const sessionRows = list(sessionsResponse.body?.sessoes);
            const programRuntime = sessionRows.find(row => String(row?.id || row?.sessaoId || '') === programSession);
            if (!programRuntime || !(programRuntime.status === 'open' || programRuntime.conectado === true)) throw new Error('program_session_not_open');
            const sessionIds = unique([programSession, ...managers.map(sessionOf).filter(Boolean)]);
            const catalogs = new Map();
            for (const sessionId of sessionIds) {
              const result = await getJson('/grupos/' + encodeURIComponent(sessionId));
              if (result.status < 200 || result.status >= 300) throw new Error('group_catalog_unavailable');
              const groups = list(result.body?.grupos || result.body?.gruposLista);
              const ids = unique(groups.map(idOf).filter(Boolean));
              if (!ids.length) throw new Error('group_catalog_empty');
              catalogs.set(sessionId, new Set(ids));
            }
            const pairs = [];
            for (const profile of managers) {
              const managerSession = sessionOf(profile) || defaultSession;
              if (!managerSession || managerSession !== programSession) continue;
              const manager = profile.modulos.gerente;
              const effectiveGroups = manager.gruposConfigurados === true ? list(manager.grupos) : list(profile.grupos);
              const managerIds = unique(effectiveGroups.map(idOf).filter(Boolean));
              const catalog = catalogs.get(managerSession);
              const managerMatches = managerIds.filter(id => catalog?.has(id));
              const programMatches = unique(programGroups.filter(id => catalog?.has(id)));
              const common = programMatches.filter(id => managerMatches.includes(id));
              if (managerMatches.length === 1 && programMatches.length === 1 && common.length === 1) pairs.push({ sessionId: managerSession, groupId: common[0] });
            }
            const distinct = unique(pairs.map(pair => pair.sessionId + '\u0000' + pair.groupId));
            if (distinct.length !== 1) throw new Error('scope_not_unique');
            process.stdout.write('scope_ok\n');
          })().catch(() => process.exit(3));
          NODE
          grep -q '^scope_ok$' "$tmpdir/scope"
          printf 'SCOPE_MATCH=YES\nCATALOG_MATCH=EXACT_UNIQUE\nSESSION_RUNTIME=OPEN\nTRACE_NOT_MODIFIED=YES\nPRODUCTION_UNCHANGED=YES\n' >> "$GITHUB_STEP_SUMMARY"
