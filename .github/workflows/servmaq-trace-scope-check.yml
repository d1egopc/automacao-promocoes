name: Servmaq trace scope check (read-only)

on:
  push:
    branches:
      - servmaq-trace-scope-check-20261015

permissions:
  contents: read

concurrency:
  group: servmaq-trace-scope-check
  cancel-in-progress: false

jobs:
  scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/servmaq-trace-scope-check-20261015'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      COMPOSE_FILE: /opt/optimus/infra/compose.yml
      BACKEND_DIR: /opt/optimus/backend
      EXPECTED_SHA: ac3a0f65518d93574f5035f295635f4009c1b199
    steps:
      - name: Checkout workflow only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Exact-id scope read-only diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/servmaq-trace-scope-check-20261015
          test "$GITHUB_WORKSPACE" != "$BACKEND_DIR"
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$files" = '.github/workflows/servmaq-trace-scope-check.yml'
          backend_id="$(docker compose -f "$COMPOSE_FILE" ps -q backend)"
          postgres_id="$(docker compose -f "$COMPOSE_FILE" ps -q postgres)"
          test -n "$backend_id" && test -n "$postgres_id"
          backend_state="$(docker inspect --format '{{.State.Status}}|{{.RestartCount}}|{{.State.OOMKilled}}' "$backend_id")"
          postgres_state="$(docker inspect --format '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.RestartCount}}|{{.State.OOMKilled}}' "$postgres_id")"
          printf 'BACKEND=%s POSTGRES=%s\n' "$backend_state" "$postgres_state" >> "$GITHUB_STEP_SUMMARY"
          [[ "$backend_state" == running\|0\|false ]] && [[ "$postgres_state" == running\|healthy\|0\|false ]]
          test "$(git -C "$BACKEND_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"
          docker exec -i "$backend_id" node - <<'NODE' >> "$GITHUB_STEP_SUMMARY" 2>&1
          const fs=require('fs');
          const jwt=require('jsonwebtoken');
          const clientId='user_k3phmbkf';
          const read=f=>{try{return JSON.parse(fs.readFileSync(f,'utf8'));}catch{return null;}};
          const arr=v=>Array.isArray(v)?v:[];
          const id=v=>v&&typeof v==='object'?String(v.id||v.jid||v.grupoId||v.groupId||v.remoteJid||'').trim():String(v||'').trim();
          const session=v=>String(v?.sessaoId||v?.sessaoWhatsappId||v?.sessaoGruposId||'').trim();
          const active=v=>v&&v.removido!==true&&v.removed!==true&&v.excluido!==true&&v.ativo!==false;
          const cfg=(read('/data/mensageiro.json')||{})[clientId]||{};
          const profiles=arr(cfg.perfis).filter(active);
          const managers=profiles.filter(p=>p?.modulos?.gerente?.ativo===true);
          const program=arr(cfg.programacoes).find(p=>/bom\s*dia/i.test(String(p?.nome||''))||String(p?.horario||'')==='07:00');
          const manager=managers[0];
          const mgr=manager?.modulos?.gerente||{};
          const eff= mgr.gruposConfigurados===true?arr(mgr.grupos):arr(manager?.grupos);
          const programRefs=arr(program?.grupos||program?.gruposIds||program?.config?.grupos||program?.config?.gruposIds);
          const programSession=session(program)||session(cfg);
          const managerSession=session(manager)||session(cfg);
          const token=jwt.sign({clienteId:clientId},process.env.JWT_SECRET||'segredo',{expiresIn:'30s'});
          const get=async path=>{const r=await fetch('http://127.0.0.1:3000'+path,{headers:{authorization:'Bearer '+token}});return {status:r.status,body:await r.json().catch(()=>({}))};};
          console.log('CONFIG_FOUND='+Boolean(cfg&&Object.keys(cfg).length));
          console.log('ACTIVE_MANAGER_PROFILES='+managers.length);
          console.log('PROGRAM_FOUND='+Boolean(program));
          console.log('PROGRAM_GROUP_REF_COUNT='+programRefs.map(id).filter(Boolean).length);
          console.log('MANAGER_GROUP_REF_COUNT='+eff.map(id).filter(Boolean).length);
          console.log('SESSION_FIELDS_PRESENT='+Boolean(programSession&&managerSession));
          console.log('SESSION_ID_MATCH='+Boolean(programSession&&managerSession&&programSession===managerSession));
          console.log('PROGRAM_KEYS='+Object.keys(program||{}).sort().join(','));
          console.log('MANAGER_KEYS='+Object.keys(mgr||{}).sort().join(','));
          (async()=>{
            const s=await get('/sessoes');
            const rows=arr(s.body?.sessoes||s.body?.data||s.body);
            const sr=rows.find(x=>String(x?.id||x?.sessaoId||'')===programSession);
            console.log('SESSION_HTTP_STATUS='+s.status);
            console.log('SESSION_ROWS='+rows.length);
            console.log('SESSION_RUNTIME_OPEN='+Boolean(sr&&(sr.status==='open'||sr.conectado===true)));
            if(!programSession){console.log('CATALOG_HTTP_STATUS=SKIP'); console.log('CATALOG_MATCH_COUNT=0'); console.log('SCOPE_MATCH=NO'); return;}
            const c=await get('/grupos/'+encodeURIComponent(programSession));
            const gs=arr(c.body?.grupos||c.body?.gruposLista||c.body?.data||c.body);
            const cat=new Set(gs.map(id).filter(Boolean));
            const pm=[...new Set(programRefs.map(id).filter(Boolean).filter(x=>cat.has(x)))];
            const mm=[...new Set(eff.map(id).filter(Boolean).filter(x=>cat.has(x)))];
            const common=pm.filter(x=>mm.includes(x));
            console.log('CATALOG_HTTP_STATUS='+c.status);
            console.log('CATALOG_COUNT='+cat.size);
            console.log('PROGRAM_CATALOG_MATCH_COUNT='+pm.length);
            console.log('MANAGER_CATALOG_MATCH_COUNT='+mm.length);
            console.log('CATALOG_MATCH_COUNT='+common.length);
            console.log('SCOPE_MATCH='+(Boolean(sr&&(sr.status==='open'||sr.conectado===true))&&programSession===managerSession&&pm.length===1&&mm.length===1&&common.length===1?'YES':'NO'));
          })().catch(e=>{console.log('DIAGNOSTIC_ERROR='+String(e?.code||e?.name||'unknown'));process.exitCode=0;});
          NODE
