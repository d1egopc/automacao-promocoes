          git merge-base --is-ancestor "$PRE_EXECUTOR_SYNC_READINESS_SHA" HEAD
          git merge-base --is-ancestor "$EXECUTOR_SYNC_READINESS_SHA" HEAD
          expected=$(printf '%s\n' \
            modules/fila/fila-operacional-v2.js \
            modules/fila/persistence-coordinator.js \
            modules/fila/terminal-index-shadow.js \
            tests/terminal-index-v1-1-1-self-healing.test.js \
            tests/terminal-index-v1-1-delta.test.js | sort)
          actual=$(git diff --name-only "$BASE_SHA...$FUNCTIONAL_SHA" | sort)
          test "$actual" = "$expected"
          fence_expected=$(printf '%s\n' \
            index.js \
            modules/fila/terminal-index-authority-fence.js \
            tests/terminal-index-authority-fence-v2.test.js | sort)
          fence_actual=$(git diff --name-only "$PRE_FENCE_SHA..$FENCE_SHA" | sort)
          test "$fence_actual" = "$fence_expected"
          authority_expected=$(printf '%s\n' \
            modules/fila/fila-operacional-v2.js \
            modules/fila/terminal-index-authority.js \
            tests/terminal-index-authority-v1.test.js | sort)
          authority_actual=$(git diff --name-only "$PRE_AUTHORITY_SHA..$AUTHORITY_SHA" | sort)
          test "$authority_actual" = "$authority_expected"
          authority_ci_expected=".github/workflows/terminal-index-v1-1-1-validation.yml"
          authority_ci_actual=$(git diff --name-only "$AUTHORITY_SHA..$PRE_OFC_VIVA_SHA" | sort)
          test "$authority_ci_actual" = "$authority_ci_expected"
          ofc_viva_expected=$(printf '%s\n' \
            modules/engine/ofc/absorption-gate.service.js \
            modules/engine/ofc/viva-snapshot.js \
            modules/engine/ofc/workspace-worker.js \
            modules/engine/ofc/workspace-worker-client.js \
            tests/ofc-snapshot-viva-v1.test.js | sort)
          ofc_viva_actual=$(git diff --name-only "$PRE_OFC_VIVA_SHA..$OFC_VIVA_SHA" | sort)
          test "$ofc_viva_actual" = "$ofc_viva_expected"
          infra_cleanup_expected=$(printf '%s\n' \
