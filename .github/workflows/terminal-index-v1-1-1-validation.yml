          ofc_viva_ci_actual=$(git diff --name-only "$OFC_VIVA_SHA..$PRE_INFRA_CLEANUP_SHA" | sort)
          test "$ofc_viva_ci_actual" = "$ofc_viva_ci_expected"
          ci_only_expected=".github/workflows/terminal-index-v1-1-1-validation.yml"
          worker_obs_ci_actual=$(git diff --name-only "$INFRA_CLEANUP_SHA..$PRE_WORKER_OBS_SHA" | sort)
          test "$worker_obs_ci_actual" = "$ci_only_expected"
          distributor_compact_ci_previous=$(git diff --name-only "$WORKER_OBS_SHA..$PRE_DISTRIBUTOR_COMPACT_SHA" | sort)
          test "$distributor_compact_ci_previous" = "$ci_only_expected"
          distributor_compact_ci_actual=$(git diff --name-only "$DISTRIBUTOR_COMPACT_SHA..$PRE_DISTRIBUTOR_COMPACT_OBS_SHA" | sort)
          test "$distributor_compact_ci_actual" = "$ci_only_expected"
