      - name: Distributor known regression current / baseline comparison
        shell: bash
        env:
          DISTRIBUTOR_BASELINE_SHA: 69112d395dd7c94dd54a7c4f2cfa0e6546c0e2ae
        run: |
          set -euo pipefail
          current_log="$RUNNER_TEMP/distributor-phase-c-current.log"
          baseline_log="$RUNNER_TEMP/distributor-phase-c-baseline.log"
          baseline="$RUNNER_TEMP/distributor-phase-c-baseline"
          cleanup() {
            git worktree remove --force "$baseline" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if node tests/distributor-definitivo-fase-c.test.js >"$current_log" 2>&1; then
            current_status=0
          else
            current_status=$?
          fi
          tail -n 12 "$current_log"

          git worktree add --detach "$baseline" "$DISTRIBUTOR_BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          if (cd "$baseline" && node tests/distributor-definitivo-fase-c.test.js) >"$baseline_log" 2>&1; then
            baseline_status=0
          else
            baseline_status=$?
          fi
          tail -n 12 "$baseline_log"

          signature() {
            python3 - "$1" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          out = []
          for i, line in enumerate(lines):
              if re.search(r"AssertionError|TypeError|ReferenceError|SyntaxError|Error \[|^Error:", line):
                  out.append(line.strip())
                  for following in lines[i + 1:i + 9]:
                      if re.match(r"\s*at\s", following):
                          break
                      if following.strip():
                          out.append(following.strip())
                  break
          print(" | ".join(out))
          PY
          }

          if [ "$current_status" -eq 0 ] && [ "$baseline_status" -eq 0 ]; then
            echo "CURRENT and BASELINE passed."
          elif [ "$current_status" -eq 0 ] && [ "$baseline_status" -ne 0 ]; then
            echo "CURRENT passed while BASELINE failed; accepted."
          elif [ "$current_status" -ne 0 ] && [ "$baseline_status" -ne 0 ]; then
            current_signature=$(signature "$current_log")
            baseline_signature=$(signature "$baseline_log")
            if [ -n "$current_signature" ] && [ "$current_signature" = "$baseline_signature" ]; then
              echo "BASELINE FAILURE (same signature): tests/distributor-definitivo-fase-c.test.js"
              echo "$current_signature"
            else
              echo "NEW/DIFFERENT FAILURE: tests/distributor-definitivo-fase-c.test.js"
              echo "current:  $current_signature"
              echo "baseline: $baseline_signature"
              exit 1
            fi
          else
            echo "REGRESSION: CURRENT fails but BASELINE passes."
            exit 1
          fi

