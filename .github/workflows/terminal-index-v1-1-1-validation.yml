name: Terminal Index V1.1.1 Linux validation

on:
  push:
    branches:
      - feature/terminal-index-v1-1-1-delta-self-healing

permissions:
  contents: read

concurrency:
  group: terminal-index-v1-1-1-validation
  cancel-in-progress: false

jobs:
  linux-node24:
    name: Linux / Node 24 / npm ci / self-healing gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove branch, functional ancestry, scope, and base diff
        shell: bash
        env:
          BASE_SHA: e2e71311ec635d7f2897e7303efd2c0bf8a2d388
          FUNCTIONAL_SHA: 358a20ae7a1cb6bcd53ce2e9f163c00ca6287b1a
          PRE_FENCE_SHA: 65ae94181cc444a9e0bb9fa5a99666edf85c0248
          FENCE_SHA: b24c14e2255805532a8d3fdf960af84ff5431f3f
          PRE_AUTHORITY_SHA: a75fdb7e0b8647e4ec33e5bf69f2a97f22bd8e0b
          AUTHORITY_SHA: a575eae893f421b7dd4da67f27a9547739b2ccdf
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-1-delta-self-healing
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version | cut -c1-3)" = "v24"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$FUNCTIONAL_SHA^{commit}"
          git cat-file -e "$PRE_FENCE_SHA^{commit}"
          git cat-file -e "$FENCE_SHA^{commit}"
          git cat-file -e "$PRE_AUTHORITY_SHA^{commit}"
          git cat-file -e "$AUTHORITY_SHA^{commit}"
          test "$(git rev-parse "$FUNCTIONAL_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$FENCE_SHA^")" = "$PRE_FENCE_SHA"
          test "$(git rev-parse "$AUTHORITY_SHA^")" = "$PRE_AUTHORITY_SHA"
          git merge-base --is-ancestor "$FUNCTIONAL_SHA" HEAD
          git merge-base --is-ancestor "$PRE_FENCE_SHA" HEAD
          git merge-base --is-ancestor "$FENCE_SHA" HEAD
          git merge-base --is-ancestor "$PRE_AUTHORITY_SHA" HEAD
          git merge-base --is-ancestor "$AUTHORITY_SHA" HEAD
          expected=$(printf '%s\n' \
            modules/fila/fila-operacional-v2.js \
            modules/fila/persistence-coordinator.js \
            modules/fila/terminal-index-shadow.js \
            tests/terminal-index-v1-1-1-self-healing.test.js \
            tests/terminal-index-v1-1-delta.test.js | sort)
          actual=$(git diff --name-only "$BASE_SHA...$FUNCTIONAL_SHA" | sort)
          test "$actual" = "$expected"
          fence_expected=$(printf '%s\n' \
            index.js \
            modules/fila/terminal-index-authority-fence.js \
            tests/terminal-index-authority-fence-v2.test.js | sort)
          fence_actual=$(git diff --name-only "$PRE_FENCE_SHA..$FENCE_SHA" | sort)
          test "$fence_actual" = "$fence_expected"
          authority_expected=$(printf '%s\n' \
            modules/fila/fila-operacional-v2.js \
            modules/fila/terminal-index-authority.js \
            tests/terminal-index-authority-v1.test.js | sort)
          authority_actual=$(git diff --name-only "$PRE_AUTHORITY_SHA..$AUTHORITY_SHA" | sort)
          test "$authority_actual" = "$authority_expected"
          ci_only=$(git diff --name-only "$AUTHORITY_SHA..HEAD")
          test "$ci_only" = ".github/workflows/terminal-index-v1-1-1-validation.yml"
          git diff --check "$BASE_SHA...$FUNCTIONAL_SHA"
          git diff --check "$PRE_FENCE_SHA..$FENCE_SHA"
          git diff --check "$PRE_AUTHORITY_SHA..$AUTHORITY_SHA"
          git diff --check "$AUTHORITY_SHA..HEAD"
          echo "BASE=$BASE_SHA FUNCTIONAL=$FUNCTIONAL_SHA PRE_FENCE=$PRE_FENCE_SHA FENCE=$FENCE_SHA PRE_AUTHORITY=$PRE_AUTHORITY_SHA AUTHORITY=$AUTHORITY_SHA CI_HEAD=$(git rev-parse HEAD)"
          echo "Functional paths:"; printf '%s\n' "$actual"
          echo "Fence paths:"; printf '%s\n' "$fence_actual"
          echo "Authority paths:"; printf '%s\n' "$authority_actual"
          echo "CI-only paths:"; printf '%s\n' "$ci_only"

      - name: Clean Linux dependency installation
        run: npm ci

      - name: Syntax and encoding
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/fila/fila-operacional-v2.js
          node --check modules/fila/persistence-coordinator.js
          node --check modules/fila/terminal-index-shadow.js
          node --check modules/fila/terminal-index-authority.js
          node --check tests/terminal-index-v1-1-1-self-healing.test.js
          node --check tests/terminal-index-v1-1-delta.test.js
          node --check tests/terminal-index-authority-v1.test.js
          npm run audit:encoding

      - name: Fence V2 syntax and dedicated gate
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check modules/fila/terminal-index-authority-fence.js
          node --check tests/terminal-index-authority-fence-v2.test.js
          node tests/terminal-index-authority-fence-v2.test.js

      - name: Terminal Index Authority V1 Linux / Node 24 dedicated gate
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/fila/fila-operacional-v2.js
          node --check modules/fila/terminal-index-authority.js
          node --check tests/terminal-index-authority-v1.test.js
          TERMINAL_INDEX_AUTHORITY_REQUIRE_INTEGRATION=1 \
            node tests/terminal-index-authority-v1.test.js

      - name: Run current and nearby regression suites, comparing failures with base
        shell: bash
        env:
          BASE_SHA: e2e71311ec635d7f2897e7303efd2c0bf8a2d388
        run: |
          set -euo pipefail
          suites=(
            tests/terminal-index-v1-1-1-self-healing.test.js
            tests/terminal-index-v1-1-delta.test.js
            tests/terminal-index-v1-shadow.test.js
            tests/fila-viva-idempotencia-stale.test.js
            tests/fila-manifest-state-repository.test.js
            tests/fila-checkpoint-recovery.test.js
            tests/fila-checkpoint-entrega-integracao.test.js
            tests/fila-checkpoint-entrega-funcional.test.js
            tests/fila-checkpoints-entrega.repository.test.js
            tests/fila-viva-anti-starvation.test.js
            tests/fila-viva-selecao.test.js
            tests/fila-store-v2.test.js
            tests/fila-unica-distributor-executor.test.js
            tests/fila-read-model-publico-integracao.test.js
            tests/fila-historico-v2-leitura.test.js
            tests/fila-historico-leve-v2.test.js
            tests/fila-historico-leve-jsonl-reparo.test.js
            tests/fila-historico-compactacao.test.js
            tests/persistence-worker-phase1.test.js
            tests/persistence-worker-observability.test.js
            tests/persistence-worker-multiworkspace.test.js
            tests/persistence-worker-multiworkspace-representative.test.js
            tests/persistence-worker-multiworkspace-stress.test.js
            tests/persistence-worker-crash-matrix.test.js
            tests/demand-scheduler-v1.test.js
            tests/solenoide-v1.test.js
            tests/solenoide-radar-config.test.js
            tests/solenoide-importer-observability.test.js
            tests/engine-fanout-universal-v2.test.js
            tests/engine-distributor-origem-fairness.test.js
            tests/distributor-vivo-sem-starvation.test.js
            tests/ofc-workspace-worker.test.js
            tests/ofc-workspace-temporal.test.js
            tests/ofc-fase-1d-observabilidade.test.js
            tests/ofc-buffer-vivo-workspace-shadow.test.js
            tests/teleradar.test.js
            tests/teleradar-semantica-comercial.test.js
            tests/teleradar-operational-control.test.js
            tests/teleradar-control-plane.test.js
            tests/radar-whatsapp-capture-gate.test.js
          )
          mkdir -p "$RUNNER_TEMP/ti111-current"
          failures=()
          index=0
          for suite in "${suites[@]}"; do
            index=$((index + 1))
            log="$RUNNER_TEMP/ti111-current/$index.log"
            echo "=== CURRENT: $suite ==="
            if node "$suite" >"$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            tail -n 12 "$log"
            if [ "$status" -eq 0 ]; then
              echo "PASS $suite"
            else
              echo "FAIL $suite (exit $status)"
              failures+=("$index|$suite|$status")
            fi
          done

          if [ "${#failures[@]}" -eq 0 ]; then
            echo "All current suites passed."
            exit 0
          fi

          baseline="$RUNNER_TEMP/ti111-baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          new_failures=0
          for failure in "${failures[@]}"; do
            IFS='|' read -r index suite current_status <<< "$failure"
            current_log="$RUNNER_TEMP/ti111-current/$index.log"
            baseline_log="$RUNNER_TEMP/ti111-current/$index-baseline.log"
            echo "=== BASELINE: $suite ==="
            if (cd "$baseline" && node "$suite") >"$baseline_log" 2>&1; then
              baseline_status=0
            else
              baseline_status=$?
            fi
            tail -n 12 "$baseline_log"
            if [ "$baseline_status" -ne 0 ]; then
              current_signature=$(python3 - "$current_log" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          out = []
          for i, line in enumerate(lines):
              if re.search(r"AssertionError|TypeError|ReferenceError|SyntaxError|Error \[|^Error:", line):
                  out.append(line.strip())
                  for following in lines[i + 1:i + 9]:
                      if re.match(r"\s*at\s", following):
                          break
                      if following.strip():
                          out.append(following.strip())
                  break
          print(" | ".join(out))
          PY
          )
              baseline_signature=$(python3 - "$baseline_log" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          out = []
          for i, line in enumerate(lines):
              if re.search(r"AssertionError|TypeError|ReferenceError|SyntaxError|Error \[|^Error:", line):
                  out.append(line.strip())
                  for following in lines[i + 1:i + 9]:
                      if re.match(r"\s*at\s", following):
                          break
                      if following.strip():
                          out.append(following.strip())
                  break
          print(" | ".join(out))
          PY
          )
              if [ -n "$current_signature" ] && [ "$current_signature" = "$baseline_signature" ]; then
                echo "BASELINE FAILURE (same signature): $suite"
                echo "$current_signature"
              else
                echo "NEW/DIFFERENT FAILURE: $suite"
                echo "current:  $current_signature"
                echo "baseline: $baseline_signature"
                new_failures=$((new_failures + 1))
              fi
            else
              echo "REGRESSION: current fails but base passes: $suite"
              new_failures=$((new_failures + 1))
            fi
          done
          git worktree remove --force "$baseline"
          if [ "$new_failures" -ne 0 ]; then
            echo "$new_failures new or different failure(s)."
            exit 1
          fi
          echo "Only failures reproduced with the same assertion signature on base."

  terminal-index-auditor-synthetic:
    name: Synthetic independent auditor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Safety guard - branch and hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-1-delta-self-healing
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version | cut -c1-3)" = "v24"

      - name: Clean Linux dependency installation
        run: npm ci

      - name: Build and audit synthetic legacy plus incremental fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          "use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");
          const operacional = require("./modules/fila/fila-operacional-v2");
          const terminalIndex = require("./modules/fila/terminal-index-shadow");
          const { construirTerminalIndex } = require("./modules/fila/terminal-index-worker");

          const root = fs.mkdtempSync(path.join(os.tmpdir(), "terminal-index-auditor-"));
          const workspace = "workspace_synthetic_auditor";
          const dir = path.join(root, "clientes", workspace);
          const incrementalDir = path.join(dir, terminalIndex.TERMINAL_INDEX_INCREMENTAL_DIR);
          const legacyFile = path.join(dir, terminalIndex.TERMINAL_INDEX_LEGACY_FILE);
          const incrementalFile = path.join(incrementalDir, "2026-09-29.jsonl");
          const nowMs = Date.parse("2026-09-29T12:00:00.000Z");

          const legacy = [
            { id: "legacy-enviado", status: "enviado" },
            { id: "legacy-retida", status: "retida", motivoRetencao: "sem_destino" },
            { id: "legacy-expirado", status: "expirado" },
            { id: "duplicate-precedence", status: "retida", motivoRetencao: "sem_destino" },
            { id: "overlap-expirada", status: "retida", motivoRetencao: "sem_destino" },
            { id: "legacy-only", status: "enviado" },
            { id: "processado-excluded", status: "processado" }
          ];
          const incremental = [
            { id: "incremental-enviado", status: "enviado" },
            { id: "incremental-retida", status: "retida", motivoRetencao: "sem_destino" },
            { id: "duplicate-precedence", status: "enviado" },
            { id: "overlap-expirada", status: "expirada" },
            { id: "incremental-only", status: "expirado" },
            { id: "incremental-processado-excluded", status: "processado" }
          ];

          try {
            fs.mkdirSync(incrementalDir, { recursive: true });
            fs.writeFileSync(legacyFile, JSON.stringify(legacy), "utf8");
            fs.writeFileSync(
              incrementalFile,
              `${incremental.map(item => JSON.stringify({ item })).join("\n")}\n`,
              "utf8"
            );

            const processado = operacional.normalizarEntradasViva(
              [{ id: "processado-excluded", status: "processado" }],
              nowMs
            )[0];
            assert.equal(processado.bucket, "viva", "processado deve seguir a classificação atual e ficar fora do Terminal Index");

            const build = construirTerminalIndex({
              operation: "terminal_index_bootstrap",
              clienteId: workspace,
              checkpointRevision: "auditor-synthetic-bootstrap-0001",
              targetGeneration: 1,
              dataDir: root,
              nowMs
            }, {
              operacional: {
                normalizarEntradasViva: operacional.normalizarEntradasViva,
                identidadePrimariaExataFilaV2: operacional.identidadePrimariaExataFilaV2,
                rankStatusFilaV2: operacional.rankStatusFilaV2
              }
            });
            assert.equal(build.ok, true);

            const index = JSON.parse(fs.readFileSync(path.join(dir, terminalIndex.TERMINAL_INDEX_FILE), "utf8"));
            const proof = JSON.parse(fs.readFileSync(path.join(dir, terminalIndex.TERMINAL_INDEX_PROOF_FILE), "utf8"));
            assert.equal(index.authorityEligible, false);
            assert.equal(proof.authorityEligible, false);
            assert.equal(index.complete, true);
            assert.equal(proof.complete, true);
            assert.equal(index.sourceRevision, proof.sourceRevision);
            assert.equal(index.generation, proof.generation);

            const audit = spawnSync(process.execPath, [
              "scripts/auditar-terminal-index.js",
              "--workspace", workspace,
              "--data-dir", root
            ], { encoding: "utf8" });
            process.stdout.write(audit.stdout || "");
            process.stderr.write(audit.stderr || "");
            assert.equal(audit.status, 0, `auditor exit code inesperado: ${audit.status}`);

            const lines = (audit.stdout || "").trim().split(/\r?\n/).filter(Boolean);
            const report = JSON.parse(lines.at(-1));
            assert.equal(report.ok, true);
            assert.equal(report.missing, 0);
            assert.equal(report.extra, 0);
            assert.equal(report.statusMismatch, 0);
            assert.equal(report.concordancePercent, 100);
            assert.equal(report.unionIdentities, report.indexed);
            assert.equal(report.proofComplete, true);
            assert.equal(report.sourceRevision, proof.sourceRevision);
            assert.equal(report.generation, proof.generation);

            const expected = [
              "duplicate-precedence",
              "incremental-enviado",
              "incremental-only",
              "incremental-retida",
              "legacy-enviado",
              "legacy-expirado",
              "legacy-only",
              "legacy-retida",
              "overlap-expirada"
            ];
            assert.deepEqual(Object.keys(index.entries).sort(), expected);
            assert.deepEqual(index.entries["duplicate-precedence"], ["enviado", 3]);
            assert.deepEqual(index.entries["overlap-expirada"], ["expirada", 3]);
            assert.equal(index.entries["processado-excluded"], undefined);
            assert.equal(index.entries["incremental-processado-excluded"], undefined);

            console.log("terminal-index-auditor-synthetic:", JSON.stringify({
              ...report,
              sourceRevisionCoherent: index.sourceRevision === proof.sourceRevision && proof.sourceRevision === report.sourceRevision,
              generationCoherent: index.generation === proof.generation && proof.generation === report.generation,
              duplicatePrecedence: index.entries["duplicate-precedence"],
              overlapPrecedence: index.entries["overlap-expirada"],
              processadoExcludedByCurrentModel: true
            }));
          } finally {
            fs.rmSync(root, { recursive: true, force: true });
          }
          NODE

  terminal-index-large-500:
    name: Large gate 500 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Safety guard - branch and hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-1-delta-self-healing
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version | cut -c1-3)" = "v24"

      - name: Clean Linux dependency installation
        run: npm ci

      - name: Run Terminal Index large gate at 500 MiB
        shell: bash
        env:
          TERMINAL_INDEX_LARGE_GATE: "1"
          TERMINAL_INDEX_LARGE_MIB: "500"
        run: |
          set -euo pipefail
          node tests/terminal-index-v1-large-gate.test.js | tee "$RUNNER_TEMP/terminal-index-large-500.log"

