          test "$(git rev-parse "$FENCE_SHA^")" = "$PRE_FENCE_SHA"
          test "$(git rev-parse "$AUTHORITY_SHA^")" = "$PRE_AUTHORITY_SHA"
          test "$(git rev-parse "$PRE_OFC_VIVA_SHA^")" = "$AUTHORITY_SHA"
          test "$(git rev-parse "$OFC_VIVA_SHA^")" = "$PRE_OFC_VIVA_SHA"
          test "$(git rev-parse "$PRE_INFRA_CLEANUP_SHA^")" = "$OFC_VIVA_SHA"
          test "$(git rev-parse "$INFRA_CLEANUP_SHA^")" = "$PRE_INFRA_CLEANUP_SHA"
          test "$(git rev-parse "$WORKER_OBS_SHA^")" = "$PRE_WORKER_OBS_SHA"
          test "$(git rev-parse "$DISTRIBUTOR_COMPACT_SHA^")" = "$PRE_DISTRIBUTOR_COMPACT_SHA"
          test "$(git rev-parse "$DISTRIBUTOR_COMPACT_OBS_SHA^")" = "$PRE_DISTRIBUTOR_COMPACT_OBS_SHA"
          test "$(git rev-parse "$PERSISTENCE_STALE_LIVENESS_SHA^")" = "$PRE_PERSISTENCE_STALE_LIVENESS_SHA"
          test "$(git rev-parse "$PERSISTENCE_STALE_TEST_ALIGNMENT_SHA^")" = "$PRE_PERSISTENCE_STALE_TEST_ALIGNMENT_SHA"
          test "$(git rev-parse "$PERSISTENCE_PROGRESS_SHA^")" = "$PRE_PERSISTENCE_PROGRESS_SHA"
          test "$(git rev-parse "$PERSISTENCE_PROGRESS_TEST_FIX_SHA^")" = "$PRE_PERSISTENCE_PROGRESS_TEST_FIX_SHA"
          test "$(git rev-parse "$OFC_SUBCALLER_OBS_SHA^")" = "$PRE_OFC_SUBCALLER_OBS_SHA"
          test "$(git rev-parse "$TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA^")" = "$PRE_TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA"
          test "$(git rev-parse "$FILA_LEGACY_CALLER_OBS_SHA^")" = "$PRE_FILA_LEGACY_CALLER_OBS_SHA"
          test "$(git rev-parse "$EXECUTOR_GENERATION_AUTHORITY_SHA^")" = "$PRE_EXECUTOR_GENERATION_AUTHORITY_SHA"
          test "$(git rev-parse "$EXECUTOR_SYNC_READINESS_SHA^")" = "$PRE_EXECUTOR_SYNC_READINESS_SHA"
          git merge-base --is-ancestor "$FUNCTIONAL_SHA" HEAD
          git merge-base --is-ancestor "$PRE_FENCE_SHA" HEAD
          git merge-base --is-ancestor "$FENCE_SHA" HEAD
          git merge-base --is-ancestor "$PRE_AUTHORITY_SHA" HEAD
          git merge-base --is-ancestor "$AUTHORITY_SHA" HEAD
          git merge-base --is-ancestor "$PRE_OFC_VIVA_SHA" HEAD
          git merge-base --is-ancestor "$OFC_VIVA_SHA" HEAD
          git merge-base --is-ancestor "$PRE_INFRA_CLEANUP_SHA" HEAD
          git merge-base --is-ancestor "$INFRA_CLEANUP_SHA" HEAD
          git merge-base --is-ancestor "$PRE_WORKER_OBS_SHA" HEAD
          git merge-base --is-ancestor "$WORKER_OBS_SHA" HEAD
          git merge-base --is-ancestor "$PRE_DISTRIBUTOR_COMPACT_SHA" HEAD
          git merge-base --is-ancestor "$DISTRIBUTOR_COMPACT_SHA" HEAD
          git merge-base --is-ancestor "$PRE_DISTRIBUTOR_COMPACT_OBS_SHA" HEAD
          git merge-base --is-ancestor "$DISTRIBUTOR_COMPACT_OBS_SHA" HEAD
          git merge-base --is-ancestor "$PRE_PERSISTENCE_STALE_LIVENESS_SHA" HEAD
          git merge-base --is-ancestor "$PERSISTENCE_STALE_LIVENESS_SHA" HEAD
          git merge-base --is-ancestor "$PRE_PERSISTENCE_STALE_TEST_ALIGNMENT_SHA" HEAD
          git merge-base --is-ancestor "$PERSISTENCE_STALE_TEST_ALIGNMENT_SHA" HEAD
          git merge-base --is-ancestor "$PRE_PERSISTENCE_PROGRESS_SHA" HEAD
          git merge-base --is-ancestor "$PERSISTENCE_PROGRESS_SHA" HEAD
          git merge-base --is-ancestor "$PRE_PERSISTENCE_PROGRESS_TEST_FIX_SHA" HEAD
          git merge-base --is-ancestor "$PERSISTENCE_PROGRESS_TEST_FIX_SHA" HEAD
          git merge-base --is-ancestor "$PRE_OFC_SUBCALLER_OBS_SHA" HEAD
          git merge-base --is-ancestor "$OFC_SUBCALLER_OBS_SHA" HEAD
          git merge-base --is-ancestor "$PRE_TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA" HEAD
          git merge-base --is-ancestor "$TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA" HEAD
          git merge-base --is-ancestor "$PRE_FILA_LEGACY_CALLER_OBS_SHA" HEAD
