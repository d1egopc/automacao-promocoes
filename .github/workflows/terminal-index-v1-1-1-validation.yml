      - name: Safety guard - branch and hosted Node 24
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-1-delta-self-healing
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version | cut -c1-3)" = "v24"

      - name: Clean Linux dependency installation
        run: npm ci

      - name: Run Terminal Index large gate at 600 MiB
        shell: bash
        env:
          TERMINAL_INDEX_LARGE_GATE: "1"
          TERMINAL_INDEX_LARGE_MIB: "600"
        run: |
          set -euo pipefail
          node tests/terminal-index-v1-large-gate.test.js | tee "$RUNNER_TEMP/terminal-index-large-600.log"
