name: Terminal Index V1.1.1 Linux validation

on:
  push:
    branches:
      - feature/terminal-index-v1-1-1-delta-self-healing

permissions:
  contents: read

concurrency:
  group: terminal-index-v1-1-1-validation
  cancel-in-progress: false

jobs:
  linux-node24:
    name: Linux / Node 24 / npm ci / self-healing gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove branch, functional ancestry, scope, and base diff
        shell: bash
        env:
          BASE_SHA: e2e71311ec635d7f2897e7303efd2c0bf8a2d388
          FUNCTIONAL_SHA: 358a20ae7a1cb6bcd53ce2e9f163c00ca6287b1a
          PRE_FENCE_SHA: 65ae94181cc444a9e0bb9fa5a99666edf85c0248
          FENCE_SHA: b24c14e2255805532a8d3fdf960af84ff5431f3f
          PRE_AUTHORITY_SHA: a75fdb7e0b8647e4ec33e5bf69f2a97f22bd8e0b
          AUTHORITY_SHA: a575eae893f421b7dd4da67f27a9547739b2ccdf
          PRE_OFC_VIVA_SHA: 398c407ec4011cb928843f483fa0c3ac36b426e7
          OFC_VIVA_SHA: 48a157a639dd475f3ce6b438609dcf768f1fc632
          PRE_INFRA_CLEANUP_SHA: ae81d450885bc36c1801fd15bc324086a6edf6d6
          INFRA_CLEANUP_SHA: f00e2aba83793976373cefb4e3b73614c43017f8
          PRE_WORKER_OBS_SHA: 4411bb6b39f071e322962e54219d991dde9d8e1e
          WORKER_OBS_SHA: 0d936783b7f57c11e3d67a3a0dbc845350a9d40d
          PRE_DISTRIBUTOR_COMPACT_SHA: 69112d395dd7c94dd54a7c4f2cfa0e6546c0e2ae
          DISTRIBUTOR_COMPACT_SHA: 428af3cabdb3d250eac3f74d795d61b6a4050a3f
          PRE_DISTRIBUTOR_COMPACT_OBS_SHA: bd8e5f348e83bf17de225ca17b7077a204cfa9b1
          DISTRIBUTOR_COMPACT_OBS_SHA: b9e3b3af64e12421b596da4c711a4290dbdd459b
          PRE_PERSISTENCE_STALE_LIVENESS_SHA: ad90f68bed015f6de0123cd255a9f2591edc2cb9
          PERSISTENCE_STALE_LIVENESS_SHA: 160ab6a17481ddfc5a638783adb32d8c8a94622c
          PRE_PERSISTENCE_STALE_TEST_ALIGNMENT_SHA: a9a624bff2137ccf039c829bf82d32eacaffc7f7
          PERSISTENCE_STALE_TEST_ALIGNMENT_SHA: 3d56dba11ea7f46f28cb8ec5c2bb70a3882084e5
          PRE_PERSISTENCE_PROGRESS_SHA: 3e7ce9884bb49fd4e2e0727f5f09a52629eb35a8
          PERSISTENCE_PROGRESS_SHA: cbe2c3cc6a960b7ba30953a3e0d58d2230d78123
          PRE_PERSISTENCE_PROGRESS_TEST_FIX_SHA: 6149fb5e26325ea5f03f4b17ff9c290cb0f5dc90
          PERSISTENCE_PROGRESS_TEST_FIX_SHA: e0e75263267786eb0b53e5be6aaa2e1765411ab2
          PRE_OFC_SUBCALLER_OBS_SHA: b852a072f518a204a5aeb359e52ecc8e769a40a5
          OFC_SUBCALLER_OBS_SHA: a452cfd1dc156be5dd50ff435d6d0c13eac0a399
          PRE_TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA: 76f31ef6e3482d5df52023628529d92c6fa3ed0e
          TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA: 32d7a96392d3bdc32d33e2ee21e21f75b1bf6795
          PRE_FILA_LEGACY_CALLER_OBS_SHA: ec20d244b6b6a27098ad497e6e3b1e729427e6df
          FILA_LEGACY_CALLER_OBS_SHA: 18cc1e934700463827623657d4feb0b94d5e4025
          PRE_EXECUTOR_GENERATION_AUTHORITY_SHA: 0e040dc729d85d58f5bc1f79b144033f3d945f59
          EXECUTOR_GENERATION_AUTHORITY_SHA: d700d8069b42ac0bcc853ab3ea4f5f5cc5497932
          PRE_EXECUTOR_SYNC_READINESS_SHA: e4863064442129fadd222063236d0e610a84e771
          EXECUTOR_SYNC_READINESS_SHA: a05fb5a1e6b52156b8fc376da47eaf64100a1938
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-1-delta-self-healing
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version | cut -c1-3)" = "v24"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$FUNCTIONAL_SHA^{commit}"
          git cat-file -e "$PRE_FENCE_SHA^{commit}"
          git cat-file -e "$FENCE_SHA^{commit}"
          git cat-file -e "$PRE_AUTHORITY_SHA^{commit}"
          git cat-file -e "$AUTHORITY_SHA^{commit}"
          git cat-file -e "$PRE_OFC_VIVA_SHA^{commit}"
          git cat-file -e "$OFC_VIVA_SHA^{commit}"
          git cat-file -e "$PRE_INFRA_CLEANUP_SHA^{commit}"
          git cat-file -e "$INFRA_CLEANUP_SHA^{commit}"
          git cat-file -e "$PRE_WORKER_OBS_SHA^{commit}"
          git cat-file -e "$WORKER_OBS_SHA^{commit}"
          git cat-file -e "$PRE_DISTRIBUTOR_COMPACT_SHA^{commit}"
          git cat-file -e "$DISTRIBUTOR_COMPACT_SHA^{commit}"
          git cat-file -e "$PRE_DISTRIBUTOR_COMPACT_OBS_SHA^{commit}"
          git cat-file -e "$DISTRIBUTOR_COMPACT_OBS_SHA^{commit}"
          git cat-file -e "$PRE_PERSISTENCE_STALE_LIVENESS_SHA^{commit}"
          git cat-file -e "$PERSISTENCE_STALE_LIVENESS_SHA^{commit}"
          git cat-file -e "$PRE_PERSISTENCE_STALE_TEST_ALIGNMENT_SHA^{commit}"
          git cat-file -e "$PERSISTENCE_STALE_TEST_ALIGNMENT_SHA^{commit}"
          git cat-file -e "$PRE_PERSISTENCE_PROGRESS_SHA^{commit}"
          git cat-file -e "$PERSISTENCE_PROGRESS_SHA^{commit}"
          git cat-file -e "$PRE_PERSISTENCE_PROGRESS_TEST_FIX_SHA^{commit}"
          git cat-file -e "$PERSISTENCE_PROGRESS_TEST_FIX_SHA^{commit}"
          git cat-file -e "$PRE_OFC_SUBCALLER_OBS_SHA^{commit}"
          git cat-file -e "$OFC_SUBCALLER_OBS_SHA^{commit}"
          git cat-file -e "$PRE_TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA^{commit}"
          git cat-file -e "$TERMINAL_INDEX_CATCHUP_TEST_FIX_SHA^{commit}"
          git cat-file -e "$PRE_FILA_LEGACY_CALLER_OBS_SHA^{commit}"
          git cat-file -e "$FILA_LEGACY_CALLER_OBS_SHA^{commit}"
          git cat-file -e "$PRE_EXECUTOR_GENERATION_AUTHORITY_SHA^{commit}"
          git cat-file -e "$EXECUTOR_GENERATION_AUTHORITY_SHA^{commit}"
          git cat-file -e "$PRE_EXECUTOR_SYNC_READINESS_SHA^{commit}"
          git cat-file -e "$EXECUTOR_SYNC_READINESS_SHA^{commit}"
