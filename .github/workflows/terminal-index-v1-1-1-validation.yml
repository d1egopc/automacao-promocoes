            modules/engine/ofc/distributor-snapshot-client.js \
            modules/engine/ofc/distributor-snapshot-coordinator.js \
            modules/engine/ofc/distributor-snapshot-worker.js \
            tests/distributor-snapshot-coordinator.test.js | sort)
          distributor_compact_actual=$(git diff --name-only "$PRE_DISTRIBUTOR_COMPACT_SHA..$DISTRIBUTOR_COMPACT_SHA" | sort)
          test "$distributor_compact_actual" = "$distributor_compact_expected"
          distributor_compact_obs_expected=$(printf '%s\n' \
            modules/engine/distributor/distributor.runner.js \
            modules/engine/ofc/distributor-snapshot-client.js \
            modules/engine/ofc/distributor-snapshot-coordinator.js \
            tests/distributor-snapshot-coordinator.test.js | sort)
          distributor_compact_obs_actual=$(git diff --name-only "$PRE_DISTRIBUTOR_COMPACT_OBS_SHA..$DISTRIBUTOR_COMPACT_OBS_SHA" | sort)
          test "$distributor_compact_obs_actual" = "$distributor_compact_obs_expected"
