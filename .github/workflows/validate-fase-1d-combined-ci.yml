name: Validate Phase 1D Combined Release CI

on:
  push:
    branches:
      - validation/fase-1d-combined-ci

permissions:
  contents: read

jobs:
  ci:
    name: CI Phase 1D Combined Release (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ""
      FILA_CHECKPOINT_TEST_DATABASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          git diff --name-only cd3954de946bf9dede677a9b665d7bb1325f47a8 HEAD -- '*.js' | while IFS= read -r file; do node --check "$file"; done
          node --check modules/radar/redirect/safe-redirect-http.js
          node --check tests/safe-redirect-http-lifecycle.test.js
      - name: Encoding audit
        run: npm run audit:encoding
      - name: Phase 1D observability tests
        run: node tests/ofc-fase-1d-observabilidade.test.js
      - name: ECONNRESET lifecycle regression
        run: node tests/safe-redirect-http-lifecycle.test.js
      - name: Dynamic link resolvers regression
        run: node tests/dynamic-link-resolvers.test.js
      - name: Critical tests
        run: |
          node tests/clean-install-bootstrap.test.js
          node tests/financeiro-bootstrap-schema.test.js
          node tests/platform-variables-v1.test.js
          node tests/google-platform-config.test.js
          node tests/mercadopago-platform-variables.test.js
          node tests/financeiro-mercadopago-pix-v1.test.js
          node tests/financeiro-checkout-pix-publico-v1.test.js
          node tests/link-optimus-repository.test.js
          node tests/link-optimus-admin-config.test.js
