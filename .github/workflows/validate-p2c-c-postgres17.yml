name: P2C-C representative PostgreSQL 17 proof

on:
  push:
    branches:
      - validation/p2c-c-postgres17

permissions:
  contents: read

concurrency:
  group: p2c-c-disposable-proof
  cancel-in-progress: false

jobs:
  representative-proof:
    name: Representative SELECT and durable COMMIT (no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/p2c-c-postgres17'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p2c_disposable_representative
          POSTGRES_USER: p2c_ci
          POSTGRES_PASSWORD: disposable_p2c_c_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2c_ci -d p2c_disposable_representative"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: ""
      P2C_TEST_DATABASE_URL: postgresql://p2c_ci:disposable_p2c_c_only@127.0.0.1:5432/p2c_disposable_representative
      P2C_ISOLATED_ACK: disposable-synthetic-only
      P2C_EVIDENCE_DIR: p2c-c-evidence
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Safety guards - allowlist, hosted runner and isolated ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/validation/p2c-c-postgres17
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$DATABASE_URL"
          git merge-base --is-ancestor 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD
          git diff --name-only 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD | while IFS= read -r file; do
            case "$file" in
              tests/p2c-c-postgres17-proof.cjs|tests/p2c-c-production-profile.json|tests/p2c-c-ci-observer.py|.github/workflows/validate-p2c-c-postgres17.yml) ;;
              *) echo "Unapproved file"; exit 1 ;;
            esac
          done
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Syntax, encoding and diff check
        run: |
          node --check tests/p2c-c-postgres17-proof.cjs
          python3 -m py_compile tests/p2c-c-ci-observer.py
          npm run audit:encoding
          git diff --check
      - name: Baseline versus GIN - representative profile, exact equivalence and COMMIT
        env:
          P2C_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P2C_EVIDENCE_DIR"
          python3 tests/p2c-c-ci-observer.py &
          observer_pid=$!
          trap 'touch "$P2C_EVIDENCE_DIR/observer-stop"; wait "$observer_pid" || true' EXIT
          node tests/p2c-c-postgres17-proof.cjs
      - name: Publish evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-c-representative-evidence
          path: p2c-c-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Bounded proof overview
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            if(!fs.existsSync('p2c-c-evidence/proof.json')) throw new Error('No PostgreSQL evidence');
            const p=JSON.parse(fs.readFileSync('p2c-c-evidence/proof.json','utf8'));
            const message=JSON.stringify({status:p.status,failure:p.failure,environment:p.environment,
              representativeness:p.representativeness,equivalence:p.equivalence,
              build:p.build?{wallMs:p.build.wallMs,index:p.build.index}:null});
            if(message.length>3900) throw new Error('Overview exceeds annotation budget; artifact retained');
            core.notice(message,{title:'P2C-C overview'});
            for(const [name,profile] of Object.entries(p.profiles))
              core.notice(JSON.stringify(profile),{title:'P2C-C profile '+name});
            await core.summary.addHeading('P2C-C isolated proof').addRaw('Status: '+p.status+'; synthetic only. No production credentials or deploy.').write();
            if(p.status!=='passed') throw new Error('Proof did not pass');
      - name: Bounded baseline SELECT metrics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');if(!fs.existsSync('p2c-c-evidence/proof.json'))return;
            const p=JSON.parse(fs.readFileSync('p2c-c-evidence/proof.json','utf8'));
            for(const v of ['canonical','importer']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='baseline'&&x.variant===v);
              for(let i=0;i<rows.length;i+=5) core.notice(JSON.stringify(rows.slice(i,i+5).map(x=>({case:x.case,count:x.setCount,exec:x.executionMs,plan:x.metrics[0]}))),{title:'P2C-C baseline '+v+' '+i});
            }
      - name: Bounded GIN SELECT metrics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');if(!fs.existsSync('p2c-c-evidence/proof.json'))return;
            const p=JSON.parse(fs.readFileSync('p2c-c-evidence/proof.json','utf8'));
            for(const v of ['canonical','importer']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='gin'&&x.variant===v);
              for(let i=0;i<rows.length;i+=5) core.notice(JSON.stringify(rows.slice(i,i+5).map(x=>({case:x.case,count:x.setCount,exec:x.executionMs,plan:x.metrics[0]}))),{title:'P2C-C gin '+v+' '+i});
            }
      - name: Bounded durable write metrics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');if(!fs.existsSync('p2c-c-evidence/proof.json'))return;
            const p=JSON.parse(fs.readFileSync('p2c-c-evidence/proof.json','utf8'));
            for(const s of ['baseline','gin'])for(const op of ['insert','metadata_update','status_update']) {
              const rows=p.writes.filter(x=>x.strategy===s&&x.operation===op).map(x=>({batch:x.batch,concurrency:x.concurrency,
                wall:x.wallMs,rowsPerSecond:x.rowsPerSecond,latency:x.latencyMs,commit:x.commitMs,wal:x.walBytes,
                walPerRow:x.walBytesPerRow,indexBefore:x.before.gin,indexAfter:x.after.gin}));
              core.notice(JSON.stringify(rows),{title:'P2C-C write '+s+' '+op});
            }
