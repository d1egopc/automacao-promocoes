name: P2C PostgreSQL 17 isolated proof

on:
  push:
    branches:
      - validation/p2c-postgres17

permissions:
  contents: read

concurrency:
  group: p2c-postgres17-disposable-proof
  cancel-in-progress: false

jobs:
  postgres17-proof:
    name: P2C synthetic PostgreSQL 17 (no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/p2c-postgres17' && !contains(github.event.head_commit.message, '[p2c-report]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p2c_disposable_synthetic
          POSTGRES_USER: p2c_ci
          POSTGRES_PASSWORD: disposable_p2c_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2c_ci -d p2c_disposable_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: ""
      P2C_TEST_DATABASE_URL: postgresql://p2c_ci:disposable_p2c_ci_only@127.0.0.1:5432/p2c_disposable_synthetic
      P2C_ISOLATED_ACK: disposable-synthetic-only
      P2C_ROWS: "61000"
      P2C_REPETITIONS: "3"
      P2C_EVIDENCE_DIR: p2c-evidence
    steps:
      - name: Checkout validation branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Safety guards (hosted, non-main, no external credentials)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/validation/p2c-postgres17
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$DATABASE_URL"
          git merge-base --is-ancestor 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD
          git diff --name-only 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD | while IFS= read -r file; do
            case "$file" in
              tests/p2c-postgres17-proof.cjs|.github/workflows/validate-p2c-postgres17.yml) ;;
              *) echo "Unapproved file in validation branch"; exit 1 ;;
            esac
          done
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Syntax and encoding
        run: |
          node --check tests/p2c-postgres17-proof.cjs
          npm run audit:encoding
          git diff --check
      - name: Real PostgreSQL 17 - synthetic fixtures, equivalence and EXPLAIN ANALYZE
        run: node tests/p2c-postgres17-proof.cjs
      - name: Publish isolated evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-postgres17-synthetic-evidence
          path: p2c-evidence/proof.json
          if-no-files-found: warn
          retention-days: 14

  evidence-report-only:
    name: Publish existing synthetic proof metrics (no database, no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/p2c-postgres17' && contains(github.event.head_commit.message, '[p2c-report]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify exact isolated source run
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 36284469055});
            if (r.data.head_branch !== 'validation/p2c-postgres17' || r.data.head_sha !== '1ad1ebad8351d59fa5034b70ce7ea1d76b59bb83' || r.data.status !== 'completed') throw new Error('Unexpected proof source');
            core.notice(JSON.stringify({sourceRun:r.data.id, sourceSha:r.data.head_sha, conclusion:r.data.conclusion}), {title:'P2C source run'});
      - name: Download only synthetic proof artifact from exact source run
        uses: actions/download-artifact@v4
        with:
          name: p2c-postgres17-synthetic-evidence
          path: synthetic-proof
          run-id: 36284469055
          github-token: ${{ github.token }}
      - name: Publish synthetic metrics, never credentials or production data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            if (p.synthetic !== true) throw new Error('Only synthetic evidence permitted');
            core.notice(JSON.stringify({status:p.status, failure:p.failure, environment:p.environment, fixture:p.fixture, equivalence:p.equivalence, identity:p.identity, builds:p.builds, limitations:p.limitations}), {title:'P2C proof overview'});
            for (const strategy of ['baseline','btree','gin','structured']) {
              for (const variant of ['canonical','importer','importer_no_metadata']) {
                const cases = p.benchmarks.filter(x => x.strategy === strategy && x.variant === variant).map(({plans,...x})=>x);
                core.notice(JSON.stringify(cases), {title:`P2C ${strategy} ${variant}`});
              }
            }
            core.notice(JSON.stringify(p.writes.map(({plans,...x})=>x)), {title:'P2C isolated write probes'});
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Existing P2C synthetic proof\n\nSource: https://github.com/d1egopc/automacao-promocoes/actions/runs/36284469055\n\nStatus: ' + p.status + '\n\nNo database connection and no deploy in this reporting job.\n');
            if (p.status !== 'passed') throw new Error('Original isolated proof did not pass');
