name: P2C PostgreSQL 17 isolated proof

on:
  push:
    branches:
      - validation/p2c-postgres17

permissions:
  contents: read

concurrency:
  group: p2c-postgres17-disposable-proof
  cancel-in-progress: false

jobs:
  postgres17-proof:
    name: P2C synthetic PostgreSQL 17 (no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/p2c-postgres17' && !contains(github.event.head_commit.message, '[p2c-report]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p2c_disposable_synthetic
          POSTGRES_USER: p2c_ci
          POSTGRES_PASSWORD: disposable_p2c_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2c_ci -d p2c_disposable_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: ""
      P2C_TEST_DATABASE_URL: postgresql://p2c_ci:disposable_p2c_ci_only@127.0.0.1:5432/p2c_disposable_synthetic
      P2C_ISOLATED_ACK: disposable-synthetic-only
      P2C_ROWS: "61000"
      P2C_REPETITIONS: "3"
      P2C_EVIDENCE_DIR: p2c-evidence
    steps:
      - name: Checkout validation branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Safety guards (hosted, non-main, no external credentials)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/validation/p2c-postgres17
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$DATABASE_URL"
          git merge-base --is-ancestor 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD
          git diff --name-only 1e02b8f9f9465bf9dc37b83216d64ad85c4fbbd5 HEAD | while IFS= read -r file; do
            case "$file" in
              tests/p2c-postgres17-proof.cjs|.github/workflows/validate-p2c-postgres17.yml) ;;
              *) echo "Unapproved file in validation branch"; exit 1 ;;
            esac
          done
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Syntax and encoding
        run: |
          node --check tests/p2c-postgres17-proof.cjs
          npm run audit:encoding
          git diff --check
      - name: Real PostgreSQL 17 - synthetic fixtures, equivalence and EXPLAIN ANALYZE
        run: node tests/p2c-postgres17-proof.cjs
      - name: Publish isolated evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-postgres17-synthetic-evidence
          path: p2c-evidence/proof.json
          if-no-files-found: warn
          retention-days: 14

  evidence-report-only:
    name: Publish existing synthetic proof metrics (no database, no deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/p2c-postgres17' && contains(github.event.head_commit.message, '[p2c-report]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify exact isolated source run
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 36284469055});
            if (r.data.head_branch !== 'validation/p2c-postgres17' || r.data.head_sha !== '1ad1ebad8351d59fa5034b70ce7ea1d76b59bb83' || r.data.status !== 'completed') throw new Error('Unexpected proof source');
            core.notice(JSON.stringify({sourceRun:r.data.id, sourceSha:r.data.head_sha, conclusion:r.data.conclusion}), {title:'P2C source run'});
      - name: Download only synthetic proof artifact from exact source run
        uses: actions/download-artifact@v4
        with:
          name: p2c-postgres17-synthetic-evidence
          path: synthetic-proof
          run-id: 36284469055
          github-token: ${{ github.token }}
      - name: Publish bounded synthetic overview
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            if (p.synthetic !== true) throw new Error('Only synthetic evidence permitted');
            const eq = Object.fromEntries(Object.entries(p.equivalence).map(([k,v])=>[k,{...v,...(v.mismatches ? {mismatches:v.mismatches.map(x=>x.variant+':'+x.case)} : {})}]));
            const overview = {status:p.status, failure:p.failure, startedAt:p.startedAt, finishedAt:p.finishedAt, environment:p.environment, fixture:p.fixture,
              equivalence:eq, builds:p.builds.map(({definition,...x})=>x), poolError:p.poolError};
            const msg = JSON.stringify(overview);
            if (msg.length > 3900) throw new Error('Overview too large');
            core.notice(msg, {title:'P2C bounded overview'});
            core.notice(JSON.stringify(p.identity), {title:'P2C whole corpus identity'});
            core.notice(JSON.stringify(p.writes.map(({plans,...x})=>x)), {title:'P2C write probes'});
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Existing P2C synthetic proof\n\nSource run 36284469055; status: '+p.status+'\n\nNo database connection and no deploy.\n');
            if (p.status !== 'passed') throw new Error('Original isolated proof did not pass');
      - name: Publish bounded baseline plans and timings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            function node(n) {
              const keys=['Node Type','Index Name','Startup Cost','Total Cost','Plan Rows','Actual Rows','Actual Loops','Workers Planned','Workers Launched','Rows Removed by Filter','Rows Removed by Index Recheck','Shared Hit Blocks','Shared Read Blocks','Sort Method'];
              return {...Object.fromEntries(keys.filter(k=>k in n).map(k=>[k,n[k]])),...(n.Plans?{Plans:n.Plans.map(node)}:{})};
            }
            for(const variant of ['canonical','importer','importer_no_metadata']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='baseline' && x.variant===variant);
              const times=rows.map(x=>({case:x.case,setCount:x.setCount,exec:[x.executionMs.min,x.executionMs.median,x.executionMs.max],plan:[x.planningMs.min,x.planningMs.median,x.planningMs.max],buffers:x.metrics[0].buffers,scans:x.metrics[0].scans.map(s=>[s.type,s.index||null,s.rows,s.loops,s.removed,s.removedRecheck,s.approximateVisited]),sorts:x.metrics[0].sorts}));
              const plans=rows.filter(x=>['recent','old','miss'].includes(x.case)).map(x=>({case:x.case,plan:node(x.plans[0].Plan)}));
              for(const [suffix,value] of [['timings',times],['plans',plans]]) {
                const msg=JSON.stringify(value);
                if(msg.length>3900) throw new Error('Evidence annotation too large: baseline '+variant+' '+suffix);
                core.notice(msg,{title:'P2C baseline '+variant+' '+suffix});
              }
            }
      - name: Publish bounded btree plans and timings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            function node(n) {
              const keys=['Node Type','Index Name','Startup Cost','Total Cost','Plan Rows','Actual Rows','Actual Loops','Workers Planned','Workers Launched','Rows Removed by Filter','Rows Removed by Index Recheck','Shared Hit Blocks','Shared Read Blocks','Sort Method'];
              return {...Object.fromEntries(keys.filter(k=>k in n).map(k=>[k,n[k]])),...(n.Plans?{Plans:n.Plans.map(node)}:{})};
            }
            for(const variant of ['canonical','importer','importer_no_metadata']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='btree' && x.variant===variant);
              const times=rows.map(x=>({case:x.case,setCount:x.setCount,exec:[x.executionMs.min,x.executionMs.median,x.executionMs.max],plan:[x.planningMs.min,x.planningMs.median,x.planningMs.max],buffers:x.metrics[0].buffers,scans:x.metrics[0].scans.map(s=>[s.type,s.index||null,s.rows,s.loops,s.removed,s.removedRecheck,s.approximateVisited]),sorts:x.metrics[0].sorts}));
              const plans=rows.filter(x=>['recent','old','miss'].includes(x.case)).map(x=>({case:x.case,plan:node(x.plans[0].Plan)}));
              for(const [suffix,value] of [['timings',times],['plans',plans]]) {
                const msg=JSON.stringify(value);
                if(msg.length>3900) throw new Error('Evidence annotation too large: btree '+variant+' '+suffix);
                core.notice(msg,{title:'P2C btree '+variant+' '+suffix});
              }
            }
      - name: Publish bounded gin plans and timings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            function node(n) {
              const keys=['Node Type','Index Name','Startup Cost','Total Cost','Plan Rows','Actual Rows','Actual Loops','Workers Planned','Workers Launched','Rows Removed by Filter','Rows Removed by Index Recheck','Shared Hit Blocks','Shared Read Blocks','Sort Method'];
              return {...Object.fromEntries(keys.filter(k=>k in n).map(k=>[k,n[k]])),...(n.Plans?{Plans:n.Plans.map(node)}:{})};
            }
            for(const variant of ['canonical','importer','importer_no_metadata']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='gin' && x.variant===variant);
              const times=rows.map(x=>({case:x.case,setCount:x.setCount,exec:[x.executionMs.min,x.executionMs.median,x.executionMs.max],plan:[x.planningMs.min,x.planningMs.median,x.planningMs.max],buffers:x.metrics[0].buffers,scans:x.metrics[0].scans.map(s=>[s.type,s.index||null,s.rows,s.loops,s.removed,s.removedRecheck,s.approximateVisited]),sorts:x.metrics[0].sorts}));
              const plans=rows.filter(x=>['recent','old','miss'].includes(x.case)).map(x=>({case:x.case,plan:node(x.plans[0].Plan)}));
              for(const [suffix,value] of [['timings',times],['plans',plans]]) {
                const msg=JSON.stringify(value);
                if(msg.length>3900) throw new Error('Evidence annotation too large: gin '+variant+' '+suffix);
                core.notice(msg,{title:'P2C gin '+variant+' '+suffix});
              }
            }
      - name: Publish bounded structured plans and timings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('synthetic-proof/proof.json','utf8'));
            function node(n) {
              const keys=['Node Type','Index Name','Startup Cost','Total Cost','Plan Rows','Actual Rows','Actual Loops','Workers Planned','Workers Launched','Rows Removed by Filter','Rows Removed by Index Recheck','Shared Hit Blocks','Shared Read Blocks','Sort Method'];
              return {...Object.fromEntries(keys.filter(k=>k in n).map(k=>[k,n[k]])),...(n.Plans?{Plans:n.Plans.map(node)}:{})};
            }
            for(const variant of ['canonical','importer','importer_no_metadata']) {
              const rows=p.benchmarks.filter(x=>x.strategy==='structured' && x.variant===variant);
              const times=rows.map(x=>({case:x.case,setCount:x.setCount,exec:[x.executionMs.min,x.executionMs.median,x.executionMs.max],plan:[x.planningMs.min,x.planningMs.median,x.planningMs.max],buffers:x.metrics[0].buffers,scans:x.metrics[0].scans.map(s=>[s.type,s.index||null,s.rows,s.loops,s.removed,s.removedRecheck,s.approximateVisited]),sorts:x.metrics[0].sorts}));
              const plans=rows.filter(x=>['recent','old','miss'].includes(x.case)).map(x=>({case:x.case,plan:node(x.plans[0].Plan)}));
              for(const [suffix,value] of [['timings',times],['plans',plans]]) {
                const msg=JSON.stringify(value);
                if(msg.length>3900) throw new Error('Evidence annotation too large: structured '+variant+' '+suffix);
                core.notice(msg,{title:'P2C structured '+variant+' '+suffix});
              }
            }
