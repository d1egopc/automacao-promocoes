name: Terminal Index V1.1 delta validation

on:
  push:
    branches:
      - feature/terminal-index-v1-1-delta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-index-v1-1-delta-validation
  cancel-in-progress: false

env:
  BASE_SHA: 238df943893a898aeb6dd01ecaf782748026293a
  FUNCTIONAL_SHA: e2e71311ec635d7f2897e7303efd2c0bf8a2d388

jobs:
  linux-node24:
    name: Linux Node 24 terminal index delta gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify isolated ref and functional diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/terminal-index-v1-1-delta
          test "$GITHUB_EVENT_NAME" = push || test "$GITHUB_EVENT_NAME" = workflow_dispatch
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${FUNCTIONAL_SHA}^{commit}"
          test "$(git rev-parse "${FUNCTIONAL_SHA}^")" = "$BASE_SHA"
          git merge-base --is-ancestor "$FUNCTIONAL_SHA" HEAD
          expected=$(mktemp)
          actual=$(mktemp)
          cat > "$expected" <<'EOF'
          index.js
          modules/fila/fila-operacional-v2.js
          modules/fila/persistence-coordinator.js
          modules/fila/persistence-protocol.js
          modules/fila/persistence-worker.js
          modules/fila/terminal-index-shadow.js
          modules/fila/terminal-index-worker.js
          scripts/auditar-terminal-index.js
          tests/terminal-index-v1-1-delta.test.js
          utils/painel-latencia.js
          EOF
          sed -i 's/^          //' "$expected"
          git diff --name-only "$BASE_SHA" "$FUNCTIONAL_SHA" | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff --check "$BASE_SHA" "$FUNCTIONAL_SHA"

      - name: Install locked production and test dependencies
        run: npm ci

      - name: Syntax and encoding gates
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check modules/fila/fila-operacional-v2.js
          node --check modules/fila/persistence-coordinator.js
          node --check modules/fila/persistence-protocol.js
          node --check modules/fila/persistence-worker.js
          node --check modules/fila/terminal-index-shadow.js
          node --check modules/fila/terminal-index-worker.js
          node --check scripts/auditar-terminal-index.js
          node --check tests/terminal-index-v1-1-delta.test.js
          node --check utils/painel-latencia.js
          node scripts/audit-encoding.cjs

      - name: Terminal Index V1.1 delta core gates
        run: node tests/terminal-index-v1-1-delta.test.js

      - name: Terminal Index V1 shadow regression gates
        run: node tests/terminal-index-v1-shadow.test.js

      - name: Terminal Index auditor read-only gate
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/terminal-index-auditor"
          mkdir -p "$audit_root/clientes/audit_fixture/fila-historico-incremental"
          AUDIT_ROOT="$audit_root" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { construirTerminalIndex } = require("./modules/fila/terminal-index-worker");
          const operacional = require("./modules/fila/fila-operacional-v2");
          const root = process.env.AUDIT_ROOT;
          const cliente = "audit_fixture";
          const dir = path.join(root, "clientes", cliente);
          fs.writeFileSync(path.join(dir, "fila-historico.json"), JSON.stringify([
            { id: "audit_terminal_1", status: "enviado" },
            { id: "audit_terminal_2", status: "retida" }
          ]));
          fs.writeFileSync(path.join(dir, "fila-historico-incremental", "2026-09-28.jsonl"),
            JSON.stringify({ item: { id: "audit_terminal_2", status: "enviado" } }) + "\n");
          const result = construirTerminalIndex({
            operation: "terminal_index_bootstrap",
            clienteId: cliente,
            checkpointRevision: "audit-revision-1",
            targetGeneration: 1,
            dataDir: root
          }, { operacional });
          if (!result.ok) throw new Error("bootstrap da fixture do auditor falhou");
          NODE
          output=$(node scripts/auditar-terminal-index.js --data-dir "$audit_root" --workspace audit_fixture)
          echo "$output"
          node -e 'const r=JSON.parse(process.argv[1]); if (!r.ok || r.proofComplete !== true || r.proofAuthorityEligible !== false) process.exit(1)' "$output"

      - name: Terminal Index 500 MiB bootstrap gate
        env:
          TERMINAL_INDEX_LARGE_GATE: "1"
          TERMINAL_INDEX_LARGE_MIB: "500"
        run: node tests/terminal-index-v1-large-gate.test.js

      - name: Terminal Index 600 MiB bootstrap gate
        env:
          TERMINAL_INDEX_LARGE_GATE: "1"
          TERMINAL_INDEX_LARGE_MIB: "600"
        run: node tests/terminal-index-v1-large-gate.test.js

      - name: Persistence and queue regression gates
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/fila-viva-idempotencia-stale.test.js \
            tests/fila-manifest-state-repository.test.js \
            tests/fila-checkpoint-recovery.test.js \
            tests/fila-historico-leve-v2.test.js \
            tests/fila-historico-leve-jsonl-reparo.test.js \
            tests/storage-manager-incremental.test.js \
            tests/persistence-worker-phase1.test.js \
            tests/persistence-worker-observability.test.js \
            tests/persistence-worker-multiworkspace.test.js \
            tests/persistence-worker-multiworkspace-representative.test.js \
            tests/persistence-worker-crash-matrix.test.js; do
            echo "== $test_file =="
            node "$test_file"
          done

      - name: Runtime contract regression gates
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/demand-scheduler-v1.test.js \
            tests/solenoide-v1.test.js \
            tests/solenoide-radar-config.test.js \
            tests/teleradar-operational-control.test.js \
            tests/ofc-workspace-worker.test.js \
            tests/ofc-fase-1d-observabilidade.test.js; do
            echo "== $test_file =="
            node "$test_file"
          done

      - name: Compare known historical failures with parent baseline
        shell: bash
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/terminal-index-v1-1-parent"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base_dir/node_modules"
          cleanup() { git worktree remove --force "$base_dir"; }
          trap cleanup EXIT

          run_pair() {
            local test_file="$1"
            local signature="$2"
            local stem
            stem=$(basename "$test_file" .js)
            set +e
            (cd "$base_dir" && node "$test_file") > "$RUNNER_TEMP/${stem}.baseline.log" 2>&1
            local baseline_status=$?
            (cd "$GITHUB_WORKSPACE" && node "$test_file") > "$RUNNER_TEMP/${stem}.patch.log" 2>&1
            local patch_status=$?
            set -e
            cat "$RUNNER_TEMP/${stem}.baseline.log"
            cat "$RUNNER_TEMP/${stem}.patch.log"
            test "$baseline_status" -ne 0
            test "$patch_status" -ne 0
            grep -F "$signature" "$RUNNER_TEMP/${stem}.baseline.log"
            grep -F "$signature" "$RUNNER_TEMP/${stem}.patch.log"
            echo "baseline-equivalent: $test_file"
          }

          run_pair tests/fila-store-v2.test.js "4 !== 2"
          run_pair tests/fila-historico-v2-leitura.test.js "GET /fila/status deve continuar existindo"
          run_pair tests/fila-read-model-publico-integracao.test.js "projecao HOT"
